eft the blue pickup in the lot came back for the child.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["\"Came back\" finishes the sentence.","Came back يُتم الجملة."],"family":"ab-fragment","diag":true,"ab":true},{"id":"ab-frag-3","tier":3,"depth":1,"pillar":"written","en":"Because the rear hatch was already open.","ar":"Because the rear hatch was already open.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["\"Because\" leaves a dependent clause with no main clause.","Because تترك جملة تابعة بلا جملة أساسية."],"family":"ab-fragment","retest":true,"ab":true},{"id":"ab-frag-4","tier":2,"depth":1,"pillar":"written","en":"Because the rear hatch was already open, the bags were in plain view.","ar":"Because the rear hatch was already open, the bags were in plain view.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["The \"because\" clause is attached to a complete main clause.","جملة because مربوطة بجملة أساسية كاملة."],"family":"ab-fragment","ab":true},{"id":"ab-frag-5","tier":4,"depth":1,"pillar":"written","en":"Running across the lot with the red bag.","ar":"Running across the lot with the red bag.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["A participle phrase is not a sentence. There is no subject and no finite verb.","عبارة اسم الفاعل ليست جملة. لا فاعل ولا فعل مصرّف."],"family":"ab-fragment","ab":true},{"id":"ab-frag-6","tier":6,"depth":1,"pillar":"written","en":"The clerk pointed, and the runner kept the red bag.","ar":"The clerk pointed, and the runner kept the red bag.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["Two independent clauses joined by \"and\" are a complete sentence.","جملتان مستقلتان مربوطتان بـ and جملة كاملة."],"family":"ab-fragment","ab":true},{"id":"ab-well-1","tier":1,"depth":1,"pillar":"written","en":"Both rookies performed good on the timed report.","ar":"Both rookies performed good on the timed report.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["\"Good\" does not modify the verb \"performed\". The adverb is \"well\".","good لا تصف الفعل performed. الظرف هو well."],"family":"ab-well","diag":true,"ab":true},{"id":"ab-well-2","tier":1,"depth":1,"pillar":"written","en":"Both rookies performed well on the timed report.","ar":"Both rookies performed well on the timed report.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["\"Well\" modifies \"performed\".","well تصف performed."],"family":"ab-well","diag":true,"ab":true},{"id":"ab-well-3","tier":3,"depth":1,"pillar":"written","en":"She writes good when the radio is busy.","ar":"She writes good when the radio is busy.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["The verb \"writes\" needs \"well\".","الفعل writes يحتاج well."],"family":"ab-well","retest":true,"ab":true},{"id":"ab-well-4","tier":2,"depth":1,"pillar":"written","en":"She writes well when the radio is busy.","ar":"She writes well when the radio is busy.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["\"Well\" is the adverb.","well هو الظرف."],"family":"ab-well","ab":true},{"id":"ab-well-5","tier":5,"depth":1,"pillar":"written","en":"A good report is short enough to read once.","ar":"A good report is short enough to read once.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["Here \"good\" modifies the noun \"report\", so the adjective is right.","هنا good تصف الاسم report، فالصفة في محلها."],"family":"ab-well","ab":true},{"id":"ab-well-6","tier":4,"depth":1,"pillar":"written","en":"He felt well was the wrong word, so he wrote good instead.","ar":"He felt well was the wrong word, so he wrote good instead.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["The second clause uses \"good\" to modify \"wrote\". That still wants \"well\".","الجملة الثانية تستخدم good لوصف wrote. والصحيح well."],"family":"ab-well","ab":true},{"id":"ab-homo-1","tier":1,"depth":1,"pillar":"written","en":"The plate was still on they're car.","ar":"The plate was still on they're car.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["\"They're\" means \"they are\". The possessive is \"their\". This is word usage, not a spelling nit.","they're تعني they are. الملكية their. هذا استعمال كلمة لا تدقيق إملاء."],"family":"ab-homo","diag":true,"ab":true},{"id":"ab-homo-2","tier":1,"depth":1,"pillar":"written","en":"The plate was still on their car.","ar":"The plate was still on their car.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["\"Their\" is the possessive that the sentence needs.","their هي الملكية التي تحتاجها الجملة."],"family":"ab-homo","diag":true,"ab":true},{"id":"ab-homo-3","tier":3,"depth":1,"pillar":"written","en":"Park the unit over their, beside the hydrant.","ar":"Park the unit over their, beside the hydrant.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["A place needs \"there\", not the possessive \"their\".","المكان يحتاج there لا الملكية their."],"family":"ab-homo","retest":true,"ab":true},{"id":"ab-homo-4","tier":2,"depth":1,"pillar":"written","en":"Two officers signed the log, not one.","ar":"Two officers signed the log, not one.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["\"Two\" is the number. Nothing in the sentence misuses a homophone.","two هو العدد. لا سوء استعمال لمتشابهات اللفظ."],"family":"ab-homo","ab":true},{"id":"ab-homo-5","tier":4,"depth":1,"pillar":"written","en":"The suspect brake the window and climbed through.","ar":"The suspect brake the window and climbed through.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["The verb is \"broke\". \"Brake\" is the wrong word, not a harmless misspelling of the same word.","الفعل broke. brake كلمة أخرى لا مجرد خطأ إملائي للكلمة نفسها."],"family":"ab-homo","ab":true},{"id":"ab-homo-6","tier":5,"depth":1,"pillar":"written","en":"The witness could not see who was there.","ar":"The witness could not see who was there.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["\"There\" is the place word, and the sentence is otherwise intact.","there كلمة المكان، والجملة سليمة فيما عدا ذلك."],"family":"ab-homo","ab":true}],"reads":[{"id":"r1","tier":1,"depth":1,"pillar":"reading","secs":0,"en":"Officers must notify a supervisor before any vehicle pursuit begins. If the pursuit ends within two blocks, the officer still files a short report the same shift. A pursuit that leaves the district also requires a phone call to dispatch before the officer crosses the line.","ar":"يجب على الضباط إبلاغ مشرف قبل أن تبدأ أي مطاردة مركبة. وإذا انتهت المطاردة خلال مربعين سكنيين، يظل الضابط يودع تقريرًا قصيرًا في النوبة نفسها. والمطاردة التي تغادر المنطقة تتطلب أيضًا اتصالًا بالموزّع قبل أن يجتاز الضابط الحد.","qs":[{"id":"r1a","en":"When is the supervisor told about a pursuit?","ar":"متى يُبلَّغ المشرف بالمطاردة؟","opts":[["Before it begins","قبل أن تبدأ"],["Only if it leaves the district","فقط إذا غادرت المنطقة"],["After the short report","بعد التقرير القصير"],["Only if it lasts more than two blocks","فقط إذا استمرت أكثر من مربعين"]],"ans":0,"why":["The first sentence puts the notice before the start.","الجملة الأولى تضع الإبلاغ قبل البدء."]},{"id":"r1b","en":"A pursuit ends in one block. What else is required?","ar":"مطاردة تنتهي في مربع واحد. ماذا يُطلب أيضًا؟","opts":[["A short report the same shift","تقرير قصير في النوبة نفسها"],["No report","لا تقرير"],["A phone call to dispatch before crossing a line","اتصال بالموزّع قبل اجتياز الحد"],["A new supervisor approval the next day","موافقة مشرف جديدة في اليوم التالي"]],"ans":0,"why":["Ending within two blocks does not cancel the same-shift report.","الانتهاء خلال مربعين لا يلغي تقرير النوبة نفسها."]},{"id":"r1c","en":"Which detail is NOT required by this passage?","ar":"أي تفصيل لا يطلبه هذا المقطع؟","opts":[["The name of the sergeant's child","اسم ابن الرقيب"],["Notice before the pursuit","إبلاغ قبل المطاردة"],["A same-shift report even for a short pursuit","تقرير في النوبة نفسها حتى للمطاردة القصيرة"],["A dispatch call before leaving the district","اتصال بالموزّع قبل مغادرة المنطقة"]],"ans":0,"why":["Nothing in the passage mentions a family name.","لا شيء في المقطع يذكر اسم عائلة."]}]},{"id":"r2","tier":2,"depth":1,"pillar":"reading","secs":0,"en":"Evidence is logged within one hour of collection. If the scene is still active, the officer may wait, but the log is finished before the shift ends. A firearm is never held under the longer allowance: it is logged within 30 minutes of being made safe. The log line includes the time collected, the officer's name, and the location.","ar":"يُسجَّل الدليل خلال ساعة من جمعه. وإذا كان المسرح ما زال نشطًا يجوز للضابط الانتظار، لكن التسجيل يُنهى قبل نهاية النوبة. والسلاح الناري لا يُحبس تحت المهلة الأطول: يُسجَّل خلال 30 دقيقة من جعله آمنًا. ويشمل سطر التسجيل وقت الجمع واسم الضابط والمكان.","qs":[{"id":"r2a","en":"The scene is still active, and the item is a wallet. What is the deadline?","ar":"المسرح ما زال نشطًا، والغرض محفظة. ما المهلة؟","opts":[["Before the shift ends","قبل نهاية النوبة"],["Within 30 minutes","خلال 30 دقيقة"],["Within one hour, with no exception","خلال ساعة بلا استثناء"],["The next shift","النوبة التالية"]],"ans":0,"why":["A wallet can use the active-scene allowance. A firearm cannot.","المحفظة يمكن أن تستخدم مهلة المسرح النشط. السلاح لا يمكن."]},{"id":"r2b","en":"The item is a firearm, made safe at 2:10. By when is it logged?","ar":"الغرض سلاح ناري جُعل آمنًا عند 2:10. متى يُسجَّل؟","opts":[["By 2:40","بحلول 2:40"],["By 3:10","بحلول 3:10"],["Before the shift ends, even if that is tomorrow morning","قبل نهاية النوبة حتى لو كان ذلك صباح الغد"],["No time is stated","لا وقت مذكور"]],"ans":0,"why":["Thirty minutes after 2:10 is 2:40.","ثلاثون دقيقة بعد 2:10 هي 2:40."]},{"id":"r2c","en":"Which of these must be on the log line?","ar":"أي من هذه يجب أن يكون في سطر التسجيل؟","opts":[["Time collected, officer's name, and location","وقت الجمع واسم الضابط والمكان"],["The suspect's school","مدرسة المشتبه به"],["The weather only","الطقس فقط"],["A photo of the officer","صورة للضابط"]],"ans":0,"why":["The last sentence lists those three and no others.","الجملة الأخيرة تذكر هذه الثلاثة ولا غيرها."]}]},{"id":"r3","tier":3,"depth":1,"pillar":"reading","secs":0,"en":"Witness statements are taken one at a time, out of earshot of the other witnesses. The officer writes what the person says they saw, not what the officer thinks happened. If a witness corrects a detail, the officer draws a single line through the old detail, writes the new one, and initials the change. The old detail stays readable.","ar":"تُؤخذ إفادات الشهود واحدة واحدة، بعيدًا عن سمع الشهود الآخرين. ويكتب الضابط ما يقول الشخص إنه رآه، لا ما يظن الضابط أنه حدث. وإذا صحّح شاهد تفصيلًا، يضع الضابط خطًا واحدًا على التفصيل القديم، ويكتب الجديد، ويوقّع بالحروف الأولى. ويبقى التفصيل القديم مقروءًا.","qs":[{"id":"r3a","en":"Why are witnesses separated?","ar":"لماذا يُفصل الشهود؟","opts":[["So they cannot hear one another","حتى لا يسمع أحدهم الآخر"],["So the report is shorter","حتى يكون التقرير أقصر"],["Because the passage says they must be arrested","لأن المقطع يقول إنهم يجب أن يُقبض عليهم"],["So the officer can guess the ending","حتى يستطيع الضابط تخمين النهاية"]],"ans":0,"why":["\"Out of earshot\" is the reason given.","«بعيدًا عن السمع» هو السبب المذكور."]},{"id":"r3b","en":"A witness changes the color of a hat. What happens to the first color?","ar":"شاهد يغيّر لون قبعة. ماذا يحدث للون الأول؟","opts":[["It is lined through but left readable","يُشطب بخط ويبقى مقروءًا"],["It is erased completely","يُمحى تمامًا"],["It is torn out of the page","يُمزق من الصفحة"],["It replaces the new color","يحل محل اللون الجديد"]],"ans":0,"why":["The passage says a single line, and the old detail stays readable.","المقطع يقول خطًا واحدًا، والتفصيل القديم يبقى مقروءًا."]},{"id":"r3c","en":"What does the officer write down?","ar":"ماذا يكتب الضابط؟","opts":[["What the witness says they saw","ما يقول الشاهد إنه رآه"],["What the officer believes is more likely","ما يعتقد الضابط أنه أرجح"],["Only details that match the other witnesses","فقط التفاصيل التي تطابق الشهود الآخرين"],["A guess, labeled as a fact","تخمينًا يُوسم كحقيقة"]],"ans":0,"why":["The second sentence forbids substituting the officer's theory.","الجملة الثانية تمنع استبدال نظرية الضابط."]}]},{"id":"r4","tier":3,"depth":2,"pillar":"reading","secs":0,"en":"A lost child is described over the radio once, then updated only when a detail changes. The first description is: girl, about 6, yellow raincoat, blue boots, holding a gray stuffed dog, last seen by the fountain at 3:05. At 3:18 the mother says the dog is brown, not gray. No other detail changes. Officers still search the fountain area.","ar":"يوصف طفل ضائع عبر اللاسلكي مرة واحدة، ثم يُحدَّث فقط حين يتغير تفصيل. الوصف الأول: بنت، نحو 6 سنوات، معطف مطر أصفر، حذاء أزرق، تمسك كلبًا محشوًا رماديًا، شوهدت آخر مرة عند النافورة الساعة 3:05. وعند 3:18 تقول الأم إن الكلب بني لا رمادي. لا يتغير أي تفصيل آخر. وما زال الضباط يفتشون منطقة النافورة.","qs":[{"id":"r4a","en":"After 3:18, which description is correct?","ar":"بعد 3:18، أي وصف صحيح؟","opts":[["Yellow raincoat, blue boots, brown stuffed dog","معطف أصفر، حذاء أزرق، كلب محشو بني"],["Yellow raincoat, blue boots, gray stuffed dog","معطف أصفر، حذاء أزرق، كلب محشو رمادي"],["Brown raincoat, blue boots, gray dog","معطف بني، حذاء أزرق، كلب رمادي"],["Yellow raincoat, brown boots, brown dog","معطف أصفر، حذاء بني، كلب بني"]],"ans":0,"why":["Only the dog's color was corrected.","لون الكلب وحده هو الذي صُحّح."]},{"id":"r4b","en":"Where was she last seen?","ar":"أين شوهدت آخر مرة؟","opts":[["By the fountain","عند النافورة"],["At the bus stop","عند موقف الحافلة"],["In the parking garage","في مرأب السيارات"],["The passage does not say","المقطع لا يقول"]],"ans":0,"why":["The first description gives the fountain.","الوصف الأول يذكر النافورة."]},{"id":"r4c","en":"What should officers assume about the search area at 3:18?","ar":"ماذا ينبغي أن يفترض الضباط عن منطقة البحث عند 3:18؟","opts":[["They are still searching the fountain area","ما زالوا يفتشون منطقة النافورة"],["The search moved downtown because the dog color changed","انتقل البحث إلى وسط المدينة لأن لون الكلب تغير"],["The search ended at 3:05","انتهى البحث عند 3:05"],["The mother cancelled the report","ألغت الأم البلاغ"]],"ans":0,"why":["The last sentence keeps the search at the fountain.","الجملة الأخيرة تبقي البحث عند النافورة."]}]},{"id":"r5","tier":4,"depth":1,"pillar":"reading","secs":0,"en":"Store policy, posted by the door: employees may not accuse a customer of theft on the sales floor. They may watch, and they may call the police if they see someone conceal merchandise and pass the last register without paying. Until an officer arrives, employees stay between the person and the exit only if they can do so without touching the person. They do not search a bag.","ar":"سياسة المتجر، معلّقة عند الباب: لا يجوز للموظفين اتهام زبون بالسرقة في صالة البيع. ويجوز لهم المراقبة، ويجوز لهم الاتصال بالشرطة إذا رأوا شخصًا يخفي بضاعة ويجتاز آخر صندوق دون دفع. وحتى يصل ضابط، يبقى الموظفون بين الشخص والمخرج فقط إذا استطاعوا ذلك دون لمسه. وهم لا يفتشون حقيبة.","qs":[{"id":"r5a","en":"When may employees call the police, according to this posting?","ar":"متى يجوز للموظفين الاتصال بالشرطة حسب هذا الإعلان؟","opts":[["If they see merchandise concealed and the person pass the last register without paying","إذا رأوا بضاعة مخفاة واجتاز الشخص آخر صندوق دون دفع"],["Whenever a customer looks nervous","كلما بدا الزبون متوترًا"],["Only after they search the bag","فقط بعد تفتيش الحقيبة"],["Only after they accuse the person on the sales floor","فقط بعد اتهام الشخص في صالة البيع"]],"ans":0,"why":["The posting gives those two observed facts as the condition.","الإعلان يجعل هاتين الملاحظتين الشرط."]},{"id":"r5b","en":"What are employees told not to do?","ar":"ماذا يُطلب من الموظفين ألا يفعلوا؟","opts":[["Accuse someone on the sales floor, touch the person, or search a bag","اتهام أحد في الصالة، أو لمسه، أو تفتيش حقيبة"],["Watch the sales floor","مراقبة الصالة"],["Call the police","الاتصال بالشرطة"],["Stand near an exit without touching anyone","الوقوف قرب مخرج دون لمس أحد"]],"ans":0,"why":["Those three limits are stated. Watching and calling are allowed.","هذه الحدود الثلاثة مذكورة. والمراقبة والاتصال مسموحان."]},{"id":"r5c","en":"An employee can block the exit only by grabbing a sleeve. What does the posting allow?","ar":"لا يستطيع الموظف سد المخرج إلا بالإمساك بكم. ماذا يسمح الإعلان؟","opts":[["Do not block that way; do not touch","لا تسد المخرج بهذه الطريقة؛ لا تلمس"],["Grab the sleeve, then search the bag","أمسك الكم ثم فتش الحقيبة"],["Accuse the person first, then grab the sleeve","اتهم الشخص أولًا ثم أمسك الكم"],["The posting requires the grab","الإعلان يوجب الإمساك"]],"ans":0,"why":["Blocking is allowed only without touching.","سد الطريق مسموح فقط دون لمس."]}]},{"id":"r6","tier":4,"depth":2,"pillar":"reading","secs":0,"en":"Radio procedure for this exercise: give your unit, your location, and what you need, in that order. Then stop and listen. If dispatch corrects a detail, repeat the corrected detail back and do not repeat the old one. Numbers are said one digit at a time. Plate HNL 204 is \"H-N-L two zero four,\" not \"two hundred four.\"","ar":"إجراء اللاسلكي في هذا التمرين: اذكر وحدتك، ثم موقعك، ثم ما تحتاجه، بهذا الترتيب. ثم توقف واستمع. وإذا صحّح الموزّع تفصيلًا، أعد التفصيل المصحّح ولا تعد القديم. والأرقام تُقال رقمًا رقمًا. اللوحة HNL 204 هي «H-N-L two zero four»، لا «two hundred four».","qs":[{"id":"r6a","en":"What is the order of a first transmission?","ar":"ما ترتيب الإرسال الأول؟","opts":[["Unit, location, what you need","الوحدة، الموقع، ما تحتاجه"],["What you need, unit, location","ما تحتاجه، الوحدة، الموقع"],["Location only","الموقع فقط"],["The plate, then the unit","اللوحة ثم الوحدة"]],"ans":0,"why":["The first sentence gives that order.","الجملة الأولى تعطي هذا الترتيب."]},{"id":"r6b","en":"Dispatch says the plate is HNL 240, not 204. What do you repeat back?","ar":"يقول الموزّع إن اللوحة HNL 240 لا 204. ماذا تعيدين؟","opts":[["H-N-L two four zero","H-N-L two four zero"],["H-N-L two zero four","H-N-L two zero four"],["Two hundred forty","مئتان وأربعون"],["Both plates, old then new","اللوحتان، القديمة ثم الجديدة"]],"ans":0,"why":["Repeat only the correction, one digit at a time: 2, 4, 0.","أعيدي التصحيح فقط، رقمًا رقمًا: 2 ثم 4 ثم 0."]},{"id":"r6c","en":"After you say what you need, what does the procedure tell you to do?","ar":"بعد أن تقولي ما تحتاجينه، ماذا يطلب منك الإجراء؟","opts":[["Stop and listen","توقفي واستمعي"],["Keep talking until dispatch interrupts","واصلي الكلام حتى يقاطع الموزّع"],["Repeat the old detail twice","كرري التفصيل القديم مرتين"],["Spell your childhood street","تهجّي شارع طفولتك"]],"ans":0,"why":["The second sentence says to stop and listen.","الجملة الثانية تقول توقفي واستمعي."]}]},{"id":"r7","tier":5,"depth":1,"pillar":"reading","secs":0,"en":"A building log says visitors sign in, show a photo ID, and wear a blue sticker on the chest. Contractors wear a yellow sticker and must be escorted above the second floor. A person with no sticker is walked back to the desk, not questioned in the hallway about a crime. At 4:40 the log shows: M. Chen, unit 12C, blue sticker, photo ID checked, entered 4:12. J. Ortiz, contractor, yellow sticker, escorted, entered 4:28, destination roof. No one else signed in after 4:00.","ar":"سجل المبنى يقول إن الزوار يوقّعون، ويبرزون هوية بصورة، ويلبسون ملصقًا أزرق على الصدر. والمقاولون يلبسون ملصقًا أصفر ويجب مرافقتهم فوق الطابق الثاني. والشخص بلا ملصق يُعاد إلى المكتب، ولا يُستجوب في الممر عن جريمة. وعند 4:40 يظهر السجل: M. Chen، الوحدة 12C، ملصق أزرق، فُحصت هوية بصورة، دخل 4:12. J. Ortiz، مقاول، ملصق أصفر، برفقة، دخل 4:28، الوجهة السطح. لم يوقّع أحد آخر بعد 4:00.","qs":[{"id":"r7a","en":"Who may be on the roof at 4:35 under this log?","ar":"من يجوز أن يكون على السطح عند 4:35 حسب هذا السجل؟","opts":[["J. Ortiz, escorted","J. Ortiz برفقة"],["M. Chen, alone","M. Chen وحدها"],["Anyone with a blue sticker","أي شخص بملصق أزرق"],["A person with no sticker","شخص بلا ملصق"]],"ans":0,"why":["Only Ortiz is logged to the roof, and contractors above the second floor are escorted.","أورتيز وحده مسجّل إلى السطح، والمقاولون فوق الطابق الثاني بمرافقة."]},{"id":"r7b","en":"You see a person in the hallway with no sticker. What does the log's rule say to do?","ar":"ترين شخصًا في الممر بلا ملصق. ماذا تقول قاعدة السجل؟","opts":[["Walk them back to the desk","أعيديهم إلى المكتب"],["Question them in the hallway about a theft","استجوبهم في الممر عن سرقة"],["Send them to the roof","أرسلهم إلى السطح"],["Issue a yellow sticker in the hallway","أصدر ملصقًا أصفر في الممر"]],"ans":0,"why":["The rule sends an unstickered person back to the desk and bars a hallway crime interview.","القاعدة تعيد الشخص بلا ملصق إلى المكتب وتمنع استجواب جريمة في الممر."]},{"id":"r7c","en":"What time did M. Chen enter?","ar":"في أي وقت دخل M. Chen؟","opts":[["4:12","4:12"],["4:28","4:28"],["4:40","4:40"],["4:00","4:00"]],"ans":0,"why":["Chen's line says entered 4:12. 4:40 is when you are reading the log.","سطر تشين يقول دخل 4:12. و4:40 هو وقت قراءتك للسجل."]}]},{"id":"r8","tier":6,"depth":1,"pillar":"reading","secs":0,"en":"Use only this notice. Shift bids close Friday at 4:00 PM. A bid submitted at 4:00 PM is on time. A bid submitted at 4:01 PM is late and is not read. Officers with less than one year on the job may bid, but they are placed after every officer who has a year or more, even if the newer officer bid first. If two qualified officers bid the same post, the earlier bid wins. If the times match to the minute, the lower badge number wins. Badge 214 bid post 3 at 3:40. Badge 188 bid post 3 at 3:40. Both have more than a year.","ar":"استخدمي هذا الإعلان فقط. تُقفل طلبات النوبة يوم الجمعة الساعة 4:00 مساءً. الطلب المقدَّم عند 4:00 في الوقت. والطلب عند 4:01 متأخر ولا يُقرأ. والضباط الذين لهم أقل من سنة يجوز لهم الطلب، لكنهم يُرتَّبون بعد كل ضابط له سنة أو أكثر، حتى لو طلب الضابط الأحدث أولًا. وإذا طلب ضابطان مؤهلان الموقع نفسه يفوز الطلب الأسبق. وإذا تطابق الوقت حتى الدقيقة يفوز رقم الشارة الأصغر. الشارة 214 طلبت الموقع 3 عند 3:40. الشارة 188 طلبت الموقع 3 عند 3:40. وكلاهما له أكثر من سنة.","qs":[{"id":"r8a","en":"Who wins post 3?","ar":"من يفوز بالموقع 3؟","opts":[["Badge 188","الشارة 188"],["Badge 214","الشارة 214"],["Neither, because the times match","لا أحد، لأن الوقتين متطابقان"],["Whichever officer has less than a year","أي ضابط له أقل من سنة"]],"ans":0,"why":["The times match, both are qualified, and 188 is the lower badge number.","الوقتان متطابقان، وكلاهما مؤهل، و188 هو رقم الشارة الأصغر."]},{"id":"r8b","en":"A bid arrives at 4:01 PM from an officer with ten years on the job. What happens?","ar":"يصل طلب عند 4:01 مساءً من ضابط له عشر سنوات. ماذا يحدث؟","opts":[["It is late and is not read","إنه متأخر ولا يُقرأ"],["It wins, because of seniority","يفوز بسبب الأقدمية"],["It is on time, because 4:00 was the close","إنه في الوقت لأن 4:00 كان الإقفال"],["It is placed first","يُوضع أولًا"]],"ans":0,"why":["4:01 is late for everyone. Seniority is not an exception to the clock.","4:01 متأخر للجميع. والأقدمية ليست استثناء من الساعة."]},{"id":"r8c","en":"A new officer, month six, bids a post at 2:00 PM. A one-year officer bids the same post at 3:50 PM. Who is placed first?","ar":"ضابط جديد، الشهر السادس، يطلب موقعًا عند 2:00 مساءً. وضابط له سنة يطلب الموقع نفسه عند 3:50. من يُوضع أولًا؟","opts":[["The one-year officer","الضابط الذي له سنة"],["The new officer, because 2:00 is earlier","الضابط الجديد لأن 2:00 أسبق"],["Neither can bid","لا يجوز لأي منهما الطلب"],["The new officer, then the bids are not read","الضابط الجديد، ثم لا تُقرأ الطلبات"]],"ans":0,"why":["Less than one year may bid, but is placed after everyone with a year or more.","أقل من سنة يجوز له الطلب، لكنه يُرتَّب بعد كل من له سنة أو أكثر."]}]},{"id":"r9","tier":6,"depth":2,"pillar":"reading","secs":0,"en":"A witness says: \"I think the driver was a man, but I only saw the back of a red cap and a gray hoodie. I am sure about the red cap. I am not sure about the hoodie. The car was a black sedan, plate starting with K, and it turned east. I did not see who was in the passenger seat.\" Use only what the witness marks as sure, plus the facts stated without a doubt.","ar":"يقول شاهد: «أعتقد أن السائق كان رجلًا، لكني رأيت فقط ظهر قبعة حمراء وقلنسوة رمادية. أنا متأكد من القبعة الحمراء. لست متأكدًا من القلنسوة. السيارة كانت سيدان سوداء، لوحتها تبدأ بـ K، وانعطفت شرقًا. لم أرَ من كان في مقعد الراكب.» استخدمي فقط ما يصفه الشاهد بالمؤكد، إضافة إلى الوقائع المذكورة بلا شك.","qs":[{"id":"r9a","en":"Which set is safe to put in the report as the witness's account?","ar":"أي مجموعة آمنة لتوضع في التقرير بوصفها رواية الشاهد؟","opts":[["Red cap; black sedan; plate starts with K; turned east; passenger not seen","قبعة حمراء؛ سيدان سوداء؛ اللوحة تبدأ بـ K؛ انعطفت شرقًا؛ الراكب لم يُرَ"],["Male driver; gray hoodie; red cap; black sedan","سائق رجل؛ قلنسوة رمادية؛ قبعة حمراء؛ سيدان سوداء"],["Gray hoodie; passenger was a woman; plate starts with K","قلنسوة رمادية؛ الراكب امرأة؛ اللوحة تبدأ بـ K"],["Red cap only. The car details were guesses.","القبعة الحمراء فقط. وتفاصيل السيارة كانت تخمينًا."]],"ans":0,"why":["He is sure of the cap. The car, plate start, turn, and unseen passenger are stated as facts. The man and the gray hoodie are not sure.","هو متأكد من القبعة. والسيارة وبداية اللوحة والانعطاف والراكب غير المرئي مذكورة كوقائع. والرجل والقلنسوة الرمادية ليسا مؤكدين."]},{"id":"r9b","en":"What does the witness say about the passenger seat?","ar":"ماذا يقول الشاهد عن مقعد الراكب؟","opts":[["He did not see who was in it","لم يرَ من كان فيه"],["A woman was in it","كانت فيه امرأة"],["It was empty, and he is sure","كان فارغًا وهو متأكد"],["The passage does not mention it","المقطع لا يذكره"]],"ans":0,"why":["The last clause is the whole fact: he did not see the passenger.","الجملة الأخيرة هي الواقعة كلها: لم يرَ الراكب."]},{"id":"r9c","en":"Which detail did the witness mark as unsure?","ar":"أي تفصيل وصفه الشاهد بغير المؤكد؟","opts":[["The gray hoodie","القلنسوة الرمادية"],["The red cap","القبعة الحمراء"],["The turn to the east","الانعطاف شرقًا"],["The black sedan","السيدان السوداء"]],"ans":0,"why":["He says he is not sure about the hoodie, and he is sure about the cap.","يقول إنه غير متأكد من القلنسوة، ومتأكد من القبعة."]}]}],"comps":[{"id":"c1","tier":2,"depth":1,"pillar":"comp","secs":0,"en":"Notice: dogs in the park must be on a leash before 6 PM. After 6 PM, a dog may be off leash in the fenced field only. The beach path is never an off-leash area. At 6:30 a dog is running on the beach path.","ar":"إعلان: الكلاب في الحديقة يجب أن تكون بمقود قبل 6 مساءً. وبعد 6 مساءً يجوز أن يكون الكلب بلا مقود في الميدان المسيّج فقط. وممر الشاطئ ليس منطقة بلا مقود أبدًا. وعند 6:30 كلب يجري في ممر الشاطئ.","qs":[{"id":"c1a","en":"Is the dog where the notice allows it to be off leash?","ar":"هل الكلب حيث يسمح الإعلان بأن يكون بلا مقود؟","opts":[["No","لا"],["Yes, because it is after 6 PM","نعم، لأنه بعد 6 مساءً"],["Yes, because the beach path is a field","نعم، لأن ممر الشاطئ ميدان"],["The notice does not mention paths","الإعلان لا يذكر الممرات"]],"ans":0,"why":["After 6, off leash is only the fenced field. The beach path is never off leash.","بعد 6، بلا مقود يعني الميدان المسيّج فقط. وممر الشاطئ ليس كذلك أبدًا."]},{"id":"c1b","en":"Where may a dog be off leash at 6:30?","ar":"أين يجوز أن يكون الكلب بلا مقود عند 6:30؟","opts":[["In the fenced field","في الميدان المسيّج"],["On the beach path","في ممر الشاطئ"],["Anywhere in the park","في أي مكان في الحديقة"],["Nowhere","لا مكان"]],"ans":0,"why":["The exception is the fenced field only.","الاستثناء هو الميدان المسيّج فقط."]},{"id":"c1c","en":"A dog is off leash in the fenced field at 5:30. What does the notice require?","ar":"كلب بلا مقود في الميدان المسيّج عند 5:30. ماذا يطلب الإعلان؟","opts":[["A leash, because it is before 6 PM","مقودًا، لأنه قبل 6 مساءً"],["Nothing; the field is always off leash","لا شيء؛ الميدان بلا مقود دائمًا"],["That the dog move to the beach path","أن ينتقل الكلب إلى ممر الشاطئ"],["That the park close","أن تُغلق الحديقة"]],"ans":0,"why":["Before 6 PM the leash rule has no field exception.","قبل 6 مساءً قاعدة المقود بلا استثناء للميدان."]}]},{"id":"c2","tier":3,"depth":1,"pillar":"comp","secs":0,"en":"You read one note, then it is covered. \"Unit 12, meet the clerk at 1420 King, gray door, second floor. The clerk will be in a green apron. Do not interview the customer in the red hat; that person already left a statement with Unit 4. The safe is open. A blue backpack is under the counter, and the clerk says it is not store property.\"","ar":"تقرئين ورقة واحدة ثم تُغطى. «الوحدة 12، قابلي البائع عند 1420 كينغ، باب رمادي، الطابق الثاني. البائع سيكون بمئزر أخضر. لا تستجوب الزبون ذي القبعة الحمراء؛ ذلك الشخص ترك إفادة مع الوحدة 4. الخزنة مفتوحة. حقيبة ظهر زرقاء تحت المنضدة، والبائع يقول إنها ليست ملك المتجر.»","qs":[{"id":"c2a","en":"What color is the clerk's apron?","ar":"ما لون مئزر البائع؟","opts":[["Green","أخضر"],["Red","أحمر"],["Blue","أزرق"],["Gray","رمادي"]],"ans":0,"why":["The apron is green. Red is the hat. Blue is the backpack. Gray is the door.","المئزر أخضر. الأحمر القبعة. الأزرق الحقيبة. الرمادي الباب."]},{"id":"c2b","en":"What are you told about the customer in the red hat?","ar":"ماذا يُقال لك عن الزبون ذي القبعة الحمراء؟","opts":[["Do not interview that person; Unit 4 already took a statement","لا تستجوب هذا الشخص؛ الوحدة 4 أخذت إفادة"],["Interview that person first","استجوب هذا الشخص أولًا"],["That person owns the blue backpack","هذا الشخص يملك الحقيبة الزرقاء"],["The note does not mention a red hat","الورقة لا تذكر قبعة حمراء"]],"ans":0,"why":["The note bars a second interview.","الورقة تمنع مقابلة ثانية."]},{"id":"c2c","en":"Which fact is stated, not guessed?","ar":"أي واقعة مذكورة وليست تخمينًا؟","opts":[["The safe is open","الخزنة مفتوحة"],["The backpack was stolen","الحقيبة سُرقت"],["The customer in the red hat opened the safe","الزبون ذو القبعة الحمراء فتح الخزنة"],["Unit 4 is still inside","الوحدة 4 ما زالت في الداخل"]],"ans":0,"why":["Only the open safe is stated. The other lines add a story the note does not tell.","الخزنة المفتوحة وحدها مذكورة. الأسطر الأخرى تضيف قصة لا تقولها الورقة."]}]},{"id":"c3","tier":4,"depth":1,"pillar":"comp","secs":0,"en":"Procedure: write the plate, then the color, then the direction, then the street. If you did not see a detail, write \"not seen\". Do not fill it from another car. Car A: plate KLM 119, color not seen, headed west on Beretania. Car B: plate KLM 191, white, headed east on King. A later note says, \"Car A color correction: black. Plate stands.\"","ar":"الإجراء: اكتبي اللوحة، ثم اللون، ثم الاتجاه، ثم الشارع. وإذا لم تري تفصيلًا اكتبي «لم يُرَ». ولا تملئيه من سيارة أخرى. السيارة أ: لوحة KLM 119، اللون لم يُرَ، اتجهت غربًا في بيريتانيا. السيارة ب: لوحة KLM 191، بيضاء، اتجهت شرقًا في كينغ. وملاحظة لاحقة تقول: «تصحيح لون السيارة أ: أسود. اللوحة تبقى.»","qs":[{"id":"c3a","en":"After the correction, what is Car A?","ar":"بعد التصحيح، ما السيارة أ؟","opts":[["KLM 119, black, west on Beretania","KLM 119، سوداء، غربًا في بيريتانيا"],["KLM 191, white, west on Beretania","KLM 191، بيضاء، غربًا في بيريتانيا"],["KLM 119, white, east on King","KLM 119، بيضاء، شرقًا في كينغ"],["KLM 119, not seen, west on Beretania","KLM 119، لم يُرَ، غربًا في بيريتانيا"]],"ans":0,"why":["The correction changes only Car A's color. The plate and direction stay.","التصحيح يغيّر لون السيارة أ فقط. اللوحة والاتجاه يبقيان."]},{"id":"c3b","en":"Before the correction, what should the color line for Car A have said?","ar":"قبل التصحيح، ماذا كان ينبغي أن يقول سطر لون السيارة أ؟","opts":[["not seen","لم يُرَ"],["white","أبيض"],["black","أسود"],["the same as Car B","مثل السيارة ب"]],"ans":0,"why":["The procedure says to write \"not seen\" rather than borrow Car B's white.","الإجراء يقول اكتبي «لم يُرَ» بدل استعارة أبيض السيارة ب."]},{"id":"c3c","en":"Which plate belongs to the white car headed east?","ar":"أي لوحة للسيارة البيضاء المتجهة شرقًا؟","opts":[["KLM 191","KLM 191"],["KLM 119","KLM 119"],["KLM 911","KLM 911"],["No plate was given","لم تُعطَ لوحة"]],"ans":0,"why":["That is Car B, unchanged by a correction that named Car A.","هذه السيارة ب، ولم يغيّرها تصحيح سمّى السيارة أ."]}]},{"id":"c4","tier":5,"depth":1,"pillar":"comp","secs":0,"en":"Two rules are posted. Rule A: visitors leave by 9 PM. Rule B: a nurse on duty may stay, and one family member with a blue band may stay with a patient after 9. At 9:20 you see three people: a nurse with a badge, a woman with a blue band sitting with a patient, and a man with no band sitting in a second patient's room.","ar":"قاعدتان معلّقتان. القاعدة أ: يغادر الزوار عند 9 مساءً. القاعدة ب: ممرضة في النوبة يجوز لها البقاء، وقريب واحد بسوار أزرق يجوز له البقاء مع مريض بعد 9. وعند 9:20 ترين ثلاثة: ممرضة بشارة، وامرأة بسوار أزرق جالسة مع مريض، ورجل بلا سوار جالس في غرفة مريض ثانٍ.","qs":[{"id":"c4a","en":"Who is out of line with the posted rules?","ar":"من يخالف القواعد المعلّقة؟","opts":[["The man with no band, still in a patient's room","الرجل بلا سوار، ما زال في غرفة مريض"],["The nurse","الممرضة"],["The woman with the blue band","المرأة ذات السوار الأزرق"],["No one described is out of line","لا أحد ممن وُصفوا يخالف"]],"ans":0,"why":["The nurse and the blue band are allowed after 9. A man with no band who is still in a room is a visitor past the deadline.","الممرضة والسوار الأزرق مسموحان بعد 9. والرجل بلا سوار الذي ما زال في غرفة زائر بعد المهلة."]},{"id":"c4b","en":"The woman with the blue band is with a patient at 9:20. What does Rule B allow?","ar":"المرأة ذات السوار الأزرق مع مريض عند 9:20. ماذا تسمح القاعدة ب؟","opts":[["She may stay","يجوز لها البقاء"],["She must leave because it is after 9","يجب أن تغادر لأنه بعد 9"],["She may stay only if she is the nurse","يجوز لها البقاء فقط إذا كانت الممرضة"],["She must take off the band","يجب أن تنزع السوار"]],"ans":0,"why":["Rule B names exactly this person.","القاعدة ب تسمي هذا الشخص تحديدًا."]},{"id":"c4c","en":"Which person does Rule A, read alone, tell to leave at 9?","ar":"أي شخص تقول له القاعدة أ وحدها أن يغادر عند 9؟","opts":[["Visitors, before the exception in Rule B is applied","الزوار، قبل تطبيق الاستثناء في القاعدة ب"],["The nurse on duty","الممرضة في النوبة"],["No one; Rule A is about parking","لا أحد؛ القاعدة أ عن المواقف"],["Only people with a blue band","فقط من معهم سوار أزرق"]],"ans":0,"why":["Rule A covers visitors. Rule B is what carves out the nurse and the blue band.","القاعدة أ تشمل الزوار. والقاعدة ب هي التي تستثني الممرضة والسوار الأزرق."]}]},{"id":"c5","tier":6,"depth":1,"pillar":"comp","secs":0,"en":"A dispatcher says: \"Correction. Disregard the white van on King. The vehicle is a white van on Hotel Street, plate PLM 316, headed east, driver described as a woman with a dark braid. The King Street van is unrelated and is blue. Repeat the Hotel Street details only.\"","ar":"يقول الموزّع: «تصحيح. تجاهلوا الشاحنة البيضاء في كينغ. المركبة شاحنة بيضاء في شارع هوتيل، لوحتها PLM 316، تتجه شرقًا، والسائق وُصف بامرأة ذات ضفيرة داكنة. وشاحنة شارع كينغ غير متعلقة وهي زرقاء. أعدوا تفاصيل شارع هوتيل فقط.»","qs":[{"id":"c5a","en":"Which vehicle are you following after the correction?","ar":"أي مركبة تتبعين بعد التصحيح؟","opts":[["White van, Hotel Street, PLM 316, east, woman with a dark braid","شاحنة بيضاء، شارع هوتيل، PLM 316، شرقًا، امرأة بضفيرة داكنة"],["White van on King","شاحنة بيضاء في كينغ"],["Blue van on Hotel Street","شاحنة زرقاء في شارع هوتيل"],["Blue van, King Street, PLM 316","شاحنة زرقاء، شارع كينغ، PLM 316"]],"ans":0,"why":["The correction names Hotel Street and tells you to drop the King Street van.","التصحيح يسمي شارع هوتيل ويطلب منك إسقاط شاحنة كينغ."]},{"id":"c5b","en":"What is the King Street van, after the correction?","ar":"ما شاحنة شارع كينغ بعد التصحيح؟","opts":[["Blue, and unrelated","زرقاء، وغير متعلقة"],["White, plate PLM 316","بيضاء، لوحة PLM 316"],["The vehicle to follow","المركبة التي تُتبع"],["Driven by the woman with the braid","تقودها المرأة ذات الضفيرة"]],"ans":0,"why":["The last factual sentence before the repeat order says it is unrelated and blue.","الجملة الواقعية الأخيرة قبل أمر الإعادة تقول إنها غير متعلقة وزرقاء."]},{"id":"c5c","en":"What are you told to repeat?","ar":"ماذا يُطلب منك أن تعيدي؟","opts":[["The Hotel Street details only","تفاصيل شارع هوتيل فقط"],["Both vans","الشاحنتين"],["The disregarded detail, so everyone hears it again","التفصيل المتجاهَل حتى يسمعه الجميع مرة أخرى"],["Nothing; corrections are not repeated","لا شيء؛ التصحيحات لا تُعاد"]],"ans":0,"why":["The last sentence is the repeat order.","الجملة الأخيرة هي أمر الإعادة."]}]}],"listens":[{"id":"ls1","tier":1,"depth":1,"pillar":"listen","secs":40,"en":"Unit 12, a wallet was turned in at the front desk of 200 Ala Moana, at 1:10 PM. Brown wallet, no cash, a blue bus pass inside. The clerk is wearing a white shirt. Meet the clerk, not the security guard.","ar":"الوحدة 12، سُلّمت محفظة في مكتب الاستقبال في 200 ألا موانا، الساعة 1:10 ظهرًا. محفظة بنية، بلا نقد، وبها تذكرة حافلة زرقاء. البائع يلبس قميصًا أبيض. قابلي البائع لا حارس الأمن.","qs":[{"id":"ls1a","en":"Where do you go?","ar":"إلى أين تذهبين؟","opts":[["Front desk, 200 Ala Moana","مكتب الاستقبال، 200 ألا موانا"],["The bus stop","موقف الحافلة"],["The security office","مكتب الأمن"],["Unit 4's car","سيارة الوحدة 4"]],"ans":0,"why":["The address and the desk are the place.","العنوان والمكتب هما المكان."]},{"id":"ls1b","en":"What is inside the wallet?","ar":"ماذا داخل المحفظة؟","opts":[["A blue bus pass, and no cash","تذكرة حافلة زرقاء، وبلا نقد"],["Cash and a red pass","نقد وتذكرة حمراء"],["A phone","هاتف"],["Nothing was said","لم يُقل شيء"]],"ans":0,"why":["Those two details were in the call.","هذان التفصيلان كانا في البلاغ."]},{"id":"ls1c","en":"Whom do you meet?","ar":"من تقابلين؟","opts":[["The clerk in the white shirt","البائع بالقميص الأبيض"],["The security guard","حارس الأمن"],["The bus driver","سائق الحافلة"],["No one; leave the wallet","لا أحد؛ اتركي المحفظة"]],"ans":0,"why":["The call says the clerk, not the guard.","البلاغ يقول البائع لا الحارس."]}]},{"id":"ls2","tier":2,"depth":1,"pillar":"listen","secs":40,"en":"Be advised, a child in a yellow raincoat is with the attendant at the Zoo entrance, not at the fountain. The attendant has a red cap. The child's aunt is on the way and will show a photo ID. Do not release the child to anyone without that ID.","ar":"تنبيه، طفل بمعطف مطر أصفر مع الموظف عند مدخل الحديقة، لا عند النافورة. الموظف يلبس قبعة حمراء. عمة الطفل في الطريق وستبرز هوية بصورة. لا تسلّمي الطفل لأحد بلا تلك الهوية.","qs":[{"id":"ls2a","en":"Where is the child?","ar":"أين الطفل؟","opts":[["Zoo entrance, with the attendant","مدخل الحديقة، مع الموظف"],["At the fountain","عند النافورة"],["In a yellow taxi","في تاكسي أصفر"],["The call did not say","البلاغ لم يقل"]],"ans":0,"why":["The call moves the child off the fountain and onto the entrance.","البلاغ ينقل الطفل من النافورة إلى المدخل."]},{"id":"ls2b","en":"What is the attendant wearing?","ar":"ماذا يلبس الموظف؟","opts":[["A red cap","قبعة حمراء"],["A yellow raincoat","معطف مطر أصفر"],["A blue badge only","شارة زرقاء فقط"],["A green apron","مئزرًا أخضر"]],"ans":0,"why":["The raincoat is the child's. The cap is the attendant's.","معطف المطر للطفل. والقبعة للموظف."]},{"id":"ls2c","en":"When may the child leave with an adult?","ar":"متى يجوز أن يغادر الطفل مع بالغ؟","opts":[["When the aunt shows a photo ID","حين تبرز العمة هوية بصورة"],["As soon as any adult arrives","حالما يصل أي بالغ"],["Only if the adult wears yellow","فقط إذا لبس البالغ أصفر"],["The call says to release the child immediately","البلاغ يقول سلّمي الطفل فورًا"]],"ans":0,"why":["The last sentence is a hold until the ID.","الجملة الأخيرة إبقاء حتى الهوية."]}]},{"id":"ls3","tier":3,"depth":1,"pillar":"listen","secs":45,"en":"Two calls, do not mix them. Call 1: burglary alarm, 88 Piikoi, apartment 3B, manager in a blue vest will meet you at the lobby. Call 2: a loose dog, brown, هد بقي عند الزاوية.","qs":[{"id":"ls4a","en":"After the correction, how is the suspect traveling?","ar":"بعد التصحيح، كيف يتحرك المشتبه به؟","opts":[["On foot","راجلًا"],["On the red bicycle","على الدراجة الحمراء"],["In a red car","في سيارة حمراء"],["The call cancelled the suspect","البلاغ ألغى المشتبه به"]],"ans":0,"why":["The correction says on foot.","التصحيح يقول راجلًا."]},{"id":"ls4b","en":"What still matches the first description?","ar":"ما الذي ما زال يطابق الوصف الأول؟","opts":[["Black helmet, headed west on Young Street","خوذة سوداء، يتجه غربًا في شارع يونغ"],["Red bicycle and red jacket","دراجة حمراء وسترة حمراء"],["The witness left on the bicycle","الشاهد غادر على الدراجة"],["Headed east on Kalakaua","يتجه شرقًا في كالاناوا"]],"ans":0,"why":["Helmet, direction, and street were not changed. The jacket is new. The bicycle moved to the witness.","الخوذة والاتجاه والشارع لم تتغير. السترة جديدة. والدراجة انتقلت إلى الشاهد."]},{"id":"ls4c","en":"Who has the red bicycle?","ar":"من معه الدراجة الحمراء؟","opts":[["A witness who stayed at the corner","شاهد بقي عند الزاوية"],["The suspect","المشتبه به"],["No one; it was a mistake and there is no bicycle","لا أحد؛ كان خطأ ولا دراجة"],["The dispatcher","الموزّع"]],"ans":0,"why":["The last sentence places the bicycle with the witness.","الجملة الأخيرة تضع الدراجة مع الشاهد."]}]},{"id":"ls5","tier":5,"depth":1,"pillar":"listen","secs":50,"en":"Parking level P2, stall 18. Two black sedans. Sedan 1, plate NRP 441, dent on the left rear door, driver is a woman with a braid and a white shirt, engine on. Sedan 2, plate NRP 414, no dent, empty. A white van, plate PLB 902, is stopped at the ramp, driver on a ladder at the sign, unrelated. The reporting person points at Sedan 1. Repeat 441, not 414.","ar":"مستوى الموقف P2، الموقف 18. سيدان سوداوان. السيدان 1، لوحة NRP 441، انبعاج في الباب الخلفي الأيسر، السائقة امرأة بضفيرة وقميص أبيض، المحرك يعمل. السيدان 2، لوحة NRP 414، بلا انبعاج، فارغة. شاحنة بيضاء، لوحة PLB 902، متوقفة عند المنحدر، سائقها على سلّم عند اللافتة، غير متعلقة. والمبلّغ يشير إلى السيدان 1. أعيدي 441 لا 414.","qs":[{"id":"ls5a","en":"Which plate does the reporting person indicate?","ar":"أي لوحة يشير إليها المبلّغ؟","opts":[["NRP 441","NRP 441"],["NRP 414","NRP 414"],["PLB 902","PLB 902"],["No plate was given","لم تُعطَ لوحة"]],"ans":0,"why":["Sedan 1 is 441, and that is the one indicated. The repeat line says not 414.","السيدان 1 هي 441، وهي المشار إليها. وسطر الإعادة يقول ليس 414."]},{"id":"ls5b","en":"What is different about the empty sedan?","ar":"ما المختلف في السيدان الفارغة؟","opts":[["No dent, plate NRP 414","بلا انبعاج، لوحة NRP 414"],["A dent, and a driver with a braid","انبعاج، وسائقة بضفيرة"],["It is white","إنها بيضاء"],["It is on a ramp with a ladder","إنها على منحدر مع سلّم"]],"ans":0,"why":["Sedan 2 is the empty one: 414, no dent. The ladder belongs to the van.","السيدان 2 هي الفارغة: 414، بلا انبعاج. والسلّم للشاحنة."]},{"id":"ls5c","en":"What is the driver of Sedan 1 wearing?","ar":"ماذا تلبس سائقة السيدان 1؟","opts":[["A white shirt, and she has a braid","قميصًا أبيض، ولها ضفيرة"],["A black helmet","خوذة سوداء"],["A blue vest","سترة زرقاء"],["The sedan is empty","السيدان فارغة"]],"ans":0,"why":["Those details are on Sedan 1 only.","هذان التفصيلان على السيدان 1 فقط."]}]},{"id":"ls6","tier":6,"depth":2,"pillar":"listen","secs":50,"en":"Night call, 9:52 PM, bus stop Beretania at Piikoi, route 2, bus 214. First version: a person in a brown jacket boarded. Correction at 9:54: the jacket is red, not brown. White sneakers, gray backpack, boarded. A second person in a yellow dress with a black umbrella stayed on the bench. A bald man in an orange shirt was on a phone and did not board. The streetlight on the east end of the stop is out. A blue pickup, plate TUV 330, drove west and is not part of the call.","ar":"بلاغ ليلي، 9:52 مساءً، موقف بيريتانيا عند بييكوي، الخط 2، الحافلة 214. الرواية الأولى: شخص بسترة بنية صعد. تصحيح عند 9:54: السترة حمراء لا بنية. حذاء ر  عند موقف الحافلة رقم 13 ممسكًا هاتفًا. امرأة بيضاء الشعر بفستان بنفسجي تحمل مظلة صفراء أمام ISLAND PHARMACY (1460). يوجد صنبور إطفاء أحمر. في الشارع: شاحنة بيضاء لـ ALOHA PLUMBING (808-555-0142، لوحة PLM 316)، وسيارة سيدان زرقاء (لوحة HCX 804)، وشاحنة بيك أب خضراء (لوحة KTB 529) متجهة شرقًا تقودها امرأة بضفيرة داكنة وقميص أصفر، وسيارة أجرة صفراء (CAB 77). لافتة المتجر تقول OPEN وتعلن عن POKE بسعر 12.99 دولارًا.","qs":[{"en":"3:47 — What time was shown.","ar":"3:47 — ما الوقت الذي كان معروضًا.","opts":[["A. The statement is true.","A. العبارة صحيحة."],["B. The statement is false.","B. العبارة خطأ."]],"ans":0,"why":["It is in the picture.","هذا في الصورة."]},{"en":"KALANI MARKET — What was the market's name.","ar":"KALANI MARKET — ما اسم المتجر.","opts":[["A. The statement is true.","A. العبارة صحيحة."],["B. The statement is false.","B. العبارة خطأ."]],"ans":0,"why":["It is in the picture.","هذا في الصورة."]},{"en":"1452 — What was the market's street number.","ar":"1452 — ما رقم المتجر في الشارع.","opts":[["A. The statement is true.","A. العبارة صحيحة."],["B. The statement is false.","B. العبارة خطأ."]],"ans":0,"why":["It is in the picture.","هذا في الصورة."]},{"en":"Kaheka St — Which street was the market on.","ar":"Kaheka St — في أي شارع كان المتجر.","opts":[["A. The statement is true.","A. العبارة صحيحة."],["B. The statement is false.","B. العبارة خطأ."]],"ans":1,"why":["It is in the picture.","هذا في الصورة."]},{"en":"Kaheka St — Which cross street was on the sign.","ar":"Kaheka St — ما اسم الشارع المتقاطع على اللافتة.","opts":[["A. The statement is true.","A. العبارة صحيحة."],["B. The statement is false.","B. العبارة خطأ."]],"ans":0,"why":["It is in the picture.","هذا في الصورة."]},{"en":"Red — What color was the running man's cap.","ar":"أحمر — ما لون قبعة الرجل الذي يجري.","opts":[["A. The statement is true.","A. العبارة صحيحة."],["B. The statement is false.","B. العبارة خطأ."]],"ans":0,"why":["It is in the picture.","هذا في الصورة."]},{"en":"Gray — What colo     if (item.pillar === "logic") return ["Logic: rules and order", "المنطق: القواعد والترتيب"];
    if (item.pillar === "reading" || item.pillar === "comp") return ["Reading: the passage", "القراءة: المقطع"];
    if (item.pillar === "listen") return ["Listening: radio calls", "الاستماع: النداءات"];
    if (item.pillar === "obs") return ["Observation: the scene", "الملاحظة: المشهد"];
    return ["This quiz", "هذا الاختبار"];
  }
  var PIL_AR = { logic: "المنطق", reading: "القراءة", comp: "الفهم", listen: "الاستماع", obs: "الملاحظة", grammar: "القواعد", written: "الكتابة" };
  function weekAr(n) {
    return { 1: "الأول", 2: "الثاني", 3: "الثالث", 4: "الرابع" }[n] || String(n);
  }
  function listBi(enList, arMap) {
    var en = enList.join(", ");
    var ar = enList.map(function (x) { return arMap[x] || x; }).join("، ");

  }

  function renderSummary(dayN) {
    var el = document.getElementById("hs-summary");
    if (!el) return;
    var row = state.days && state.days[String(dayN)];
    var list = (row && row.quizzes) || [];
    if (!list.length) { el.innerHTML = ""; return; }
    el.innerHTML = "<h2>" + bi("Today", "هذا اليوم") + "</h2><ul>"
      + list.map(function (q) {
        if (q.key === "bio") return "<li>" + bi(q.label_en, q.label_ar) + "</li>";
        return "<li>" + bi(q.label_en + ": " + q.pct + "% (" + q.ok + "/" + q.n + ")", q.label_ar + ": " + q.pct + "% (" + q.ok + "/" + q.n + ")") + "</li>";
      }).join("") + "</ul>";
  }
  function rememberQuiz(dayN, rec) {
    state.days = state.days || {};
    var row = state.days[String(dayN)] || {};
    var list = (row.quizzes || []).filter(function (q) { return q.key !== rec.key; });
    list.push(rec);
    row.quizzes = list;
    state.days[String(dayN)] = row;
  }
  function collectLines(blocks, ans) {
    var lines = [];
    var i = 0;
    function push(item, given) {
      lines.push({ item: item, given: given, good: given === item.ans });
    }
    (blocks || []).forEach(function (b) {
      if (b.kind === "q") { push(b.item, ans[i]); i += 1; }
      else (b.set.qs || []).forEach(function (q) {
        push(Object.assign({ pillar: b.set.pillar, family: q.family, why: q.why, opts: q.opts, ans: q.ans, en: q.en, ar: q.ar }, q), ans[i]);
        i += 1;
      });
    });
    return lines;
  }
  function resultsPanel(titleEn, titleAr, lines) {
    var ok = lines.filter(function (l) { return l.good; }).length;
    var n = lines.length;
    var pct = n ? Math.round(100 * ok / n) : 0;
    var seen = {};
    var areas = [];
    lines.forEach(function (ln) {
      if (ln.good) return;
      var area = areaOf(ln.item);
      if (seen[area[0]]) return;
      seen[area[0]] = true;
      areas.push(area);
    });
    var study = areas.length
      ? "<ul>" + areas.map(function (a) { return "<li>" + bi(a[0], a[1]) + "</li>"; }).join("") + "</ul>"
      : "<p>" + bi("Nothing to review on this quiz.", "لا شيء للمراجعة في هذا الاختبار.") + "</p>";
    var misses = lines.filter(function (l) { return !l.good; });
    var missHtml = misses.length
      ? '<ol class="md-qs">' + misses.map(function (ln) {
        return '<li class="sp-day md-bad"><p>' + bi(ln.item.en, ln.item.ar) + "</p><p>"
          + bi("Your answer: ", "إجابتك: ") + answerText(ln.item, ln.given) + "</p><p><strong>"
          + bi("Correct: ", "الصحيح: ") + answerText(ln.item, ln.item.ans) + "</strong></p></li>";
      }).join("") + "</ol>"
      : "<p>" + bi("No misses.", "لا أخطاء.") + "</p>";
    return {
      pct: pct, ok: ok, n: n,
      html: '<section class="hs-results"><h2>' + bi(titleEn + ": " + ok + "/" + n + " (" + pct + "%)", titleAr + ": " + ok + "/" + n + " (" + pct + "%)") + "</h2>"
        + "<h3>" + bi("Study up on", "ذاكري") + "</h3>" + study
        + "<h3>" + bi("Missed", "ما فات") + "</h3>" + missHtml + "</section>"
    };
  }
  function answerText(item, idx) {
    if (idx == null || idx < 0 || !item.opts || !item.opts[idx]) return bi("(none)", "(لا شيء)");
    return optLabel(item, idx);
  }

      "Week 1 was too easy. This week jumps two tiers, and the weak spots still come first.",

  function detailLine() {
    var d = session && session.bannerDetail;

  function nextControls(week, dayN) {
    var next = dayN ? dayN + 1 : week * 7 + 1;

  }

  function flatten(blocks) {
    var steps = [];
    blocks.forEach(function (b) {
      if (b.kind === "listen" || b.kind === "obs") steps.push({ type: "script", set: b.set, kind: b.kind });
      if (b.kind === "read" || b.kind === "comp") steps.push({ type: "passage", set: b.set, kind: b.kind });
      if (b.kind === "q") steps.push({ type: "q", item: b.item, passage: null });
      else if (b.set) b.set.qs.forEach(function (q) {
        steps.push({
          type: "q",
          item: Object.assign({ pillar: b.set.pillar, tier: b.set.tier }, q),
          passage: (b.kind === "read" || b.kind === "comp") ? b.set : null
        });
      });
    });
    return steps;
  }

  function clock() {
    if (!t0) return;
    var el = document.getElementById("hs-clock");
    if (!el) return;
    var s = Math.floor((Date.now() - t0) / 1000);

  }

  function showIntro(day) {

      + '<p>' + memNote + '</p>'
      + (session.week > 1 && !(state.day1 && state.day1.fam) ? '<p class="hs-banner">' + bi("Week 1 has not been scored in this browser. The grammar baseline is not in yet, so this pack cannot aim extra drills at your weak families.", "الأسبوع الأول لم يُسجَّل في هذا المتصفح. خط أساس القواعد غير موجود بعد، فلا تستطيع هذه الحزمة توجيه تمارين إضافية إلى عائلاتكِ الضعيفة.") + '</p>' : '')
      + '<button type="button" class="sp-btn" id="hs-begin">' + (session.kind === "extra"
        ? bi("Begin the harder set", "ابدئي المجموعة الأصعب")

  function renderStep() {
    var step = steps[cursor];
    if (!step) { finishMain(); return; }
    if (step.type === "script") return renderScript(step);
    if (step.type === "passage") { cursor += 1; return renderStep(); }
    renderQ(step);
  }

  function renderScript(step) {
    var left = step.set.secs || 40;
    var body, note;
    if (step.set.mem && typeof hesnaScene === "function") {
      body = hesnaScene(step.set);
      note = bi("Recall of Visual Details. Two minutes. No notes.", "استرجاع التفاصيل البصرية. دقيقتان. بلا ملاحظات.");
    } else if (step.set.img) {
      body = '<figure class="hs-script"><img src="' + esc(step.set.img) + '" alt="' + esc(step.set.alt || "Practice scene") + '" style="width:100%;height:auto;border-radius:12px"><figcaption class="si-credit">'
        + bi("Created by SI and Biological SI Partner", "أُنشئ بواسطة SI وBiological SI Partner") + '</figcaption></figure><p>'
        + bi(step.set.en, step.set.ar) + '</p>';
      note = bi("Observation. Study this picture. It will hide. Every question is about this picture only.",
        "ملاحظة. ادراسي هذه الصورة. ستختفي. كل سؤال عن هذه الصورة فقط.");
    } else {
      body = '<p class="hs-script">' + esc(step.set.en) + '</p>';
      note = bi(step.kind === "obs" ? "Observation. Read once. It will hide." : "Radio call. Read once. It will hide.",
        step.kind === "obs" ? "ملاحظة. اقرئي مرة واحدة. سيختفي." : "نداء لاسلكي. اقرئي مرة واحدة. سيختفي.");

      + (note ? '<p class="sp-ph">' + note + '</p>' : '')

      + '<button type="button" class="sp-btn" id="hs-ready">' + bi("I'm ready, hide it", "أنا جاهزة، أخفيه") + '</button>';
    var el = document.getElementById("hs-script-t");
    function tick() {
      var show = Math.max(left, 0);
      var mm = Math.floor(show / 60);
      var ss = ("0" + (show % 60)).slice(-2);
      el.innerHTML = bi("Time left: ", "الوقت المتبقي: ") + mm + ":" + ss;

  function renderQ(step) {
    var item = step.item;
    var nQ = steps.filter(function (s) { return s.type === "q"; }).length;
    var sofar = answers.length + 1;
    var passage = "";
    if (step.passage) {
      var stay = step.passage.pillar === "reading" || step.passage.pillar === "comp";
      passage = (stay
        ? '<p class="sp-ph">' + bi("Reading with Understanding. The passage stays. This is not a memory test. Answer only from it.", "القراءة بفهم. المقطع يبقى. هذا ليس اختبار ذاكرة. أجيبي منه فقط.") + '</p>'
        : '')
        + '<div class="hs-passage"><p>' + esc(step.passage.en) + '</p><p class="sp-ph">' + esc(step.passage.ar) + '</p></div>';
    }
    var visKey = "";
    if (item.pillar === "mem" && item.opts && item.opts[0]) {
      var head = String(item.opts[0][0] || "");
      visKey = head.indexOf("Yes") >= 0
        ? '<p class="hs-key">' + bi("Recall of Visual Details. A = yes, it was in the picture. B = no. If only part was shown, it was present.", "استرجاع التفاصيل البصرية. A = نعم كان في الصورة. B = لا. إذا ظهر جزء منه فهو موجود.") + '</p>'
        : '<p class="hs-key">' + bi("Recall of Visual Details. A = the statement is true. B = the statement is false.", "استرجاع التفاصيل البصرية. A = العبارة صحيحة. B = العبارة خطأ.") + '</p>';
    }
    var writtenKey = item.pillar === "written"

  function coreOf(blocks, ans) {
    var g = A.grade(blocks, ans);

  function finishMain() {
    if (session && session.kind === "mem") return finishMem();
    clearInterval(timer);
    var sec = Math.round((Date.now() - t0) / 1000);
    if (mode === "extra") return finishExtra(A.grade(session.extraBlocks, answers));
    var g = A.grade(session.blocks, answers);
    var row = null;
    if (session.kind === "repair" || session.kind === "stretch") A.applyPackGrade(state, session.week, session.kind, session.blocks, g);
    else row = A.applyGrade(state, session.day, session, g, sec);
    var lines = collectLines(session.blocks, answers);
    var examName = session.exam === "reading"
      ? ["Reading with Understanding", "القراءة بفهم"]
      : ["Written Communication", "التواصل الكتابي"];
    var panel = resultsPanel(examName[0], examName[1], lines);
    rememberQuiz(session.day.n, {
      key: session.exam || "written",
      label_en: examName[0],
      label_ar: examName[1],
      pct: panel.pct, ok: panel.ok, n: panel.n
    });
    save();
    if (!row) row = { tooFastSec: session.tooFastSec, sec: sec };
    var raised = session.kind !== "repair" && session.kind !== "stretch" && A.hot(row);
    var html = panel.html;
    if (session.exam !== "reading" && session.day && (session.day.take || {}).reading) {
      html += '<button type="button" class="sp-btn" id="hs-read">' + bi("Reading with Understanding", "القراءة بفهم") + "</button>";
    } else if (session.day && session.day.bio) {
      html += '<button type="button" class="sp-btn" id="hs-bio">' + bi("Biodata", "البيانات الشخصية") + "</button>";
    }
    html += nextControls(session.week, session.day && session.day.n);
    app.innerHTML = html;
    var readBtn = document.getElementById("hs-read");
    if (readBtn) readBtn.onclick = function () { startReading(session.day); };
    var bioBtn = document.getElementById("hs-bio");
    if (bioBtn) bioBtn.onclick = function () { startBio(session.day); };
    renderSummary(session.day.n);
    window.scrollTo(0, 0);
  }

  function startExtra() {
    var row = state.days[String(session.day.n)] || {};
    var tier = A.extraTier(session);
    if (row.probeN >= 3 && row.probePct >= 75) tier = Math.min(6, Math.max(tier, 3));
    var items = (D.items || []).filter(function (it) {
      var seen = state.seen[it.id];
      return it.pillar === "logic" && !it.probe && it.tier >= tier && (!seen || !seen.ok);
    }).slice(0, 8);
    if (!items.length) {
      A.noteExtra(state, session.day.n, 80);
      save();
      renderSummary(session.day.n);
      return;
    }
    session.extraBlocks = items.map(function (it) { return { kind: "q", item: it }; });
    steps = flatten(session.extraBlocks);
    cursor = 0;
    answers = [];
    mode = "extra";
    t0 = Date.now();
    timer = setInterval(clock, 500);
    renderStep();
  }

  function finishExtra(g) {
    clearInterval(timer);
    A.absorb(state, session.extraBlocks, g.answers, session.day.n);
    var pct = g.corePct == null ? g.pct : g.corePct;
    A.noteExtra(state, session.day.n, pct);
    var lines = collectLines(session.extraBlocks, g.answers);
    var panel = resultsPanel("Harder set", "المجموعة الأصعب", lines);
    rememberQuiz(session.day.n, {
      key: "extra",
      label_en: "Harder set",
      label_ar: "المجموعة الأصعب",
      pct: panel.pct, ok: panel.ok, n: panel.n
    });
    save();
    app.innerHTML = panel.html + nextControls(session.week, session.day && session.day.n);
    renderSummary(session.day.n);
    window.scrollTo(0, 0);
  }

  function review(blocks, ans) {
    var html = '<ol class="md-qs">';
    var i = 0;
    function line(item, given) {
      var good = given === item.ans;
      html += '<li class="sp-day ' + (good ? "md-ok" : "md-bad") + '"><p>' + bi(item.en, item.ar) + '</p><p>'
        + (good ? "✅ " : "❌ ") + bi("Your answer: ", "إجابتك: ") + optLabel(item, given < 0 ? 0 : given) + '</p>'
        + (good ? '' : '<p><strong>' + bi("Correct: ", "الصحيح: ") + optLabel(item, item.ans) + '</strong></p><p>' + bi(item.why[0], item.why[1]) + '</p>')
        + '</li>';
    }
    blocks.forEach(function (b) {
      if (b.kind === "q") { line(b.item, ans[i]); i += 1; }
      else b.set.qs.forEach(function (q) {
        line(Object.assign({ pillar: b.set.pillar, why: q.why, opts: q.opts, ans: q.ans, en: q.en, ar: q.ar }, q), ans[i]);
        i += 1;
      });
    });
    return html + '</ol>';
  }

  function refreshPackNotes() {
    [1, 2, 3, 4].forEach(function (w) {
      var note = document.getElementById("hs-pack-note-" + w);
      var btn = document.getElementById("hs-pack-btn-" + w);
      if (!note && !btn) return;
      var st = A.packStatus(state, w);
      var p = st.perf;
      var core = p.overall == null ? "—" : p.overall + "%";
      var en = "Open. " + p.masteredN + " of " + p.total + " days at the mastery mark · core " + core + ".";
      var ar = "مفتوح. " + p.masteredN + " من " + p.total + " أيام عند علامة الإتقان · الجوهر " + core + ".";
      if (note) note.innerHTML = bi(en, ar);
      if (btn) {
        btn.innerHTML = bi("Open Week " + w, "افتحي الأسبوع " + weekAr(w));
        btn.removeAttribute("disabled");
      }
    });
  }

  function beginMemory(step) {
    var drill = step.memory;
    var qs = (drill.qs || []).map(function (q) {
      return { en: q.en, ar: q.ar, opts: q.opts, ans: q.ans, why: q.why || ["It is in the picture.", "هذا في الصورة."], pillar: "mem" };
    });
    var set = {
      mem: 1,
      id: drill.id,
      pillar: "mem",
      secs: drill.secs || 120,
      img: drill.img,
      alt: drill.alt,
      overlay: drill.overlay,
      svg: drill.svg,
      tm: drill.tm,
      st: drill.st,
      cr: drill.cr,
      b: drill.b,
      p: drill.p,
      v: drill.v,
      en: drill.title_en,
      ar: drill.title_ar,
      qs: qs
    };
    session = {
      kind: "mem",
      week: step.week,
      day: step.day,
      memId: drill.id,
      memIndex: step.memIndex || 0,
      blocks: [{ kind: "obs", set: set }],
      tier: step.day.tier || 1,
      tooFastSec: (step.day.tooFastMin || 20) * 60,
      nQ: qs.length,
      banner: null
    };
    steps = flatten(session.blocks);
    cursor = 0;
    answers = [];
    mode = "mem";
    t0 = Date.now();
    clearInterval(timer);
    renderStep();
  }
  function finishMem() {
    clearInterval(timer);
    var qs = session.blocks[0].set.qs;
    var ok = 0;
    qs.forEach(function (q, i) { if (answers[i] === q.ans) ok += 1; });
    var pct = qs.length ? Math.round(100 * ok / qs.length) : 0;
    A.noteMem(state, session.day, session.memId, pct);
    var lines = qs.map(function (q, i) {
      return { item: q, given: answers[i], good: answers[i] === q.ans };
    });
    var title = (session.blocks[0].set.en || "Picture");
    var panel = resultsPanel("Score", "النتيجة", lines);
    rememberQuiz(session.day.n, {
      key: "mem:" + session.memId,
      label_en: title,
      label_ar: session.blocks[0].set.ar || title,
      pct: panel.pct, ok: panel.ok, n: panel.n
    });
    save();
    var idx = (session.memIndex || 0) + 1;
    var ids = (session.day && session.day.mem) || [];
    var go = idx < ids.length
      ? '<button type="button" class="sp-btn" data-day="' + session.day.n + '" data-mem="' + idx + '">' + bi("Next picture", "الصورة التالية") + "</button>"
      : '<button type="button" class="sp-btn" data-day="' + session.day.n + '" data-phase="quiz">' + bi("Other quizzes", "الاختبارات الأخرى") + "</button>";
    go += '<button type="button" class="sp-btn" data-day="' + session.day.n + '" data-mem="' + (session.memIndex || 0) + '">' + bi("Retry", "أعيدي") + "</button>";
    app.innerHTML = panel.html + go + nextControls(session.week, session.day && session.day.n);
    renderSummary(session.day.n);
    window.scrollTo(0, 0);
  }
  function startReading(day) {
    var built = A.planSession(day, D, state, "reading");
    built.kind = "period";
    built.week = A.weekOf(day.n);
    session = built;
    session.day = day;
    session.exam = "reading";
    if (!session.nQ) {
      if (day.bio) startBio(day);
      return;
    }
    steps = flatten(session.blocks);
    t0 = Date.now();
    cursor = 0;
    answers = [];
    mode = "main";
    clearInterval(timer);
    timer = setInterval(clock, 500);
    renderStep();
    window.scrollTo(0, 0);
  }
  function startBio(day) {
    var items = (D.bio || []).slice(day.bioStart || 0, (day.bioStart || 0) + (day.bio || 0));
    var i = 0;
    var picks = [];
    function show() {
      if (i >= items.length) {
        rememberQuiz(day.n, {
          key: "bio",
          label_en: "Biodata: " + picks.length + " answered, not scored",
          label_ar: "البيانات الشخصية: " + picks.length + " إجابة، بلا درجة"
        });
        save();
        app.innerHTML = "<p>" + bi("Biodata saved. One choice each. Not scored right or wrong.", "حُفظت البيانات الشخصية. خيار واحد لكل سؤال. بلا صح أو خطأ.") + "</p>";
        renderSummary(day.n);
        window.scrollTo(0, 0);
        return;
      }
      var q = items[i];
      var opts = "";
      (q.opts || []).forEach(function (o, k) {
        opts += '<button type="button" class="hs-opt" data-i="' + k + '">' + bi(o[0], o[1]) + "</button>";
      });
      app.innerHTML = '<p class="hs-key">' + bi("Biodata. Not right or wrong. Mark one choice, the closest honest fit. A blank gets no credit. Two marks get no credit.", "البيانات الشخصية. ليست صحًا أو خطأ. علّمي خيارًا واحدًا، الأقرب الصادق. الفراغ بلا رصيد. والعلامتان بلا رصيد.") + "</p>"
        + "<p class=\"sp-ph\">" + bi("Question " + (i + 1) + " of " + items.length, "السؤال " + (i + 1) + " من " + items.length) + "</p>"
        + "<p class=\"hs-stem\">" + bi(q.en, q.ar) + "</p>" + opts;
      app.querySelectorAll(".hs-opt").forEach(function (btn) {
        btn.onclick = function () {
          picks.push(+btn.getAttribute("data-i"));
          i += 1;
          show();
        };
      });
      window.scrollTo(0, 0);
    }
    show();
  }
  function findDay(n) {
    var day = null;
    (D.days || []).forEach(function (d) { if (d.n === n) day = d; });
    return day;
  }
  function startDay(n, memIndex, phase) {
    load();
    var day = findDay(n);
    if (!day) {
      app.innerHTML = '<p>' + bi("That day is not on this page.", "هذا اليوم ليس في هذه الصفحة.") + '</p>';
      window.scrollTo(0, 0);
      return;
    }
    var sel = document.getElementById("hs-day");
    if (sel) sel.value = String(day.n);
    renderSummary(day.n);
    var ids = day.mem || [];
    var i = memIndex || 0;
    if (phase !== "quiz" && i < ids.length && D.mem && D.mem[ids[i]]) {
      beginMemory({ memory: D.mem[ids[i]], day: day, week: A.weekOf(day.n), memIndex: i });
      window.scrollTo(0, 0);
      return;
    }
    var built = A.planSession(day, D, state, "written");
    built.kind = "period";
    built.week = A.weekOf(day.n);
    session = built;
    session.day = day;
    session.exam = "written";
    save();
    refreshPackNotes();
    if (!session.nQ) {
      startReading(day);
      return;
    }
    steps = flatten(session.blocks);
    t0 = Date.now();
    cursor = 0;
    answers = [];
    mode = "main";
    timer = setInterval(clock, 500);
    renderStep();
    window.scrollTo(0, 0);
  }

  function paintDays() {
    var lang = document.documentElement.lang === "ar" ? "ar" : "en";
    document.querySelectorAll("#hs-day option").forEach(function (o) {
      o.textContent = o.getAttribute(lang === "ar" ? "data-ar" : "data-en") || o.value;
    });
  }
  function boot() {
    app = document.getElementById("hs-app");
    board = document.getElementById("hs-board");
    if (!app || !D) return;
    load();
    if (A.resync) A.resync(state, D);
    save();
    paintDays();
    var jump = (location.hash || "").match(/^#(?:day-(\d+)|week-(\d+))/);
    var openDay = 1;
    if (jump && jump[1]) openDay = +jump[1];
    else if (jump && jump[2]) openDay = (+jump[2] - 1) * 7 + 1;
    var sel = document.getElementById("hs-day");
    if (sel) sel.addEventListener("change", function () { startDay(+sel.value, 0, ""); });
    var toggle = document.getElementById("sp-toggle");
    if (toggle) toggle.addEventListener("click", function () { setTimeout(paintDays, 0); });
    startDay(openDay, 0, "");
    document.body.addEventListener("click", function (e) {
      var b = e.target.closest("[data-day],[data-week]");
      if (!b) return;
      if (b.hasAttribute("data-day")) {
        startDay(+b.getAttribute("data-day"), +(b.getAttribute("data-mem") || 0), b.getAttribute("data-phase") || "");
        return;
      }
      startDay((+b.getAttribute("data-week") - 1) * 7 + 1, 0, "");
    });
    var reset = document.getElementById("hs-reset");
    if (reset) reset.onclick = function () {
      if (!confirm(document.documentElement.lang === "ar"
        ? "مسح تقدّم الخطة في هذا المتصفح؟"
        : "Clear this plan's saved progress in this browser?")) return;
      state = { seen: {}, fam: {}, pillar: {}, days: {}, weeks: {} };
      save();
      renderSummary(1);
      startDay(1, 0, "");
    };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

var s=null;try{s=localStorage.getItem(K)}catch(e){}set(s==='ar'?'ar':'en');
document.getElementById('sp-toggle').addEventListener('click',function(){set(h.lang==='ar'?'en':'ar')});})();
