","diag":true},{"id":"g-art-2","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Please file the report before noon.","Please file the report before noon."],["Please file report before noon.","Please file report before noon."],["Please file a reports before noon.","Please file a reports before noon."],["Please file an report before noon.","Please file an report before noon."]],"ans":0,"why":["A specific report needs \"the\". \"An\" is not used before the consonant sound in \"report\".","التقرير المحدد يحتاج the. ولا تُستخدم an قبل صوت الساكن في report."],"family":"articles","diag":true},{"id":"g-art-3","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["He took an umbrella from the car.","He took an umbrella from the car."],["He took a umbrella from the car.","He took a umbrella from the car."],["He took umbrella from the car.","He took umbrella from the car."],["He took an umbrellas from the car.","He took an umbrellas from the car."]],"ans":0,"why":["\"Umbrella\" starts with a vowel sound: \"an\", one umbrella.","umbrella تبدأ بصوت علة: an، ومظلة واحدة."],"family":"articles"},{"id":"g-art-4","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["An honest witness came forward at 6.","An honest witness came forward at 6."],["A honest witness came forward at 6.","A honest witness came forward at 6."],["Honest witness came forward at 6.","Honest witness came forward at 6."],["An honest witnesses came forward at 6.","An honest witnesses came forward at 6."]],"ans":0,"why":["The \"h\" in \"honest\" is silent, so the word starts with a vowel sound: \"an\".","الهاء في honest صامتة، فالكلمة تبدأ بصوت علة: an."],"family":"articles","retest":true},{"id":"g-art-5","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["We need information about the driver, not a rumor.","We need information about the driver, not a rumor."],["We need an information about the driver, not a rumor.","We need an information about the driver, not a rumor."],["We need informations about the driver, not a rumor.","We need informations about the driver, not a rumor."],["We need a information about the driver, not a rumor.","We need a information about the driver, not a rumor."]],"ans":0,"why":["\"Information\" is uncountable here: no \"a/an\" and no plural -s.","information غير قابلة للعد هنا: بلا a/an وبلا جمع بالـ s."],"family":"articles"},{"id":"g-art-6","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The officer wrote a one-page report.","The officer wrote a one-page report."],["The officer wrote an one-page report.","The officer wrote an one-page report."],["The officer wrote one-page report.","The officer wrote one-page report."],["The officer wrote a one-pages report.","The officer wrote a one-pages report."]],"ans":0,"why":["\"One\" starts with a /w/ sound, so the article is \"a\", and \"page\" stays singular inside the compound.","one تبدأ بصوت w، فالمقالة a، وتبقى page مفردة داخل المركّب."],"family":"articles"},{"id":"g-prep-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The wallet was on the bench.","The wallet was on the bench."],["The wallet was into the bench.","The wallet was into the bench."],["The wallet was at to the bench.","The wallet was at to the bench."],["The wallet was on to the bench.","The wallet was on to the bench."]],"ans":0,"why":["\"On\" is the preposition for a surface. \"Into\" would mean movement into it.","on للسطح. into تعني حركة إلى الداخل."],"family":"prepositions","diag":true},{"id":"g-prep-2","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She arrived at the scene at 9:40.","She arrived at the scene at 9:40."],["She arrived to the scene at 9:40.","She arrived to the scene at 9:40."],["She arrived at the scene in 9:40.","She arrived at the scene in 9:40."],["She arrived the scene on 9:40.","She arrived the scene on 9:40."]],"ans":0,"why":["English says \"arrive at\" a place and \"at\" a clock time. \"Arrive to\" is a calque.","في الإنجليزية arrive at للمكان و at للساعة. arrive to نقل حرفي."],"family":"prepositions","diag":true},{"id":"g-prep-3","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The charge depends on the report.","The charge depends on the report."],["The charge depends of the report.","The charge depends of the report."],["The charge depends from the report.","The charge depends from the report."],["The charge is depend of the report.","The charge is depend of the report."]],"ans":0,"why":["The verb is \"depend on\", not \"depend of/from\" (dépendre de / يعتمد على).","الفعل depend on، وليس depend of أو from."],"family":"prepositions"},{"id":"g-prep-4","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["They have been waiting for twenty minutes.","They have been waiting for twenty minutes."],["They have been waiting since twenty minutes.","They have been waiting since twenty minutes."],["They have been waiting from twenty minutes.","They have been waiting from twenty minutes."],["They have been waiting since twenty minute.","They have been waiting since twenty minute."]],"ans":0,"why":["\"For\" plus a length of time. \"Since\" needs a starting point, like \"since 9:40\".","for مع المدة. since تحتاج نقطة بداية مثل since 9:40."],"family":"prepositions","retest":true},{"id":"g-prep-5","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The number is printed on the plate.","The number is printed on the plate."],["The number is printed in the plate.","The number is printed in the plate."],["The number is printed into the plate.","The number is printed into the plate."],["The number is printed on to plate.","The number is printed on to plate."]],"ans":0,"why":["A plate number sits on the plate: \"on\".","رقم اللوحة على اللوحة: on."],"family":"prepositions"},{"id":"g-prep-6","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The driver ran toward the alley.","The driver ran toward the alley."],["The driver ran towards to the alley.","The driver ran towards to the alley."],["The driver ran at to the alley.","The driver ran at to the alley."],["The driver ran toward to the alley.","The driver ran toward to the alley."]],"ans":0,"why":["\"Toward\" already includes the direction. Do not add \"to\" after it.","toward تتضمن الاتجاه. لا تضيفي to بعدها."],"family":"prepositions"},{"id":"g-tense-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The officer wrote the report yesterday.","The officer wrote the report yesterday."],["The officer has written the report yesterday.","The officer has written the report yesterday."],["The officer has wrote the report yesterday.","The officer has wrote the report yesterday."],["The officer writing the report yesterday.","The officer writing the report yesterday."]],"ans":0,"why":["A finished time (\"yesterday\") takes the simple past, not the present perfect.","زمن منتهٍ (yesterday) يأخذ الماضي البسيط، لا المضارع التام."],"family":"tense","diag":true},{"id":"g-tense-2","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She has worked this beat since March.","She has worked this beat since March."],["She works this beat since March.","She works this beat since March."],["She has work this beat since March.","She has work this beat since March."],["She is working this beat since March.","She is working this beat since March."]],"ans":0,"why":["\"Since March\" (a start that is still true) takes the present perfect: \"has worked\".","since March (بداية ما زالت صحيحة) تأخذ المضارع التام: has worked."],"family":"tense","diag":true},{"id":"g-tense-3","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["By the time backup arrived, the driver had left.","By the time backup arrived, the driver had left."],["By the time backup arrived, the driver has left.","By the time backup arrived, the driver has left."],["By the time backup arrived, the driver have left.","By the time backup arrived, the driver have left."],["By the time backup arrived, the driver leaving.","By the time backup arrived, the driver leaving."]],"ans":0,"why":["When the later past event is \"arrived\", the earlier one is \"had left\".","إذا كان الحدث الأحدث في الماضي arrived، فالأسبق had left."],"family":"tense"},{"id":"g-tense-4","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["I saw him last night.","I saw him last night."],["I have seen him last night.","I have seen him last night."],["I have saw him last night.","I have saw him last night."],["I seeing him last night.","I seeing him last night."]],"ans":0,"why":["Same trap as \"yesterday\": \"last night\" closes the time, so use \"saw\".","الفخ نفسه كما في yesterday: last night تغلق الزمن، فاستخدمي saw."],"family":"tense","retest":true},{"id":"g-tense-5","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The clerk said the window had been broken before she arrived.","The clerk said the window had been broken before she arrived."],["The clerk said the window has been broken before she arrived.","The clerk said the window has been broken before she arrived."],["The clerk said the window been broken before she arrived.","The clerk said the window been broken before she arrived."],["The clerk said the window had broke before she arrived.","The clerk said the window had broke before she arrived."]],"ans":0,"why":["Reported earlier past: \"had been broken\". \"Had broke\" mixes the helper with the simple past.","ماضٍ أسبق في الكلام المنقول: had been broken. had broke تخلط الفعل المساعد بالماضي البسيط."],"family":"tense"},{"id":"g-tense-6","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She has already logged the firearm.","She has already logged the firearm."],["She has already log the firearm.","She has already log the firearm."],["She already logging the firearm.","She already logging the firearm."],["She has already logged the firearm yesterday.","She has already logged the firearm yesterday."]],"ans":0,"why":["\"Has\" needs the past participle \"logged\". A finished clock time does not belong with \"already\" in this sentence.","has تحتاج اسم المفعول logged. وزمن ساعة منتهٍ لا يجلس مع already في هذه الجملة."],"family":"tense"},{"id":"g-comp-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She explained the route to me.","She explained the route to me."],["She explained me the route.","She explained me the route."],["She explained me to the route.","She explained me to the route."],["She explained to me to the route.","She explained to me to the route."]],"ans":0,"why":["\"Explain\" does not take a person as a bare object. Use \"explain something to someone\".","explain لا يأخذ الشخص مفعولًا مباشرًا عاريًا. قولي explain something to someone."],"family":"complements","diag":true},{"id":"g-comp-2","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Listen to the witness before you write.","Listen to the witness before you write."],["Listen the witness before you write.","Listen the witness before you write."],["Listen at the witness before you write.","Listen at the witness before you write."],["Listen to witness before you are write.","Listen to witness before you are write."]],"ans":0,"why":["\"Listen\" needs \"to\" before the person.","listen تحتاج to قبل الشخص."],"family":"complements","diag":true},{"id":"g-comp-3","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["We discussed the case for an hour.","We discussed the case for an hour."],["We discussed about the case for an hour.","We discussed about the case for an hour."],["We discussed on the case for an hour.","We discussed on the case for an hour."],["We did discussed the case for an hour.","We did discussed the case for an hour."]],"ans":0,"why":["\"Discuss\" takes the topic directly. Do not add \"about\", and do not use \"did\" with the past form.","discuss يأخذ الموضوع مباشرة. لا تضيفي about، ولا did مع صيغة الماضي."],"family":"complements"},{"id":"g-comp-4","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Please explain the delay to the sergeant.","Please explain the delay to the sergeant."],["Please explain the sergeant the delay.","Please explain the sergeant the delay."],["Please explain to the delay the sergeant.","Please explain to the delay the sergeant."],["Please explain the sergeant to the delay.","Please explain the sergeant to the delay."]],"ans":0,"why":["Same complement as Day 1, in a report sentence: explain the delay to the sergeant.","المكمّل نفسه كما في اليوم 1، في جملة تقرير: explain the delay to the sergeant."],"family":"complements","retest":true},{"id":"g-comp-5","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She is married to a paramedic.","She is married to a paramedic."],["She is married with a paramedic.","She is married with a paramedic."],["She is married of a paramedic.","She is married of a paramedic."],["She is marry to a paramedic.","She is marry to a paramedic."]],"ans":0,"why":["\"Married to\", not \"married with\" (marié avec / متزوجة من).","married to، وليس married with."],"family":"complements"},{"id":"g-comp-6","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["We entered the lobby through the side door.","We entered the lobby through the side door."],["We entered in the lobby through the side door.","We entered in the lobby through the side door."],["We entered to the lobby through the side door.","We entered to the lobby through the side door."],["We entered into to the lobby through the side door.","We entered into to the lobby through the side door."]],"ans":0,"why":["\"Enter\" takes the place directly: \"enter the lobby\", not \"enter in/to\".","enter يأخذ المكان مباشرة: enter the lobby، وليس enter in أو to."],"family":"complements"},{"id":"g-adj-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She drove a blue Honda.","She drove a blue Honda."],["She drove a Honda blue.","She drove a Honda blue."],["She drove blue a Honda.","She drove blue a Honda."],["She drove a blue Hondas.","She drove a blue Hondas."]],"ans":0,"why":["English puts the adjective before the noun: \"a blue Honda\", and one car is singular.","الصفة في الإنجليزية قبل الاسم: a blue Honda، والسيارة الواحدة مفرد."],"family":"adjectives","diag":true},{"id":"g-adj-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The man in the green jacket left.","The man in the green jacket left."],["The man in jacket green left.","The man in jacket green left."],["The man in the jacket green left.","The man in the jacket green left."],["The green in man the jacket left.","The green in man the jacket left."]],"ans":0,"why":["Color sits before \"jacket\": \"the green jacket\".","اللون قبل jacket: the green jacket."],"family":"adjectives"},{"id":"g-adj-3","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["A small black backpack was on the chair.","A small black backpack was on the chair."],["A backpack small black was on the chair.","A backpack small black was on the chair."],["A small black backpacks was on the chair.","A small black backpacks was on the chair."],["Small a black backpack was on the chair.","Small a black backpack was on the chair."]],"ans":0,"why":["Size, then color, then the noun. The verb \"was\" needs a singular backpack.","الحجم ثم اللون ثم الاسم. الفعل was يحتاج مفردًا."],"family":"adjectives","retest":true},{"id":"g-adj-4","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Two parked white vans blocked the ramp.","Two parked white vans blocked the ramp."],["Two white vans parked blocked the ramp.","Two white vans parked blocked the ramp."],["Two parked white van blocked the ramp.","Two parked white van blocked the ramp."],["Parked two white vans blocked the ramp.","Parked two white vans blocked the ramp."]],"ans":0,"why":["\"Two\" needs the plural \"vans\", and the adjectives stay in front: \"parked white vans\".","two تحتاج الجمع vans، والصفات تبقى أمام الاسم."],"family":"adjectives"},{"id":"g-count-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["He gave me a piece of advice.","He gave me a piece of advice."],["He gave me an advice.","He gave me an advice."],["He gave me advices.","He gave me advices."],["He gave me a advice.","He gave me a advice."]],"ans":0,"why":["\"Advice\" is uncountable. Count it with \"a piece of advice\".","advice غير قابلة للعد. عُدّيها بـ a piece of advice."],"family":"count","diag":true},{"id":"g-count-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The luggage is in the trunk.","The luggage is in the trunk."],["The luggages are in the trunk.","The luggages are in the trunk."],["The luggage are in the trunk.","The luggage are in the trunk."],["A luggages is in the trunk.","A luggages is in the trunk."]],"ans":0,"why":["\"Luggage\" is uncountable and takes \"is\".","luggage غير قابلة للعد وتأخذ is."],"family":"count"},{"id":"g-count-3","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Two pieces of evidence were logged.","Two pieces of evidence were logged."],["Two evidences were logged.","Two evidences were logged."],["Two evidence was logged.","Two evidence was logged."],["Two piece of evidences were logged.","Two piece of evidences were logged."]],"ans":0,"why":["\"Evidence\" is uncountable. Count it with \"pieces\", and the verb agrees with \"pieces\".","evidence غير قابلة للعد. عُدّيها بـ pieces، والفعل يوافق pieces."],"family":"count","retest":true},{"id":"g-count-4","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She asked for information.","She asked for information."],["She asked for an information.","She asked for an information."],["She asked for informations.","She asked for informations."],["She asked for a informations.","She asked for a informations."]],"ans":0,"why":["No article and no plural -s on \"information\".","بلا أداة تعريف نكرة وبلا s على information."],"family":"count"},{"id":"g-count-5","tier":6,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["There was little traffic on King Street.","There was little traffic on King Street."],["There was few traffic on King Street.","There was few traffic on King Street."],["There were few traffics on King Street.","There were few traffics on King Street."],["There was a few traffic on King Street.","There was a few traffic on King Street."]],"ans":0,"why":["\"Traffic\" is uncountable, so use \"little\", not \"few\".","traffic غير قابلة للعد، فاستخدمي little لا few."],"family":"count","stretch":true},{"id":"g-cal-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["I agree with the statement.","I agree with the statement."],["I am agree with the statement.","I am agree with the statement."],["I am agreed with the statement.","I am agreed with the statement."],["I have agree with the statement.","I have agree with the statement."]],"ans":0,"why":["\"Agree\" is a verb here. \"I am agree\" copies \"je suis d'accord\" / \"أنا موافقة\" into English words that do not work.","agree فعل هنا. I am agree تنقل je suis d'accord أو أنا موافقة بكلمات إنجليزية لا تستقيم."],"family":"calques","diag":true},{"id":"g-cal-2","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She is 25 years old.","She is 25 years old."],["She has 25 years.","She has 25 years."],["She has 25 years old.","She has 25 years old."],["She is 25 years age.","She is 25 years age."]],"ans":0,"why":["Age is \"is ... years old\", not \"has ... years\" (elle a 25 ans / عمرها 25).","العمر: is ... years old، وليس has ... years."],"family":"calques","diag":true},{"id":"g-cal-3","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She asked for a glass of water.","She asked for a glass of water."],["She demanded for a glass of water.","She demanded for a glass of water."],["She did a demand for a glass of water.","She did a demand for a glass of water."],["She asked a glass of water.","She asked a glass of water."]],"ans":0,"why":["\"Ask for\" something. \"Demand\" does not take \"for\" this way, and \"did a demand\" is not English.","ask for للطلب. demand لا تأخذ for هكذا، و did a demand ليست إنجليزية."],"family":"calques"},{"id":"g-cal-4","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatical and means the witness is at the counter right now?","ar":"أي جملة سليمة وتعني أن الشاهد عند المنضدة الآن؟","opts":[["The witness is currently at the counter.","The witness is currently at the counter."],["The witness is actually at the counter.","The witness is actually at the counter."],["The witness is actual at the counter.","The witness is actual at the counter."],["The witness currently is be at the counter.","The witness currently is be at the counter."]],"ans":0,"why":["For \"right now\", say \"currently\". \"Actually\" means \"in fact\" (actuellement is the false friend).","للمعنى «الآن» قولي currently. actually تعني «في الواقع»، وهي الصديق الكاذب لـ actuellement."],"family":"calques","retest":true},{"id":"g-cal-5","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatical and means the report is delicate and must be handled without noise?","ar":"أي جملة سليمة وتعني أن التقرير حسّاس ويجب التعامل معه بلا ضجة؟","opts":[["This report is sensitive. Handle it quietly.","This report is sensitive. Handle it quietly."],["This report is sensible. Handle it quietly.","This report is sensible. Handle it quietly."],["This report is sensitive. Handle it quiet.","This report is sensitive. Handle it quiet."],["This report is sensitive. Handle quietly it.","This report is sensitive. Handle quietly it."]],"ans":0,"why":["The false friend of French \"sensible\" is \"sensitive\" (delicate), not \"sensible\" (reasonable). Only the first sentence is both grammatical and that meaning. \"Quietly\" is the adverb.","الصديق الكاذب للفرنسية sensible هو sensitive (حسّاس)، لا sensible (عاقل). والجملة الأولى وحدها سليمة بهذا المعنى. والظرف quietly."],"family":"calques"},{"id":"g-sva-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The list of plates is on the desk.","The list of plates is on the desk."],["The list of plates are on the desk.","The list of plates are on the desk."],["The list of plates be on the desk.","The list of plates be on the desk."],["The list of plates are being on the desk.","The list of plates are being on the desk."]],"ans":0,"why":["The head noun is \"list\" (singular), not \"plates\".","رأس الجملة list مفرد، لا plates."],"family":"agreement","diag":true},{"id":"g-sva-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["There are two witnesses in the lobby.","There are two witnesses in the lobby."],["There is two witnesses in the lobby.","There is two witnesses in the lobby."],["There are two witness in the lobby.","There are two witness in the lobby."],["There is two witness in the lobby.","There is two witness in the lobby."]],"ans":0,"why":["\"There are\" agrees with the plural \"two witnesses\".","there are توافق الجمع two witnesses."],"family":"agreement"},{"id":"g-sva-3","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The sergeant, along with two officers, is on the way.","The sergeant, along with two officers, is on the way."],["The sergeant, along with two officers, are on the way.","The sergeant, along with two officers, are on the way."],["The sergeant, along with two officers, be on the way.","The sergeant, along with two officers, be on the way."],["The sergeant, along with two officers, are being on the way.","The sergeant, along with two officers, are being on the way."]],"ans":0,"why":["\"Along with\" does not make the subject plural. The subject is \"the sergeant\".","along with لا تجعل الفاعل جمعًا. الفاعل the sergeant."],"family":"agreement","retest":true},{"id":"g-sva-4","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Neither the passengers nor the driver was hurt.","Neither the passengers nor the driver was hurt."],["Neither the passengers nor the driver were hurt.","Neither the passengers nor the driver were hurt."],["Neither the passengers nor the driver be hurt.","Neither the passengers nor the driver be hurt."],["Neither the passengers nor the driver were hurting hurt.","Neither the passengers nor the driver were hurting hurt."]],"ans":0,"why":["With \"neither/nor\", the verb agrees with the nearer subject: \"the driver was\".","مع neither/nor يوافق الفعل الفاعل الأقرب: the driver was."],"family":"agreement"},{"id":"g-sva-5","tier":6,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The box of plates is on the desk.","The box of plates is on the desk."],["The box of plates are on the desk.","The box of plates are on the desk."],["The box of plates be on the desk.","The box of plates be on the desk."],["The box of plates are being on the desk.","The box of plates are being on the desk."]],"ans":0,"why":["The head noun is \"box\". \"Plates\" does not take over the verb.","رأس الجملة box. وplates لا تسيطر على الفعل."],"family":"agreement","stretch":true},{"id":"g-neg-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["I did not see anyone in the alley.","I did not see anyone in the alley."],["I did not see no one in the alley.","I did not see no one in the alley."],["I did not saw anyone in the alley.","I did not saw anyone in the alley."],["I did not seeing anyone in the alley.","I did not seeing anyone in the alley."]],"ans":0,"why":["One negative is enough: \"did not\" plus \"anyone\". After \"did\", use the base verb \"see\".","نفي واحد يكفي: did not مع anyone. بعد did استخدمي أصل الفعل see."],"family":"negatives","diag":true},{"id":"g-neg-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["She doesn't have any information.","She doesn't have any information."],["She doesn't have no information.","She doesn't have no information."],["She don't have any information.","She don't have any information."],["She doesn't has any information.","She doesn't has any information."]],"ans":0,"why":["\"Doesn't\" already carries the third person. Use \"have\", and use \"any\" after a negative.","doesn't تحمل صيغة الغائب أصلًا. استخدمي have، و any بعد النفي."],"family":"negatives"},{"id":"g-neg-3","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Nobody was in the car.","Nobody was in the car."],["Nobody were not in the car.","Nobody were not in the car."],["Nobody weren't in the car.","Nobody weren't in the car."],["Nobody were in the car.","Nobody were in the car."]],"ans":0,"why":["\"Nobody\" is singular and already negative. \"Was\" is enough.","nobody مفرد ومنفي أصلًا. was تكفي."],"family":"negatives","retest":true},{"id":"g-neg-4","tier":5,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["We did not find any weapon in the bag.","We did not find any weapon in the bag."],["We did not found any weapon in the bag.","We did not found any weapon in the bag."],["We did not find no weapon in the bag.","We did not find no weapon in the bag."],["We not find any weapon in the bag.","We not find any weapon in the bag."]],"ans":0,"why":["After \"did not\", the verb stays \"find\". Do not add a second negative.","بعد did not يبقى الفعل find. لا تضيفي نفيًا ثانيًا."],"family":"negatives"},{"id":"g-q-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Where did the car go?","Where did the car go?"],["Where the car went?","Where the car went?"],["Where did the car went?","Where did the car went?"],["Where went the car?","Where went the car?"]],"ans":0,"why":["Questions need the helper \"did\" plus the base verb \"go\", not \"went\".","السؤال يحتاج did مع أصل الفعل go، لا went."],"family":"questions","diag":true},{"id":"g-q-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["How many people were in the lobby?","How many people were in the lobby?"],["How many people was in the lobby?","How many people was in the lobby?"],["How much people were in the lobby?","How much people were in the lobby?"],["How many peoples were in the lobby?","How many peoples were in the lobby?"]],"ans":0,"why":["\"People\" is plural (\"were\") and countable (\"how many\"), and it does not take -s.","people جمع (were) وقابلة للعد (how many)، ولا تأخذ s."],"family":"questions"},{"id":"g-q-3","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["What time did the call come in?","What time did the call come in?"],["What time the call came in?","What time the call came in?"],["What time did the call came in?","What time did the call came in?"],["At what time came the call in?","At what time came the call in?"]],"ans":0,"why":["Same helper as Day 1: \"did\" + base verb \"come\".","المساعد نفسه كما في اليوم 1: did مع أصل الفعل come."],"family":"questions","retest":true},{"id":"g-q-4","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Did the witness see the plate?","Did the witness see the plate?"],["Did the witness saw the plate?","Did the witness saw the plate?"],["Does the witness saw the plate?","Does the witness saw the plate?"],["Did the witness seen the plate?","Did the witness seen the plate?"]],"ans":0,"why":["After \"did\", use \"see\", not \"saw\" or \"seen\".","بعد did استخدمي see، لا saw ولا seen."],"family":"questions"},{"id":"g-pro-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["Hana and I saw the car.","Hana and I saw the car."],["Me and Hana saw the car.","Me and Hana saw the car."],["Hana and me saw the car.","Hana and me saw the car."],["Me and Hana seen the car.","Me and Hana seen the car."]],"ans":0,"why":["The subject form is \"I\". \"Seen\" cannot be the main verb alone.","صيغة الفاعل I. ولا تكون seen الفعل الرئيسي وحدها."],"family":"pronouns","diag":true},{"id":"g-pro-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The officer who wrote the report is outside.","The officer who wrote the report is outside."],["The officer which wrote the report is outside.","The officer which wrote the report is outside."],["The officer what wrote the report is outside.","The officer what wrote the report is outside."],["The officer whom wrote the report is outside.","The officer whom wrote the report is outside."]],"ans":0,"why":["For a person as the subject of the clause, use \"who\", not \"which\" or \"whom\".","للشخص حين يكون فاعل الصلة استخدمي who، لا which ولا whom."],"family":"pronouns"},{"id":"g-pro-3","tier":4,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The sergeant gave the radio to Noa and me.","The sergeant gave the radio to Noa and me."],["The sergeant gave the radio to Noa and I.","The sergeant gave the radio to Noa and I."],["The sergeant gave the radio to I and Noa.","The sergeant gave the radio to I and Noa."],["The sergeant gave the radio to Noa and we.","The sergeant gave the radio to Noa and we."]],"ans":0,"why":["After \"to\", use the object form \"me\".","بعد to استخدمي صيغة المفعول me."],"family":"pronouns"},{"id":"g-ph-1","tier":1,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The suspect ran, but he was caught.","The suspect ran, but he was caught."],["The suspect ran, he was caught.","The suspect ran, he was caught."],["The suspect ran but, he was caught.","The suspect ran but, he was caught."],["The suspect ran, but he were caught.","The suspect ran, but he were caught."]],"ans":0,"why":["Two full sentences need more than a comma. \"But\" can join them, and \"he was\" agrees.","جملتان تامتان تحتاجان أكثر من فاصلة. but تصل بينهما، و he was توافق."],"family":"phrasing","diag":true},{"id":"g-ph-2","tier":2,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["When I arrived, I saw that the door was open.","When I arrived, I saw that the door was open."],["When I arrived, I seen that the door was open.","When I arrived, I seen that the door was open."],["Upon I arrived, I saw that the door was open.","Upon I arrived, I saw that the door was open."],["When I arrived, I saw that the door open was.","When I arrived, I saw that the door open was."]],"ans":0,"why":["\"Saw\" is the past of \"see\". \"Upon\" needs a noun (\"upon arrival\"), not \"upon I arrived\".","saw ماضي see. upon تحتاج اسمًا (upon arrival)، لا upon I arrived."],"family":"phrasing"},{"id":"g-ph-3","tier":3,"depth":1,"pillar":"grammar","en":"Which sentence is grammatically correct?","ar":"أي جملة صحيحة نحويًا؟ الجمل بالإنجليزية، كما في الامتحان.","opts":[["The driver fled east on King Street.","The driver fled east on King Street."],["The driver fleed east on King Street.","The driver fleed east on King Street."],["The driver fled to east on King Street.","The driver fled to east on King Street."],["East fled the driver on King Street.","East fled the driver on King Street."]],"ans":0,"why":["The past of \"flee\" is \"fled\". Direction \"east\" does not take \"to\" here.","ماضي flee هو fled. والاتجاه east لا يأخذ to هنا."],"family":"phrasing","retest":true},{"id":"g-p correction the backpack black was, not blue.","After the correction the backpack black was, not blue."],["After the correction, the backpack were black, not blue.","After the correction, the backpack were black, not blue."]],"ans":0,"why":["A report correction stays a normal clause: \"was black, not blue\".","تصحيح التقرير يبقى جملة عادية: was black, not blue."],"family":"phrasing","stretch":true},{"id":"ab-agree-1","tier":1,"depth":1,"pillar":"written","en":"The sergeant and the recruit was the first unit on the block.","ar":"The sergeant and the recruit was the first unit on the block.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["Two people joined by \"and\" take \"were\", not \"was\".","شخصان مربوطان بـ and يأخذان were لا was."],"family":"ab-agree","diag":true,"ab":true},{"id":"ab-agree-2","tier":1,"depth":1,"pillar":"written","en":"The sergeant and the recruit were the first unit on the block.","ar":"The sergeant and the recruit were the first unit on the block.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":0,"why":["The compound subject is plural, so \"were\" agrees.","الفاعل المركب جمع، لذا were توافقه."],"family":"ab-agree","diag":true,"ab":true},{"id":"ab-agree-3","tier":3,"depth":1,"pillar":"written","en":"Each of the witnesses have a different hat color.","ar":"Each of the witnesses have a different hat color.","opts":[["A. The sentence is grammatically correct.","A. الجملة صحيحة نحويًا."],["B. The sentence is grammatically incorrect.","B. الجملة غير صحيحة نحويًا."]],"ans":1,"why":["\"Each\" is singular, so the verb is \"has\".","Each مفرد، فالفعل has."],"family":"ab-agree","retest":true,"ab":true},{"id":"ab-agree-4","tier":2,"depth":1,"pillar":"written","en":"The bag of plates is on the rear seat.","ar":"The
