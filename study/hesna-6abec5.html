"اليوم 18 — corner، تفاصيل أكثر"></option><option value="19" data-en="Day 19 — L5-1" data-ar="اليوم 19 — L5-1"></option><option value="20" data-en="Day 20 — L5-1, more details" data-ar="اليوم 20 — L5-1، تفاصيل أكثر"></option><option value="21" data-en="Day 21 — L5-2 + biodata" data-ar="اليوم 21 — L5-2 + بيانات"></option><option value="22" data-en="Day 22 — L5-2, more details" data-ar="اليوم 22 — L5-2، تفاصيل أكثر"></option><option value="23" data-en="Day 23 — L5-3" data-ar="اليوم 23 — L5-3"></option><option value="24" data-en="Day 24 — L5-3, more details" data-ar="اليوم 24 — L5-3، تفاصيل أكثر"></option><option value="25" data-en="Day 25 — L6-1" data-ar="اليوم 25 — L6-1"></option><option value="26" data-en="Day 26 — L6-1, more details" data-ar="اليوم 26 — L6-1، تفاصيل أكثر"></option><option value="27" data-en="Day 27 — L6-2" data-ar="اليوم 27 — L6-2"></option><option value="28" data-en="Day 28 — L6-2, more details + biodata" data-ar="اليوم 28 — L6-2، تفاصيل أكثر + بيانات"></option></select></p>

<script>window.HS={"days":[{"n":1,"tier":1,"depth":1,"budgetMin":45,"tooFastMin":20,"take":{"ab":8,"reading":1},"title_en":"Day 1 — The photograph","title_ar":"اليوم 1 — الصورة","body_en":"Start with the memory drill: picture quiz 1, the 7426 burglary. Study the scene for 2 minutes. No notes. Then it hides. The questions ask only about details the picture shows. After that come the other quizzes: written A/B, correct or incorrect the way the exam asks, plus the transfer traps Arabic and French leave in English; one short reading, and the passage stays visible; logic probes; and a radio call. Logic and the radio call are extra practice, not a fifth section. This is a baseline. A miss is information, and it does not lock any other day.","body_ar":"ابدئي بتمرين الذاكرة: الاختبار 1 لصورة السطو 7426. ادرسي المشهد دقيقتين. بلا ملاحظات. ثم يختفي. الأسئلة عن تفاصيل تُظهرها الصورة فقط. بعد ذلك الاختبارات الأخرى: كتابة A/B، صح أو خطأ كما في الامتحان، مع فخاخ النقل من العربية والفرنسية؛ وقراءة قصيرة يبقى مقطعها ظاهرًا؛ ومجسّات منطق؛ ونداء لاسلكي. المنطق والنداء تدريب إضافي، لا قسمًا خامسًا. هذا خط أساس. الخطأ معلومة، ولا يقفل أي يوم آخر.","mem":["L1-1","L1-1-b"]},{"n":2,"tier":2,"depth":1,"budgetMin":45,"tooFastMin":22,"take":{"ab":8,"reading":1},"title_en":"Day 2 — First raise","title_ar":"اليوم 2 — الرفع الأول","body_en":"Memory first: two Level 1 street sketches. Two minutes each, then the drawing hides. Every question is something that drawing shows. Then logic sits one tier above whatever Day 1 proved. If the probes were already easy, today starts higher: that is the plan catching up, not a compliment. Grammar returns only the families you missed. A high score is saved. It does not close the other sketches or the next day.","body_ar":"الذاكرة أولًا: رسمان من المستوى 1. دقيقتان لكل رسم، ثم يختفي. كل سؤال عن شيء يُظهره ذلك الرسم. ثم المنطق يعلو مستوى واحدًا فوق ما أثبته اليوم 1. إذا كانت المجسّات سهلة أصلًا، فاليوم يبدأ أعلى: الخطة تلحق بكِ، وهذا ليس مجاملة. القواعد تعود فقط للعائلات التي أضعتِها. النتيجة العالية تُحفظ. وهي لا تغلق الرسوم الأخرى ولا اليوم التالي.","mem":["L1-2","L1-2-b"]},{"n":3,"tier":3,"depth":1,"budgetMin":55,"tooFastMin":30,"take":{"ab":8,"reading":1},"title_en":"Day 3 — The line should move","title_ar":"اليوم 3 — يُفترض أن يتحرك الخط","body_en":"Memory first: one more Level 1 sketch, then the first Level 2 corner. Two minutes each, then they hide. Questions match the drawing. Then the same grammar families as Day 1, in new sentences. The scoreboard should show those families climbing. Logic is now long: lines of people, a rule with an exception, \"must be true.\" This is the first day that should not feel quick. If it does, a harder set is offered in the same sitting. The next day stays open either way.","body_ar":"الذاكرة أولًا: رسم آخر من المستوى 1، ثم أول زاوية من المستوى 2. دقيقتان لكل منهما، ثم يختفيان. الأسئلة تطابق الرسم. ثم عائلات القواعد نفسها كما في اليوم 1، بجمل جديدة. لوحة النتائج يُفترض أن تُظهر هذه العائلات وهي ترتفع. المنطق الآن طويل: صفوف أشخاص، وقاعدة باستثناء، و«يجب أن يكون صحيحًا». هذا أول يوم لا يُفترض أن يبدو سريعًا. إذا بدا كذلك تُعرض مجموعة أصعب في الجلسة نفسها. واليوم التالي يبقى مفتوحًا في الحالين.","mem":["L1-3","L1-3-b"]},{"n":4,"tier":4,"depth":1,"budgetMin":60,"tooFastMin":32,"take":{"ab":8,"reading":1},"title_en":"Day 4 — Slow on purpose","title_ar":"اليوم 4 — بطيء عن قصد","body_en":"Memory first: two Level 2 sketches, 2 minutes each, then they hide. Then a full logic block: two rules that seem to argue, an order that has only one legal sequence, a correction you must not mix back in. Grammar only where Day 3 was still soft. You are not supposed to finish this too fast. Finishing it fast at 90% or better is the plan being late, and a harder set is offered in the same sitting.","body_ar":"الذاكرة أولًا: رسمان من المستوى 2، دقيقتان لكل منهما، ثم يختفيان. ثم كتلة منطق كاملة: قاعدتان تبدوان متعارضتين، وترتيب له تسلسل قانوني واحد، وتصحيح لا تخلطينه بالقديم. القواعد فقط حيث بقي اليوم 3 لينًا. لا يُفترض أن تنهي هذا بسرعة. إنهاؤه بسرعة عند 90% أو أفضل يعني أن الخطة تأخّرت، وتُعرض مجموعة أصعب في الجلسة نفسها.","mem":["L2-1","L2-1-b"]},{"n":5,"tier":5,"depth":1,"budgetMin":50,"tooFastMin":28,"take":{"ab":8,"reading":1},"title_en":"Day 5 — Hold the new pace","title_ar":"اليوم 5 — ثبّتي الإيقاع الجديد","body_en":"Memory first: picture quiz 2 on the 7426 burglary. Same photo, finer questions, 2 minutes, then it hides. Every question is something the photo shows. Then a mixed set at today's tier, which is already past Day 4: logic, grammar, reading, and a radio call. The point is pace, not a new kind of puzzle for its own sake.","body_ar":"الذاكرة أولًا: الاختبار 2 لصورة سطو 7426. الصورة نفسها، وأسئلة أدق، دقيقتان ثم تختفي. كل سؤال عن شيء تُظهره الصورة. ثم مجموعة مختلطة في مستوى اليوم، وهو أصلًا بعد اليوم 4: منطق وقواعد وقراءة ونداء لاسلكي. المقصود هو الإيقاع، لا نوعًا جديدًا من الألغاز لذاته.","mem":["L2-2","L2-2-b"]},{"n":6,"tier":5,"depth":2,"budgetMin":50,"tooFastMin":28,"take":{"ab":8,"reading":1},"title_en":"Day 6 — Judgment, and the harder band of the same tier","title_ar":"اليوم 6 — الحكم، والنطاق الأصعب من المستوى نفسه","body_en":"Memory first: two Level 3 street sketches, 2 minutes each, then they hide. Then biodata. The exam's 54 biodata items are not right-or-wrong: some credit is given for every choice, a blank gets none, and two marks get none. Use the Biodata practice section on this page. Answer honestly, one choice, the closest fit. Also gather the Personal History Statement dates. The scored block is still harder than Day 5.","body_ar":"الذاكرة أولًا: رسمان من المستوى 3، دقيقتان لكل منهما، ثم يختفيان. ثم البيانات الشخصية. بنود الامتحان الـ 54 ليست صح أو خطأ: كل خيار يأخذ بعض الرصيد، والفراغ لا يأخذ شيئًا، والعلامتان لا تأخذان شيئًا. استخدمي قسم تدريب البيانات في هذه الصفحة. أجيبي بصدق، خيارًا واحدًا، الأقرب. واجمعي أيضًا تواريخ بيان السيرة. والكتلة المحسوبة ما زالت أصعب من اليوم 5.","mem":["L2-3","L2-3-b"]},{"n":7,"tier":5,"depth":3,"budgetMin":50,"tooFastMin":28,"take":{"ab":8,"reading":1},"title_en":"Day 7 — Look back at Monday","title_ar":"اليوم 7 — انظري إلى الاثنين","body_en":"Memory first: the last Level 3 sketch, then the fine 7426 quiz. Same burglary picture, the small print, 2 minutes, then it hides. Questions match what the picture shows. Then one mixed sitting at this week's top band. 80% is the mastery mark on the scoreboard. At 95% the scoreboard treats the picture as easy. Neither mark closes Week 2. Then open the scoreboard: Day 1 beside today. Fitness, on your own: push-ups, sit-ups, and the 1.5-mile run. The quiz does not grade those.","body_ar":"الذاكرة أولًا: آخر رسم من المستوى 3، ثم اختبار التفاصيل لصورة 7426. صورة السطو نفسها، الحرف الصغير، دقيقتان ثم تختفي. الأسئلة تطابق ما تُظهره الصورة. ثم جلسة مختلطة واحدة في أعلى نطاق هذا الأسبوع. 80% علامة الإتقان على لوحة النتائج. عند 95% تعامل اللوحة الصورة على أنها سهلة. لا علامة منهما تغلق الأسبوع الثاني. ثم افتحي لوحة النتائج: اليوم 1 بجانب اليوم. اللياقة، لحسابكِ: تمارين الضغط، والبطن، وجري 1.5 ميل. الاختبار لا يقيّمها.","mem":["L3-1","L3-1-b"],"bio":6,"bioStart":0},{"n":8,"tier":5,"depth":3,"budgetMin":50,"tooFastMin":26,"take":{"ab":10,"reading":1},"title_en":"Day 8 — Eyes","title_ar":"اليوم 8 — العينان","body_en":"Week 2 Day 1 is open now. It is harder than Week 1. Memory first: Quick Stop, quiz 1, the broad scene. 2 minutes, then it hides. Questions match the picture. Then the other work, which sits higher and aims at what was still soft. That logic is extra practice, not a fifth exam section.","body_ar":"اليوم 1 من الأسبوع الثاني مفتوح الآن. وهو أصعب من الأسبوع الأول. الذاكرة أولًا: كويك ستوب، الاختبار 1، الصورة الكبيرة. دقيقتان ثم تختفي. الأسئلة تطابق الصورة. ثم بقية العمل، وهو أعلى ويستهدف ما بقي لينًا. وذلك المنطق تدريب إضافي، لا قسم امتحان خامس.","mem":["L3-2","L3-2-b"]},{"n":9,"tier":6,"depth":1,"budgetMin":50,"tooFastMin":28,"take":{"ab":10,"reading":1},"title_en":"Day 9 — Read at exam pace","title_ar":"اليوم 9 — اقرئي بإيقاع الامتحان","body_en":"Memory first: Quick Stop, quiz 2, the attributes. Same picture, 2 minutes, then it hides. Then reading with understanding. The passage stays on the screen. It is not a memory test. Answer only from it. On the real exam, after the 2-minute picture study, you have 2 hours for the 169 questions, about 43 seconds each if you keep moving. Grammar only on families still under 80%.","body_ar":"الذاكرة أولًا: كويك ستوب، الاختبار 2، الصفات. الصورة نفسها، دقيقتان ثم تختفي. ثم القراءة بفهم. المقطع يبقى على الشاشة. ليس اختبار ذاكرة. أجيبي منه فقط. في الامتحان الحقيقي، بعد دراسة الصورة لدقيقتين، لديكِ ساعتان للأسئلة الـ 169، نحو 43 ثانية لكل سؤال إذا واصلتِ التقدّم. القواعد فقط للعائلات التي ما زالت تحت 80%.","mem":["L3-3","L3-3-b"]},{"n":10,"tier":6,"depth":1,"budgetMin":50,"tooFastMin":28,"take":{"ab":10,"reading":1},"title_en":"Day 10 — A sentence a sergeant can use","title_ar":"اليوم 10 — جملة يستطيع الرقيب استخدامها","body_en":"Memory first: Quick Stop, quiz 3, the fine detail. Same picture, 2 minutes, then it hides. Then grammar and phrasing in report register: one sentence is correct, three are not. On paper, write a six-line incident (who, what, when, where, direction, correction) and read it against the sentences you just judged. Do not drill a family the scoreboard has retired.","body_ar":"الذاكرة أولًا: كويك ستوب، الاختبار 3، التفاصيل الدقيقة. الصورة نفسها، دقيقتان ثم تختفي. ثم القواعد والصياغة في لغة التقرير: جملة واحدة صحيحة وثلاث ليست كذلك. على الورق، اكتبي حادثة من ستة أسطر (من، ماذا، متى، أين، الاتجاه، التصحيح) واقرئيها مقابل الجمل التي حكمتِ عليها. لا تدرّبي عائلة أوقفتها لوحة النتائج.","mem":["L4-1","L4-1-b"]},{"n":11,"tier":6,"depth":2,"budgetMin":50,"tooFastMin":28,"take":{"ab":10,"reading":1},"title_en":"Day 11 — Which rule wins","title_ar":"اليوم 11 — أي قاعدة تفوز","body_en":"Memory first: street sketch L4-1, 2 minutes, then it hides. Then procedures. Two rules seem to apply; one governs. Pick the next step, not the step that sounds busy. This band is harder than Day 10 even though both sit on tier 6.","body_ar":"الذاكرة أولًا: رسم الشارع L4-1، دقيقتان ثم يختفي. ثم الإجراءات. قاعدتان تبدوان منطبقتين؛ وواحدة تحكم. اختاري الخطوة التالية، لا الخطوة التي تبدو مشغولة. هذا النطاق أصعب من اليوم 10 رغم أن كليهما في المستوى 6.","mem":["L4-2","L4-2-b"]},{"n":12,"tier":6,"depth":3,"budgetMin":70,"tooFastMin":40,"take":{"ab":10,"reading":1},"title_en":"Day 12 — Dress rehearsal","title_ar":"اليوم 12 — بروفة","body_en":"Memory first: street sketch L4-2, 2 minutes, then it hides. Then all pillars, one sitting, including a new observation scenario with a correction. The scoreboard marks what is still soft. 98% with time left means the stretch bank is the one that counts, not a review of what you already command. Week 3 stays open either way.","body_ar":"الذاكرة أولًا: رسم الشارع L4-2، دقيقتان ثم يختفي. ثم كل الأعمدة، في جلسة واحدة، ومنها مشهد ملاحظة جديد فيه تصحيح. لوحة النتائج تعلّم ما يزال لينًا. 98% مع وقت متبقٍّ تعني أن بنك التمدد هو الذي يُحسب، لا مراجعة ما تملكينه أصلًا. الأسبوع الثالث يبقى مفتوحًا في الحالين.","mem":["L4-3","L4-3-b"]},{"n":13,"tier":6,"depth":3,"budgetMin":45,"tooFastMin":24,"take":{"ab":10,"reading":1},"title_en":"Day 13 — Soft spots, or the stretch","title_ar":"اليوم 13 — المواضع اللينة، أو التمدد","body_en":"Memory first: street sketch L4-3, 2 minutes, then it hides. Then the soft spots, if anything is still under 95%. If nothing is, the stretch bank loads. Use the Biodata practice section again and check that the two lateness answers still agree. Fitness, on your own: agility run and the 300-meter run. Not scored here. The next day stays open either way.","body_ar":"الذاكرة أولًا: رسم الشارع L4-3، دقيقتان ثم يختفي. ثم المواضع اللينة، إذا بقي شيء تحت 95%. إذا لم يبقَ شيء يُحمَّل بنك التمدد. استخدمي قسم تدريب البيانات مرة أخرى وتحقّقي أن جوابَي التأخر ما زالا متفقين. اللياقة، لحسابكِ: جري الرشاقة وجري 300 متر. لا يُحسبان هنا. واليوم التالي يبقى مفتوحًا في الحالين.","mode":"repair","stretchTake":{"logic":8,"grammar":4,"listen":1,"obs":1},"mem":["b7426-1","b7426-b"]},{"n":14,"tier":6,"depth":3,"budgetMin":35,"tooFastMin":18,"take":{"ab":10,"reading":1},"title_en":"Day 14 — The photograph, beside today","title_ar":"اليوم 14 — الصورة، بجانب اليوم","body_en":"Memory first: street sketch L4-4, the hand-drawn corner, 2 minutes, then it hides. Every question is something that drawing shows, including the driver. Then a short sharp mix if Day 13 was high, or the weak bank if it was not. Put Day 1 beside Day 14. Weeks 3 and 4 are already open, and they are harder. The aim across the four weeks is about 98% on this kind of page, with a rested mind, before the Honolulu exam. Bring what HPD's own instructions list; this page does not guess the packing list.","body_ar":"الذاكرة أولًا: رسم الشارع L4-4، الزاوية المرسومة يدويًا، دقيقتان ثم يختفي. كل سؤال عن شيء يُظهره ذلك الرسم، بما فيه السائق. ثم مزيج قصير حاد إذا كان اليوم 13 مرتفعًا، أو بنك الضعف إذا لم يكن. ضعي اليوم 1 بجانب اليوم 14. الأسبوعان الثالث والرابع مفتوحان أصلًا، وهما أصعب. هدف الأسابيع الأربعة نحو 98% على صفحة من هذا النوع، بعقل مرتاح، قبل امتحان هونولولو. أحضري ما تذكره تعليمات الشرطة نفسها؛ هذه الصفحة لا تخمّن قائمة الأمتعة.","mode":"capstone","mem":["qstop-1","qstop-b"],"bio":6,"bioStart":6},{"n":15,"tier":6,"depth":2,"budgetMin":55,"tooFastMin":30,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 1 — Corner, the broad scene","title_ar":"الأسبوع 3 اليوم 1 — الزاوية، الصورة الكبيرة","body_en":"Week 3 is harder than Week 2, and it is open now. Memory first: the corner crash, quiz 1, the broad scene. People, the two vehicles, and what happened. 2 minutes, then the picture hides. Questions match that picture only. Then written A/B, a short reading with the passage left visible, logic, and a radio call.","body_ar":"الأسبوع الثالث أصعب من الثاني، وهو مفتوح الآن. الذاكرة أولًا: حادث الزاوية، الاختبار 1، الصورة الكبيرة. الأشخاص، والمركبتان، وما حدث. دقيقتان ثم تختفي الصورة. الأسئلة تطابق تلك الصورة فقط. ثم كتابة A/B، وقراءة قصيرة يبقى مقطعها ظاهرًا، ومنطق، ونداء لاسلكي.","mem":["L4-4"]},{"n":16,"tier":6,"depth":2,"budgetMin":55,"tooFastMin":30,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 2 — Corner, attributes","title_ar":"الأسبوع 3 اليوم 2 — الزاوية، الصفات","body_en":"Memory first: the same corner, quiz 2. Clothes, counts, and which person goes with which object. 2 minutes, then it hides. Then logic, grammar, a reading whose passage stays visible, and a comprehension set.","body_ar":"الذاكرة أولًا: الزاوية نفسها، الاختبار 2. الملابس والعدد وأي شخص مع أي غرض. دقيقتان ثم تختفي. ثم منطق وقواعد وقراءة يبقى مقطعها ظاهرًا ومجموعة فهم.","mem":["L4-4-b"]},{"n":17,"tier":6,"depth":2,"budgetMin":60,"tooFastMin":32,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 3 — Corner, fine detail","title_ar":"الأسبوع 3 اليوم 3 — الزاوية، التفاصيل الدقيقة","body_en":"Memory first: the same corner, quiz 3. Signs, small counts, and the look-alike details from the earlier pictures. 2 minutes, then it hides. Then a longer logic block, two readings, written A/B, and a radio call.","body_ar":"الذاكرة أولًا: الزاوية نفسها، الاختبار 3. اللافتات والأعداد الصغيرة والتفاصيل التي تشبه الصور السابقة. دقيقتان ثم تختفي. ثم كتلة منطق أطول، وقراءتان، وكتابة A/B، ونداء لاسلكي.","mem":["corner-1"]},{"n":18,"tier":6,"depth":3,"budgetMin":60,"tooFastMin":32,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 4 — Denser streets","title_ar":"الأسبوع 3 اليوم 4 — شوارع أكثف","body_en":"Memory first: street sketch L5-1. The corner is denser than Week 1. 2 minutes, then it hides. Every question is on the drawing. Then grammar, logic, comprehension, a radio call, and written A/B.","body_ar":"الذاكرة أولًا: رسم الشارع L5-1. الزاوية أكثف من الأسبوع الأول. دقيقتان ثم يختفي. كل سؤال عن الرسم. ثم قواعد ومنطق وفهم ونداء لاسلكي وكتابة A/B.","mem":["corner-b"]},{"n":19,"tier":6,"depth":3,"budgetMin":60,"tooFastMin":32,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 5 — Denser streets, continued","title_ar":"الأسبوع 3 اليوم 5 — الشوارع الأكثف، تتمة","body_en":"Memory first: street sketch L5-2, 2 minutes, then it hides. Then two readings with the passages left visible, an observation scenario, logic, and written A/B.","body_ar":"الذاكرة أولًا: رسم الشارع L5-2، دقيقتان ثم يختفي. ثم قراءتان يبقى مقطعاهما ظاهرين، ومشهد ملاحظة، ومنطق، وكتابة A/B.","mem":["L5-1"]},{"n":20,"tier":6,"depth":3,"budgetMin":55,"tooFastMin":30,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 6 — Denser streets, and biodata","title_ar":"الأسبوع 3 اليوم 6 — الشوارع الأكثف، والبيانات","body_en":"Memory first: street sketch L5-3, 2 minutes, then it hides. Then grammar, logic, one reading, and comprehension. Use the Biodata practice section again: one honest choice, no blank, no second mark.","body_ar":"الذاكرة أولًا: رسم الشارع L5-3، دقيقتان ثم يختفي. ثم قواعد ومنطق وقراءة واحدة وفهم. استخدمي قسم تدريب البيانات مرة أخرى: خيار صادق واحد، بلا فراغ، وبلا علامة ثانية.","mem":["L5-1-b"]},{"n":21,"tier":6,"depth":3,"budgetMin":65,"tooFastMin":34,"take":{"ab":12,"reading":2},"title_en":"Week 3 Day 7 — A correction incident","title_ar":"الأسبوع 3 اليوم 7 — حادثة فيها تصحيح","body_en":"Memory first: the lobby correction, L6-1. Study the scene for 2 minutes. The questions use only what that scene shows, including the correction you must keep and the one you must drop. Then the hardest mixed set of this week: logic, grammar, reading, a radio call, written A/B, and an observation scenario.","body_ar":"الذاكرة أولًا: تصحيح الردهة، L6-1. ادرسي المشهد دقيقتين. الأسئلة تستخدم فقط ما يُظهره ذلك المشهد، بما فيه التصحيح الذي تبقينه والذي تسقطينه. ثم أصعب مجموعة مختلطة في هذا الأسبوع: منطق وقواعد وقراءة ونداء لاسلكي وكتابة A/B ومشهد ملاحظة.","mem":["L5-2"],"bio":6,"bioStart":12},{"n":22,"tier":6,"depth":3,"budgetMin":70,"tooFastMin":36,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 1 — The second correction","title_ar":"الأسبوع 4 اليوم 1 — التصحيح الثاني","body_en":"Week 4 is the hardest week, and it is open now. Memory first: the garage correction, L6-2. 2 minutes, then it hides. Keep the detail the scene tells you to keep, and drop the one it tells you to disregard. Then two readings, comprehension, a long logic block, grammar, and written A/B.","body_ar":"الأسبوع الرابع هو الأصعب، وهو مفتوح الآن. الذاكرة أولًا: تصحيح المرآب، L6-2. دقيقتان ثم يختفي. أبقي التفصيل الذي يقول المشهد أن تبقيه، وأسقطي الذي يقول أن تتجاهليه. ثم قراءتان وفهم وكتلة منطق طويلة وقواعد وكتابة A/B.","mem":["L5-2-b"]},{"n":23,"tier":6,"depth":3,"budgetMin":65,"tooFastMin":34,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 2 — Quick Stop, fine review","title_ar":"الأسبوع 4 اليوم 2 — كويك ستوب، مراجعة دقيقة","body_en":"Memory first: Quick Stop, quiz 3, again. Same picture, same questions, 2 minutes, then it hides. The written work around it is the top tier: grammar, logic, one reading, a radio call, an observation scenario, and written A/B.","body_ar":"الذاكرة أولًا: كويك ستوب، الاختبار 3، مرة أخرى. الصورة نفسها والأسئلة نفسها، دقيقتان ثم تختفي. والعمل الكتابي حولها في أعلى مستوى: قواعد ومنطق وقراءة واحدة ونداء لاسلكي ومشهد ملاحظة وكتابة A/B.","mem":["L5-3"]},{"n":24,"tier":6,"depth":3,"budgetMin":65,"tooFastMin":34,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 3 — Corner again, attributes","title_ar":"الأسبوع 4 اليوم 3 — الزاوية مرة أخرى، الصفات","body_en":"Memory first: the corner crash, quiz 2, again. 2 minutes, then it hides. Then two readings, comprehension, logic, grammar, and written A/B at the top tier.","body_ar":"الذاكرة أولًا: حادث الزاوية، الاختبار 2، مرة أخرى. دقيقتان ثم يختفي. ثم قراءتان وفهم ومنطق وقواعد وكتابة A/B في أعلى مستوى.","mem":["L5-3-b"]},{"n":25,"tier":6,"depth":3,"budgetMin":70,"tooFastMin":36,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 4 — Corner again, fine detail","title_ar":"الأسبوع 4 اليوم 4 — الزاوية مرة أخرى، التفاصيل الدقيقة","body_en":"Memory first: the corner crash, quiz 3, again. Signs and small counts. 2 minutes, then it hides. Then logic, a reading, a radio call, an observation scenario, grammar, and written A/B.","body_ar":"الذاكرة أولًا: حادث الزاوية، الاختبار 3، مرة أخرى. اللافتات والأعداد الصغيرة. دقيقتان ثم يختفي. ثم منطق وقراءة ونداء لاسلكي ومشهد ملاحظة وقواعد وكتابة A/B.","mem":["L6-1"]},{"n":26,"tier":6,"depth":3,"budgetMin":65,"tooFastMin":34,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 5 — The lobby correction, again","title_ar":"الأسبوع 4 اليوم 5 — تصحيح الردهة، مرة أخرى","body_en":"Memory first: L6-1 again. Same lobby, same questions, 2 minutes, then it hides. Then the top-tier written and reading set: grammar, two readings, comprehension, logic, and written A/B.","body_ar":"الذاكرة أولًا: L6-1 مرة أخرى. الردهة نفسها والأسئلة نفسها، دقيقتان ثم تختفي. ثم مجموعة الكتابة والقراءة في أعلى مستوى: قواعد وقراءتان وفهم ومنطق وكتابة A/B.","mem":["L6-1-b"]},{"n":27,"tier":6,"depth":3,"budgetMin":60,"tooFastMin":32,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 6 — The garage correction, and biodata","title_ar":"الأسبوع 4 اليوم 6 — تصحيح المرآب، والبيانات","body_en":"Memory first: L6-2 again. 2 minutes, then it hides. Then grammar, logic, one reading, a radio call, comprehension, and written A/B. Use the Biodata practice section once more before exam week: one closest honest choice on every item.","body_ar":"الذاكرة أولًا: L6-2 مرة أخرى. دقيقتان ثم يختفي. ثم قواعد ومنطق وقراءة واحدة ونداء لاسلكي وفهم وكتابة A/B. استخدمي قسم تدريب البيانات مرة أخيرة قبل أسبوع الامتحان: خيار صادق واحد أقرب في كل بند.","mem":["L6-2"]},{"n":28,"tier":6,"depth":3,"budgetMin":50,"tooFastMin":24,"take":{"ab":14,"reading":2},"title_en":"Week 4 Day 7 — Day 1 beside today","title_ar":"الأسبوع 4 اليوم 7 — اليوم 1 بجانب اليوم","body_en":"Memory first: the fine 7426 quiz again. Same burglary picture, 2 minutes, then it hides. Then a short top-tier mix: logic, grammar, one reading, a radio call, and written A/B. Put Day 1 beside today. The aim, walking into the Honolulu exam, is about 98% on this kind of page. Every earlier week is still open if you want it.","body_ar":"الذاكرة أولًا: اختبار التفاصيل لصورة 7426 مرة أخرى. صورة السطو نفسها، دقيقتان ثم تختفي. ثم مزيج قصير في أعلى مستوى: منطق وقواعد وقراءة واحدة ونداء لاسلكي وكتابة A/B. ضعي اليوم 1 بجانب اليوم. الهدف، وأنتِ داخلة إلى امتحان هونولولو، نحو 98% على صفحة من هذا النوع. كل أسبوع سابق ما زال مفتوحًا إذا أردته.","mem":["L6-2-b"],"bio":6,"bioStart":18}],"items":[{"id":"L-seq-1","tier":1,"depth":1,"pillar":"logic","en":"What number comes next: 5, 8, 11, 14, ?","ar":"ما الرقم التالي: 5, 8, 11, 14, ?","opts":[["17","17"],["16","16"],["18","18"],["20","20"]],"ans":0,"why":["Each term adds 3.","كل حد يزيد 3."]},{"id":"L-seq-2","tier":1,"depth":1,"pillar":"logic","en":"What number comes next: 3, 6, 12, 24, ?","ar":"ما الرقم التالي: 3, 6, 12, 24, ?","opts":[["48","48"],["36","36"],["46","46"],["50","50"]],"ans":0,"why":["Each term doubles.","كل حد يتضاعف."]},{"id":"L-seq-3","tier":1,"depth":2,"pillar":"logic","en":"What number comes next: 2, 5, 8, 11, ?","ar":"ما الرقم التالي: 2, 5, 8, 11, ?","opts":[["14","14"],["13","13"],["15","15"],["17","17"]],"ans":0,"why":["Each term adds 3.","كل حد يزيد 3."]},{"id":"L-seq-4","tier":2,"depth":1,"pillar":"logic","en":"What number comes next: 4, 6, 9, 13, 18, ?","ar":"ما الرقم التالي: 4, 6, 9, 13, 18, ?","opts":[["24","24"],["22","22"],["23","23"],["26","26"]],"ans":0,"why":["The gaps grow by 1: +2, +3, +4, +5, +6.","الفجوات تزيد 1: +2 ثم +3 ثم +4 ثم +5 ثم +6."]},{"id":"L-seq-5","tier":2,"depth":1,"pillar":"logic","en":"What number comes next: 3, 4, 8, 9, 18, 19, ?","ar":"ما الرقم التالي: 3, 4, 8, 9, 18, 19, ?","opts":[["38","38"],["20","20"],["36","36"],["40","40"]],"ans":0,"why":["Alternate ×2 and +1.","التناوب: ×2 ثم +1."]},{"id":"L-seq-6","tier":2,"depth":2,"pillar":"logic","en":"What number comes next: 7, 14, 15, 30, 31, ?","ar":"ما الرقم التالي: 7, 14, 15, 30, 31, ?","opts":[["62","62"],["32","32"],["60","60"],["63","63"]],"ans":0,"why":["Alternate ×2 and +1.","التناوب: ×2 ثم +1."]},{"id":"L-seq-7","tier":3,"depth":1,"pillar":"logic","en":"What number comes next: 2, 5, 11, 23, ?","ar":"ما الرقم التالي: 2, 5, 11, 23, ?","opts":[["47","47"],["46","46"],["48","48"],["69","69"]],"ans":0,"why":["Each term is ×2 then +1.","كل حد: ×2 ثم +1."]},{"id":"L-seq-8","tier":3,"depth":2,"pillar":"logic","en":"What number comes next: 1, 2, 6, 7, 21, 22, ?","ar":"ما الرقم التالي: 1, 2, 6, 7, 21, 22, ?","opts":[["66","66"],["44","44"],["63","63"],["69","69"]],"ans":0,"why":["Alternate ×3 and +1.","التناوب: ×3 ثم +1."]},{"id":"L-seq-9","tier":4,"depth":1,"pillar":"logic","en":"What number comes next: 4, 5, 7, 11, 19, ?","ar":"ما الرقم التالي: 4, 5, 7, 11, 19, ?","opts":[["35","35"],["33","33"],["36","36"],["43","43"]],"ans":0,"why":["Each gap doubles, starting at +1.","كل فجوة تتضاعف، بدءًا من +1."]},{"id":"L-seq-10","tier":4,"depth":2,"pillar":"logic","en":"What number comes next: 8, 11, 17, 29, ?","ar":"ما الرقم التالي: 8, 11, 17, 29, ?","opts":[["53","53"],["51","51"],["77","77"],["89","89"]],"ans":0,"why":["Each gap doubles, starting at +3.","كل فجوة تتضاعف، بدءًا من +3."]},{"id":"L-seq-11","tier":5,"depth":1,"pillar":"logic","en":"What number comes next: 2, 3, 5, 9, 17, ?","ar":"ما الرقم التالي: 2, 3, 5, 9, 17, ?","opts":[["33","33"],["32","32"],["34","34"],["49","49"]],"ans":0,"why":["The gaps double: +1, +2, +4, +8, +16. Next is 33.","الفجوات تتضاعف: +1، +2، +4، +8، +16. التالي 33."]},{"id":"L-seq-12","tier":5,"depth":2,"pillar":"logic","en":"What number comes next: 6, 7, 9, 13, 21, ?","ar":"ما الرقم التالي: 6, 7, 9, 13, 21, ?","opts":[["37","37"],["36","36"],["45","45"],["53","53"]],"ans":0,"why":["Gaps double from +1.","الفجوات تتضاعف من +1."]},{"id":"L-seq-13","tier":6,"depth":1,"pillar":"logic","en":"What number comes next: 5, 6, 8, 12, 20, 36, ?","ar":"ما الرقم التالي: 5, 6, 8, 12, 20, 36, ?","opts":[["68","68"],["52","52"],["66","66"],["70","70"]],"ans":0,"why":["Gaps double from +1.","الفجوات تتضاعف من +1."],"stretch":true},{"id":"L-seq-14","tier":6,"depth":2,"pillar":"logic","en":"What number comes next: 9, 10, 12, 16, 24, ?","ar":"ما الرقم التالي: 9, 10, 12, 16, 24, ?","opts":[["40","40"],["48","48"],["56","56"],["72","72"]],"ans":0,"why":["Gaps double from +1. Next gap is +32.","الفجوات تتضاعف من +1. الفجوة التالية +32."],"stretch":true},{"id":"L-if-1","tier":1,"depth":1,"pillar":"logic","en":"Using only this rule: if a report is late, the sergeant is notified. This report is late. Is the sergeant notified?","ar":"باستخدام هذه القاعدة فقط: إذا تأخر التقرير يُبلَّغ الرقيب. هذا التقرير متأخر. هل يُبلَّغ الرقيب؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":0,"why":["The rule's \"if\" happened, so the result follows.","شرط القاعدة وقع، فالنتيجة تتبع."]},{"id":"L-if-2","tier":1,"depth":1,"pillar":"logic","en":"Using only this rule: every night-shift officer carries a radio. Noa is a night-shift officer. Does Noa carry a radio?","ar":"باستخدام هذه القاعدة فقط: كل ضابط في نوبة الليل يحمل جهاز لاسلكي. نوا ضابط في نوبة الليل. هل يحمل نوا جهازًا؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":0,"why":["Noa is inside the group the rule covers.","نوا داخل المجموعة التي تغطيها القاعدة."]},{"id":"L-if-3","tier":1,"depth":2,"pillar":"logic","en":"Using only this rule: every night-shift officer carries a radio. Kai carries a radio. Is Kai on the night shift?","ar":"باستخدام هذه القاعدة فقط: كل ضابط في نوبة الليل يحمل جهازًا. كاي يحمل جهازًا. هل كاي في نوبة الليل؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":2,"why":["The rule does not say that only night-shift officers carry radios.","القاعدة لا تقول إن نوبة الليل وحدها تحمل الأجهزة."]},{"id":"L-if-4","tier":2,"depth":1,"pillar":"logic","en":"Using only this rule: if a report is late, the sergeant is notified. The sergeant was not notified. Was the report late?","ar":"باستخدام هذه القاعدة فقط: إذا تأخر التقرير يُبلَّغ الرقيب. لم يُبلَّغ الرقيب. هل تأخر التقرير؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":1,"why":["If the report had been late, the sergeant would have been notified. That did not happen, so it was not late.","لو تأخر التقرير لبلغوا الرقيب. وهذا لم يحدث، فالتقرير لم يتأخر."]},{"id":"L-if-5","tier":2,"depth":1,"pillar":"logic","en":"Using only this rule: if the scene is active, logging waits until the end of the shift. The scene is not active. Must logging wait until the end of the shift?","ar":"باستخدام هذه القاعدة فقط: إذا كان المسرح نشطًا يُؤجَّل التسجيل إلى نهاية النوبة. المسرح ليس نشطًا. هل يجب أن ينتظر التسجيل نهاية النوبة؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":2,"why":["The rule only tells you what happens when the scene is active. It does not say what happens otherwise.","القاعدة تخبرك بما يحدث حين يكون المسرح نشطًا فقط. ولا تقول ماذا يحدث في غير ذلك."]},{"id":"L-if-6","tier":2,"depth":2,"pillar":"logic","en":"Using only this rule: no officer on the night shift works Mondays. Kai works Mondays. Is Kai on the night shift?","ar":"باستخدام هذه القاعدة فقط: لا ضابط في نوبة الليل يعمل الاثنين. كاي يعمل الاثنين. هل كاي في نوبة الليل؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":1,"why":["If Kai were on the night shift, Kai could not work Mondays. Kai does work Mondays, so Kai is not on that shift.","لو كان كاي في نوبة الليل لما عمل الاثنين. وهو يعمل الاثنين، فهو ليس في تلك النوبة."],"probe":true},{"id":"L-if-7","tier":3,"depth":1,"pillar":"logic","en":"Using only this rule: an officer may enter without a warrant only if there is consent or an emergency. There is no consent and no emergency. May the officer enter under this rule?","ar":"باستخدام هذه القاعدة فقط: يجوز للضابط الدخول بلا مذكرة فقط إذا وُجدت موافقة أو طارئ. لا موافقة ولا طارئ. هل يجوز الدخول بموجب هذه القاعدة؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":1,"why":["Neither of the only two permitted conditions is true.","لا أحد من الشرطين المسموح بهما متحقق."],"probe":true},{"id":"L-if-8","tier":3,"depth":1,"pillar":"logic","en":"Using only these rules: all reports are filed by 6 PM, and this rule has no exceptions. Report X was filed. Was it filed by 6 PM?","ar":"باستخدام هاتين القاعدتين فقط: كل التقارير تُودَع قبل 6 مساءً، ولا استثناء. التقرير X أُودع. هل أُودع قبل 6 مساءً؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":0,"why":["Report X is a report, and the rule covers every report.","التقرير X تقرير، والقاعدة تشمل كل التقارير."],"probe":true},{"id":"L-if-9","tier":3,"depth":2,"pillar":"logic","en":"Using only this rule: if both officers on a call are new, a sergeant rides along. A sergeant rode along. Were both officers new?","ar":"باستخدام هذه القاعدة فقط: إذا كان الضابطان في البلاغ جديدين يرافقهما رقيب. رافقهما رقيب. هل كان كلاهما جديدًا؟","opts":[["Yes","نعم"],["No","لا"],["Not necessarily","ليس بالضرورة"],["Only if a second rule says so","فقط إذا قالت قاعدة ثانية ذلك"]],"ans":2,"why":["The sergeant might have ridden along for a different reason. The rule does not say this is the only reason.","قد يرافق الرقيب لسبب آخر. القاعدة لا تقول إن هذا السبب الوحيد."]},{"id":"L-if-10","tier":4,"depth":1,"pillar":"logic","en":"Rules: (1) Log evidence within 1 hour unless the scene is active. (2) If the scene is active, log it before the shift ends. (3) If the item is a firearm, log it within 30 minutes even if another rule allows longer. The scene is active, the item is a firearm, and the shift ends in 4 hours. What is the deadline?","ar":"القواعد: (1) سجّل الدليل خلال ساعة إلا إذا كان المسرح نشطًا. (2) إذا كان المسرح نشطًا سجّله قبل نهاية النوبة. (3) إذا كان الغرض سلاحًا ناريًا سجّله خلال 30 دقيقة حتى لو سمحت قاعدة أخرى بمدة أطول. المسرح نشط، والغرض سلاح، والنوبة تنتهي بعد 4 ساعات. ما المهلة؟","opts":[["Within 30 minutes","خلال 30 دقيقة"],["Within 1 hour","خلال ساعة"],["Before the shift ends","قبل نهاية النوبة"],["There is no deadline","لا مهلة"]],"ans":0,"why":["Rule 3 governs a firearm even when the scene is active and the shift is hours away.","القاعدة 3 تحكم السلاح الناري حتى لو كان المسرح نشطًا والنوبة بعيدة."]},{"id":"L-if-11","tier":4,"depth":2,"pillar":"logic","en":"Rules: secure the scene before anyone photographs. Photograph an item before anyone moves it. Bag an item before it is logged. Logging is last. Which order respects every rule?","ar":"القواعد: أمّن المسرح قبل أن يصوّر أحد. صوّر الغرض قبل أن يحرّكه أحد. ضعه في الكيس قبل تسجيله. التسجيل آخر خطوة. أي ترتيب يحترم كل القواعد؟","opts":[["Secure, photograph, bag, log","تأمين، تصوير، تكيس، تسجيل"],["Photograph, secure, bag, log","تصوير، تأمين، تكيس، تسجيل"],["Secure, bag, photograph, log","تأمين، تكيس، تصوير، تسجيل"],["Log, secure, photograph, bag","تسجيل، تأمين، تصوير، تكيس"]],"ans":0,"why":["Each rule forces the next step to wait. Only one order satisfies all four.","كل قاعدة تُلزم الخطوة التالية بالانتظار. وترتيب واحد فقط يفي بالأربع."]},{"id":"L-if-12","tier":5,"depth":1,"pillar":"logic","en":"Rules: a pursuit may start only with a supervisor's approval, unless someone is in immediate danger. If it starts under the danger exception, the supervisor is told within 1 minute. There is immediate danger, and no approval was given before the start. Which statement must be true?","ar":"القواعد: لا يبدأ المطاردة إلا بموافقة مشرف، إلا إذا كان شخص في خطر فوري. وإذا بدأت بموجب استثناء الخطر يُبلَّغ المشرف خلال دقيقة. هناك خطر فوري، ولم تُعطَ موافقة قبل البدء. أي عبارة يجب أن تكون صحيحة؟","opts":[["The pursuit may start, and the supervisor is told within 1 minute.","يجوز أن تبدأ المطاردة، ويُبلَّغ المشرف خلال دقيقة."],["The pursuit may not start, because approval was missing.","لا يجوز أن تبدأ المطاردة لأن الموافقة غائبة."],["The pursuit may start, and no one needs to tell the supervisor.","يجوز أن تبدأ المطاردة ولا حاجة لإبلاغ المشرف."],["The pursuit may start only after the shift ends.","يجوز أن تبدأ المطاردة بعد نهاية النوبة فقط."]],"ans":0,"why":["The danger exception allows the start, and it adds a one-minute notice. It does not erase the notice.","استثناء الخطر يسمح بالبدء، ويضيف إبلاغًا خلال دقيقة. ولا يلغي الإبلاغ."]},{"id":"L-if-13","tier":5,"depth":2,"pillar":"logic","en":"A call is logged at 10:12. Backup arrives 7 minutes after the log. You must open your notes 3 minutes before backup arrives. At what time do you open your notes? Use only these times.","ar":"يُسجَّل البلاغ عند 10:12. يصل الدعم بعد 7 دقائق من التسجيل. يجب أن تفتحي ملاحظاتك قبل 3 دقائق من وصول الدعم. في أي وقت تفتحين الملاحظات؟ استخدمي هذه الأوقات فقط.","opts":[["10:16","10:16"],["10:15","10:15"],["10:19","10:19"],["10:22","10:22"]],"ans":0,"why":["Backup is at 10:19. Three minutes before that is 10:16.","الدعم يصل 10:19. قبل ذلك بثلاث دقائق هو 10:16."]},{"id":"L-if-14","tier":6,"depth":1,"pillar":"logic","en":"Rules: (1) Bag currency before it is counted. (2) Count it before it is logged. (3) If a second officer is not present, do not count it; seal the bag and log \"uncounted\" instead. (4) Logging is otherwise last. One officer is present. Which action is required?","ar":"القواعد: (1) ضع النقد في الكيس قبل عدّه. (2) عُدّه قبل تسجيله. (3) إذا لم يحضر ضابط ثانٍ فلا تعدّه؛ أغلق الكيس وسجّل «غير معدود» بدلًا من ذلك. (4) التسجيل في غير هذه الحالة هو الأخير. ضابط واحد حاضر. ما الإجراء المطلوب؟","opts":[["Seal the bag and log it as uncounted.","أغلق الكيس وسجّله غير معدود."],["Count it, then log the total.","عُدّه ثم سجّل المجموع."],["Log the total, then bag it.","سجّل المجموع ثم ضعه في الكيس."],["Leave it unbagged until a second officer arrives. The rules do not allow any other step.","اتركه بلا كيس حتى يصل ضابط ثانٍ. القواعد لا تسمح بأي خطوة أخرى."]],"ans":0,"why":["Rule 3 replaces counting when the second officer is absent. The bag is still sealed and a log line is still made.","القاعدة 3 تستبدل العدّ حين يغيب الضابط الثاني. ويبقى الكيس مغلقًا ويبقى سطر التسجيل."],"stretch":true},{"id":"L-if-15","tier":6,"depth":2,"pillar":"logic","en":"Four statements, one scene: the radio first said the hoodie was gray. A minute later the dispatcher said, \"Disregard gray. The hoodie is green. The cap is still red.\" Which description must you keep?","ar":"أربع عبارات، مشهد واحد: قال اللاسلكي أولًا إن القلنسوة رمادية. وبعد دقيقة قال الموزّع: «تجاهلوا الرمادي. القلنسوة خضراء. القبعة ما زالت حمراء.» أي وصف تبقيه؟","opts":[["Green hoodie, red cap.","قلنسوة خضراء، قبعة حمراء."],["Gray hoodie, red cap.","قلنسوة رمادية، قبعة حمراء."],["Green hoodie, gray cap.","قلنسوة خضراء، قبعة رمادية."],["Gray hoodie, green cap.","قلنسوة رمادية، قبعة خضراء."]],"ans":0,"why":["A correction replaces only the detail it names. The cap was not corrected.","التصحيح يستبدل التفصيل الذي يسميه فقط. القبعة لم تُصحَّح."],"stretch":true},{"id":"L-line-a-0","tier":3,"depth":1,"pillar":"logic","en":"Four officers stand in a line, first to last. Kai is somewhere before Noa. Rae is last. Noa is immediately after Kai. Sol is not first. Who is first?","ar":"أربعة ضباط في صف، من الأول إلى الأخير. كاي قبل نوا في مكان ما. راي الأخير. نوا مباشرة بعد كاي. سول ليس الأول. من هو الأول؟","opts":[["Kai","Kai"],["Noa","Noa"],["Rae","Rae"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is Kai, Noa, Sol, Rae. Position 1 is Kai.","الترتيب الوحيد الذي يوافق كل القواعد هو Kai، Noa، Sol، Rae. الموضع 1 هو Kai."],"probe":true},{"id":"L-line-a-2","tier":3,"depth":1,"pillar":"logic","en":"Four officers stand in a line, first to last. Kai is some ذي يوافق كل القواعد هو Hana، Ika، Dee، Bo. الموضع 3 هو Dee."]},{"id":"L-line-l-0","tier":4,"depth":2,"pillar":"logic","en":"Four doors are checked from first to last. North is checked before South. West is first. East is immediately after North. South is last. Who is first?","ar":"أربعة أبواب تُفحص من الأول إلى الأخير. نورث يُفحص قبل ساوث. ويست الأول. إيست مباشرة بعد نورث. ساوث الأخير. من هو الأول؟","opts":[["West","West"],["North","North"],["East","East"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is West, North, East, South. Position 1 is West.","الترتيب الوحيد الذي يوافق كل القواعد هو West، North، East، South. الموضع 1 هو West."]},{"id":"L-line-l-2","tier":4,"depth":2,"pillar":"logic","en":"Four doors are checked from first to last. North is checked before South. West is first. East is immediately after North. South is last. Who is third?","ar":"أربعة أبواب تُفحص من الأول إلى الأخير. نورث يُفحص قبل ساوث. ويست الأول. إيست مباشرة بعد نورث. ساوث الأخير. من هو الثالث؟","opts":[["East","East"],["North","North"],["South","South"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is West, North, East, South. Position 3 is East.","الترتيب الوحيد الذي يوافق كل القواعد هو West، North، East، South. الموضع 3 هو East."]},{"id":"L-line-h-0","tier":6,"depth":2,"pillar":"logic","en":"Four witnesses speak in order, first to last. North speaks before East. West speaks immediately after South. East is last. South is not first. Who is first?","ar":"أربعة شهود يتكلمون بالترتيب، من الأول إلى الأخير. نورث يتكلم قبل إيست. ويست يتكلم مباشرة بعد ساوث. إيست الأخير. ساوث ليس الأول. من هو الأول؟","opts":[["North","North"],["East","East"],["South","South"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is North, South, West, East. Position 1 is North.","الترتيب الوحيد الذي يوافق كل القواعد هو North، South، West، East. الموضع 1 هو North."],"stretch":true},{"id":"L-line-h-2","tier":6,"depth":2,"pillar":"logic","en":"Four witnesses speak in order, first to last. North speaks before East. West speaks immediately after South. East is last. South is not first. Who is third?","ar":"أربعة شهود يتكلمون بالترتيب، من الأول إلى الأخير. نورث يتكلم قبل إيست. ويست يتكلم مباشرة بعد ساوث. إيست الأخير. ساوث ليس الأول. من هو الثالث؟","opts":[["West","West"],["North","North"],["East","East"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is North, South, West, East. Position 3 is West.","الترتيب الوحيد الذي يوافق كل القواعد هو North، South، West، East. الموضع 3 هو West."],"stretch":true},{"id":"L-sc-1","tier":3,"depth":1,"pillar":"logic","en":"Using only this rule: photograph an item before it is moved, and bag it before it is logged. You have photographed the phone and you have not bagged it. What is the next required step?","ar":"باستخدام هذه القاعدة فقط: صوّر الغرض قبل نقله، وضعه في الكيس قبل تسجيله. صوّرتِ الهاتف ولم تضعيه في الكيس. ما الخطوة المطلوبة التالية؟","opts":[["Bag the phone","ضعي الهاتف في الكيس"],["Log the phone","سجّلي الهاتف"],["Move the phone, then photograph it","انقلي الهاتف ثم صوّريه"],["Leave without a log","غادري بلا تسجيل"]],"ans":0,"why":["Photographing is done. Bagging is the step still in front of logging.","التصوير تم. والتكييس هو الخطوة التي ما زالت قبل التسجيل."]},{"id":"L-sc-2","tier":3,"depth":1,"pillar":"logic","en":"Three cars are in a line. The blue car is immediately ahead of the red car. The green car is last. Which car is first?","ar":"ثلاث سيارات في صف. السيارة الزرقاء مباشرة أمام الحمراء. السيارة الخضراء الأخيرة. أي سيارة هي الأولى؟","opts":[["The blue car","الزرقاء"],["The red car","الحمراء"],["The green car","الخضراء"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["Green is last, and blue is immediately ahead of red, so the only order is blue, red, green.","الخضراء الأخيرة، والزرقاء مباشرة أمام الحمراء، فالترتيب الوحيد: زرقاء، حمراء، خضراء."]},{"id":"L-sc-3","tier":3,"depth":2,"pillar":"logic","en":"Kai works Monday. No one works two days. Noa works the day after Kai. Who works Tuesday?","ar":"كاي يعمل الاثنين. لا أحد يعمل يومين. نوا يعمل اليوم الذي بعد كاي. من يعمل الثلاثاء؟","opts":[["Noa","نوا"],["Kai","كاي"],["Both","كلاهما"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The day after Monday is Tuesday, and Noa is the person assigned to it.","اليوم الذي بعد الاثنين هو الثلاثاء، ونوا هو المعيَّن له."]},{"id":"L-sc-4","tier":3,"depth":2,"pillar":"logic","en":"A note says: the gray door, not the blue door. The package is behind the gray door, on the second floor, not the first. Where is the package?","ar":"تقول ورقة: الباب الرمادي لا الأزرق. الطرد خلف الباب الرمادي، في الطابق الثاني لا الأول. أين الطرد؟","opts":[["Behind the gray door, second floor","خلف الباب الرمادي، الطابق الثاني"],["Behind the blue door, second floor","خلف الباب الأزرق، الطابق الثاني"],["Behind the gray door, first floor","خلف الباب الرمادي، الطابق الأول"],["Behind the blue door, first floor","خلف الباب الأزرق، الطابق الأول"]],"ans":0,"why":["Both corrections are stated. Do not mix the rejected door or the rejected floor back in.","التصحيحان مذكوران. لا تعيدي الباب المرفوض ولا الطابق المرفوض."]},{"id":"L-sc-5","tier":4,"depth":1,"pillar":"logic","en":"Rule: write \"not seen\" when you did not see a detail. Do not copy it from another car. You saw Car A's plate but not its color. Car B is white. What do you write for Car A's color?","ar":"القاعدة: اكتبي «لم يُرَ» حين لا ترين تفصيلًا. ولا تنقليه من سيارة أخرى. رأيت لوحة السيارة أ لا لونها. السيارة ب بيضاء. ماذا تكتبين للون السيارة أ؟","opts":[["not seen","لم يُرَ"],["white","أبيض"],["the same as the plate","مثل اللوحة"],["black, because most cars in the note are black","أسود، لأن معظم السيارات في الورقة سوداء"]],"ans":0,"why":["The rule forbids borrowing Car B's color.","القاعدة تمنع استعارة لون السيارة ب."]},{"id":"L-sc-6","tier":4,"depth":1,"pillar":"logic","en":"Four steps, and only these rules: seal the bag before it leaves the room; label the bag before it is sealed; count the cash before the label is written, and only if a second officer is present. A second officer is present. What is first?","ar":"أربع خطوات، وهذه القواعد فقط: أغلق الكيس قبل أن يغادر الغرفة؛ ضع الملصق قبل الإغلاق؛ عُدّ النقد قبل كتابة الملصق، وفقط إذا حضر ضابط ثانٍ. الضابط الثاني حاضر. ما الخطوة الأولى؟","opts":[["Count the cash","عدّ النقد"],["Write the label","كتابة الملصق"],["Seal the bag","إغلاق الكيس"],["Carry the bag out, then count","إخراج الكيس ثم العد"]],"ans":0,"why":["Counting is required before the label, the label before the seal, and the seal before the bag leaves. Counting is first.","العد مطلوب قبل الملصق، والملصق قبل الإغلاق، والإغلاق قبل مغادرة الكيس. العد أولًا."]},{"id":"L-sc-7","tier":4,"depth":2,"pillar":"logic","en":"Exactly these facts: the alarm started at 2:05. You arrived at 2:14. The manager says the door was already open when the alarm started. Which statement must be true?","ar":"هذه الوقائع فقط: بدأ الإنذار عند 2:05. وصلتِ عند 2:14. يقول المدير إن الباب كان مفتوحًا أصلًا حين بدأ الإنذار. أي عبارة يجب أن تكون صحيحة؟","opts":[["The door was open before you arrived.","الباب كان مفتوحًا قبل وصولك."],["You arrived before the alarm.","وصلتِ قبل الإنذار."],["The manager opened the door at 2:14.","المدير فتح الباب عند 2:14."],["The alarm started because you arrived.","بدأ الإنذار لأنك وصلتِ."]],"ans":0,"why":["Open at 2:05, and you arrived at 2:14, so it was open before you arrived. The other lines add a cause the facts do not give.","مفتوح عند 2:05، ووصلتِ عند 2:14، فكان مفتوحًا قبل وصولك. والأسطر الأخرى تضيف سببًا لا تعطيه الوقائع."]},{"id":"L-sc-8","tier":4,"depth":2,"pillar":"logic","en":"A shift has three posts and three officers: Kai, Noa, Rae. Kai does not take the desk. Noa does not take the car. Rae takes the desk. Who takes the car?","ar":"نوبة فيها ثلاثة مواقع وثلاثة ضباط: كاي، نوا، راي. كاي لا يأخذ المكتب. نوا لا يأخذ السيارة. راي يأخذ المكتب. من يأخذ السيارة؟","opts":[["Kai","كاي"],["Noa","نوا"],["Rae","راي"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["Rae has the desk. Noa cannot take the car, so Noa takes the remaining post (the door) and Kai takes the car.","راي في المكتب. نوا لا يأخذ السيارة، فيأخذ الموقع الباقي (الباب) وكاي يأخذ السيارة."]},{"id":"L-sc-9","tier":5,"depth":1,"pillar":"logic","en":"Rule: a newer officer is placed after every officer with a year or more, even if the newer officer bid first. Badge 214 has six months and bid at 2:00. Badge 188 has two years and bid at 3:50. Who is placed first?","ar":"القاعدة: الضابط الأحدث يُرتَّب بعد كل ضابط له سنة أو أكثر، حتى لو طلب الأحدث أولًا. الشارة 214 لها ستة أشهر وطلبت عند 2:00. الشارة 188 لها سنتان وطلبت عند 3:50. من يُوضع أولًا؟","opts":[["Badge 188","الشارة 188"],["Badge 214","الشارة 214"],["Neither; the times cancel","لا أحد؛ الوقتان يُلغيان بعضهما"],["Whichever bid is closer to 4:00","أي طلب أقرب إلى 4:00"]],"ans":0,"why":["Time would favor 214, but the year-or-more rule places 188 first.","الوقت يفضّل 214، لكن قاعدة السنة أو أكثر تضع 188 أولًا."]},{"id":"L-sc-10","tier":5,"depth":2,"pillar":"logic","en":"Two statements cannot both be true, and one of them is true. Statement 1: the plate starts with K. Statement 2: the plate does not start with K. The clerk says Statement 1. Which conclusion follows?","ar":"عبارتان لا تصدقان معًا، وإحداهما صادقة. العبارة 1: اللوحة تبدأ بـ K. العبارة 2: اللوحة لا تبدأ بـ K. البائع يقول العبارة 1. أي نتيجة تتبع؟","opts":[["Exactly one of the two statements is true, and the clerk's saying it does not by itself prove which.","إحدى العبارتين فقط صادقة، وقول البائع وحده لا يثبت أيهما."],["Statement 1 must be true because the clerk said it.","العبارة 1 يجب أن تكون صادقة لأن البائع قالها."],["Both statements are true.","العبارتان صادقتان."],["The plate starts with a number.","اللوحة تبدأ برقم."]],"ans":0,"why":["The logic problem tells you the two statements contradict and one is true. It does not tell you the clerk is right.","مسألة المنطق تقول إن العبارتين متناقضتان وإحداهما صادقة. ولا تقول إن البائع محق."]},{"id":"L-sc-11","tier":5,"depth":1,"pillar":"logic","en":"You have four facts: the hoodie was corrected from gray to green; the cap stayed red; the direction stayed east; the first plate was cancelled and the second plate is TUV 330. Which set is the one you keep?","ar":"عندكِ أربع وقائع: القلنسوة صُحّحت من رمادي إلى أخضر؛ القبعة بقيت حمراء؛ الاتجاه بقي شرقًا؛ اللوحة الأولى أُلغيت والثانية TUV 330. أي مجموعة تبقين؟","opts":[["Green hoodie, red cap, east, TUV 330","قلنسوة خضراء، قبعة حمراء، شرقًا، TUV 330"],["Gray hoodie, red cap, east, TUV 330","قلنسوة رمادية، قبعة حمراء، شرقًا، TUV 330"],["Green hoodie, gray cap, east, the cancelled plate","قلنسوة خضراء، قبعة رمادية، شرقًا، اللوحة الملغاة"],["Green hoodie, red cap, west, TUV 330","قلنسوة خضراء، قبعة حمراء، غربًا، TUV 330"]],"ans":0,"why":["Keep each correction and every detail the correction did not touch.","أبقي كل تصحيح وكل تفصيل لم يمسسه التصحيح."]},{"id":"L-sc-12","tier":6,"depth":1,"pillar":"logic","en":"Rule 1: visitors out by 9 PM. Rule 2: a nurse on duty may stay. Rule 3: one family member with a blue band may stay with a patient. At 9:20 a man with no band is sitting in a patient's room. He is not the nurse. What do the rules require?","ar":"القاعدة 1: الزوار يغادرون عند 9 مساءً. القاعدة 2: ممرضة في النوبة يجوز لها البقاء. القاعدة 3: قريب واحد بسوار أزرق يجوز له البقاء مع مريض. عند 9:20 رجل بلا سوار جالس في غرفة مريض. هو ليس الممرضة. ماذا توجب القواعد؟","opts":[["He is a visitor past 9, so he is out of line.","هو زائر بعد 9، فهو مخالف."],["Rule 2 lets him stay, because he is in a patient's room.","القاعدة 2 تسمح له بالبقاء لأنه في غرفة مريض."],["Rule 3 lets him stay, even without a band.","القاعدة 3 تسمح له بالبقاء حتى بلا سوار."],["No rule applies after 9.","لا قاعدة تنطبق بعد 9."]],"ans":0,"why":["He is not the nurse and he has no blue band. Rule 1 still applies.","هو ليس الممرضة ولا سوار أزرق له. القاعدة 1 ما زالت تنطبق."],"stretch":true},{"id":"L-sc-13","tier":6,"depth":2,"pillar":"logic","en":"A log shows only two sign-ins after 4:00: Chen at 4:12 with a blue sticker, and Ortiz at 4:28 with a yellow sticker, destination roof, escorted. It is 4:40. Who is logged to the roof?","ar":"سجل يُظهر توقيعين فقط بعد 4:00: تشين عند 4:12 بملصق أزرق، وأورتيز عند 4:28 بملصق أصفر، الوجهة السطح، برفقة. الساعة 4:40. من المسجَّل إلى السطح؟","opts":[["Ortiz","أورتيز"],["Chen","تشين"],["Both","كلاهما"],["No one; 4:40 cancelled the log","لا أحد؛ 4:40 ألغت السجل"]],"ans":0,"why":["Only Ortiz's line names the roof. 4:40 is when you read the log, not a third sign-in.","سطر أورتيز وحده يسمي السطح. و4:40 وقت قراءتك للسجل، لا توقيع ثالث."],"stretch":true},{"id":"L-sc-14","tier":6,"depth":2,"pillar":"logic","en":"Using only the witness's own words: he is sure of a red cap; he is not sure the hoodie was gray; he states the car was a black sedan that turned east; he did not see the passenger. Which detail do you leave out of the sure facts?","ar":"باستخدام كلمات الشاهد وحدها: هو متأكد من قبعة حمراء؛ غير متأكد أن القلنسوة كانت رمادية؛ يذكر أن السيارة سيدان سوداء انعطفت شرقًا؛ لم يرَ الراكب. أي تفصيل تتركينه خارج الوقائع المؤكدة؟","opts":[["The gray hoodie","القلنسوة الرمادية"],["The red cap","القبعة الحمراء"],["The east turn","الانعطاف شرقًا"],["That the passenger was not seen","أن الراكب لم يُرَ"]],"ans":0,"why":["He marked the hoodie as unsure. The rest are stated as sure or as a direct observation.","هو وصف القلنسوة بغير المؤكدة. والباقي مذكور كمؤكد أو كملاحظة مباشرة."],"stretch":true},{"id":"L-ml-a-0","tier":5,"depth":1,"pillar":"logic","en":"Four reports are read from first to last. Hana is somewhere before Ika. Dee is last. Ika is immediately after Hana. Bo is not first. Who is first?","ar":"أربعة تقارير تُقرأ من الأول إلى الأخير. هانا قبل إيكا في مكان ما. دي الأخيرة. إيكا مباشرة بعد هانا. بو ليس الأول. من هو الأول؟","opts":[["Hana","Hana"],["Ika","Ika"],["Bo","Bo"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is Hana, Ika, Bo, Dee. Position 1 is Hana.","الترتيب الوحيد الذي يوافق كل القواعد هو Hana، Ika، Bo، Dee. الموضع 1 هو Hana."]},{"id":"L-ml-a-2","tier":5,"depth":1,"pillar":"logic","en":"Four reports are read from first to last. Hana is somewhere before Ika. Dee is last. Ika is immediately after Hana. Bo is not first. Who is third?","ar":"أربعة تقارير تُقرأ من الأول إلى الأخير. هانا قبل إيكا في مكان ما. دي الأخيرة. إيكا مباشرة بعد هانا. بو ليس الأول. من هو الثالث؟","opts":[["Bo","Bo"],["Hana","Hana"],["Ika","Ika"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is Hana, Ika, Bo, Dee. Position 3 is Bo.","الترتيب الوحيد الذي يوافق كل القواعد هو Hana، Ika، Bo، Dee. الموضع 3 هو Bo."]},{"id":"L-ml-b-0","tier":5,"depth":2,"pillar":"logic","en":"Four keys are issued from first to last. Noa is first. Rae is immediately after Kai. Sol is last. Kai is before Sol. Who is first?","ar":"أربعة مفاتيح تُسلَّم من الأول إلى الأخير. نوا الأول. راي مباشرة بعد كاي. سول الأخير. كاي قبل سول. من هو الأول؟","opts":[["Noa","Noa"],["Kai","Kai"],["Rae","Rae"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is Noa, Kai, Rae, Sol. Position 1 is Noa.","الترتيب الوحيد الذي يوافق كل القواعد هو Noa، Kai، Rae، Sol. الموضع 1 هو Noa."]},{"id":"L-ml-b-2","tier":5,"depth":2,"pillar":"logic","en":"Four keys are issued from first to last. Noa is first. Rae is immediately after Kai. Sol is last. Kai is before Sol. Who is third?","ar":"أربعة مفاتيح تُسلَّم من الأول إلى الأخير. نوا الأول. راي مباشرة بعد كاي. سول الأخير. كاي قبل سول. من هو الثالث؟","opts":[["Rae","Rae"],["Kai","Kai"],["Noa","Noa"],["Cannot be determined","لا يمكن الجزم"]],"ans":0,"why":["The only order that fits every rule is Noa, Kai, Rae, Sol. Position 3 is Rae.","الترتيب الوحيد الذي يوافق كل القواعد هو Noa، Kai، Rae، Sol. الموضع 3 هو Rae.
