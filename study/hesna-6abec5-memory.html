ys OPEN and advertises POKE for $12.99.","الثلاثاء 4 مارس، الساعة 3:47 مساءً، عند تقاطع شارع كابيولاني وشارع كاهيكا. رجل يرتدي قبعة حمراء وسترة رمادية بقلنسوة وبنطال جينز أزرق يجري شرقًا خارجًا من KALANI MARKET (1452 شارع كابيولاني) حاملًا حقيبة سفر سوداء. واجهة المتجر الأمامية محطّمة. البائع، بمئزر أخضر، يوجّه هاتفه نحوه من الباب. محفظة بنية ملقاة على الرصيف. رجل مسن بقميص أزرق معه عكاز وكلب بني يجلس قرب الساعة. فتاة بفستان وردي تمسك بالونًا بنفسجيًا بجانب لوح تزلج. رجل أصلع بقميص برتقالي وسروال قصير أسود يقف عند موقف الحافلة رقم 13 ممسكًا هاتفًا. امرأة بيضاء الشعر بفستان بنفسجي تحمل مظلة صفراء أمام ISLAND PHARMACY (1460). يوجد صنبور إطفاء أحمر. في الشارع: شاحنة بيضاء لـ ALOHA PLUMBING (808-555-0142، لوحة PLM 316)، وسيارة سيدان زرقاء (لوحة HCX 804)، وشاحنة بيك أب خضراء (لوحة KTB 529) متجهة شرقًا تقودها امرأة بضفيرة داكنة وقميص أصفر، وسيارة أجرة صفراء (CAB 77). لافتة المتجر تقول OPEN وتعلن عن POKE بسعر 12.99 دولارًا."],"q":[["3:47 — What time was shown.","3:47 — ما الوقت الذي كان معروضًا.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["KALANI MARKET — What was the market's name.","KALANI MARKET — ما اسم المتجر.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["1452 — What was the market's street number.","1452 — ما رقم المتجر في الشارع.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["Kaheka St — Which street was the market on.","Kaheka St — في أي شارع كان المتجر.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],1],["Kaheka St — Which cross street was on the sign.","Kaheka St — ما اسم الشارع المتقاطع على اللافتة.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["Red — What color was the running man's cap.","أحمر — ما لون قبعة الرجل الذي يجري.",["A. The statement is true.","B. The statement is fals 333\" font-size=\"11\" text-anchor=\"middle\">NOE: backpack blue, then black\u003c/text>\n\u003c/svg>","desc":["Tuesday, 4:20 PM, lobby of 1427 16th Avenue at Kilauea. Study the picture and this paragraph together. A resident in a white blouse, black slacks, and a red scarf (unit 3B) walks in with a brown grocery bag. A man in a green polo, khaki shorts, and a white cap (unit 12A) stands at the mailboxes on a phone. A teenager in a gray hoodie, ripped blue jeans, and red sneakers runs west with a black backpack; the hood hides the face. A package marked 4C — DO NOT BEND was by the door and is gone. Manager NOE, in a blue vest, points at the stairwell. He first says the backpack was blue, then corrects himself: black. A small white dog with no leash is by the elevator, which shows 2. A yellow bicycle is against the rail. Keys with a blue fob are on the counter. Outside: silver SUV plate HNL 640, bearded driver in sunglasses waiting; red compact plate KXM 218, empty. A brick props the fire door.","الثلاثاء، 4:20 مساءً، ردهة 1427 الجادة 16 عند كيلوا. ادراسي الصورة وهذه الفقرة معًا. مقيمة ببلوزة بيضاء وبنطال أسود ووشاح أحمر (الوحدة 3B) تدخل بكيس بقالة بني. رجل بقميص أخضر وشورت كاكي وقبعة بيضاء (الوحدة 12A) عند صناديق البريد على الهاتف. مراهق بقلنسوة رمادية وجينز أزرق ممزق وحذاء أحمر يجري غربًا بحقيبة سوداء؛ القلنسوة تخفي الوجه. طرد مكتوب عليه 4C — DO NOT BEND كان عند الباب واختفى. المدير NOE بسترة زرقاء يشير إلى الدرج. قال أولًا إن الحقيبة زرقاء ثم صحّح: سوداء. كلب أبيض صغير بلا مقود عند المصعد الذي يُظهر 2. دراجة صفراء على السياج. مفاتيح بحلقة زرقاء على المنضدة. في الخارج: دفع رباعي فضي لوحة HNL 640، سائق بلحية ونظارة ينتظر؛ سيارة حمراء لوحة KXM 218 فارغة. طوبة تسند باب الحريق."],"q":[["4:20 PM — What time was shown.","4:20 م — ما الوقت الذي ظهر.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["1427 — What was the building number.","1427 — ما رقم المبنى.",["A. The statement is true.","B. The statement is false."],  441\u003c/text>\n\u003c/svg>","desc":["Wednesday, 11:06 AM, parking level P2, yellow pillar C, stall 18. Study the picture and this paragraph together. Black sedan A: plate NRP 441, a dent on the left rear door, driver a woman with a braid and a yellow top, engine running, pointed east. Black sedan B: plate NRP 414, no dent, a man in a blue shirt, parked, engine off. The radio says: disregard 414, the plate is 441. A green shopping bag and a child seat are in a cart by pillar C. An attendant in an orange vest is at the booth. A black motorcycle, plate M 28, is in stall 20. A white van, plate PLB 902, blocks part of the west exit; its driver is not the attendant. An oil spot is in stall 18 under sedan A. A ticket on the ground reads 10:41 AM. The reporting person, in a gray hoodie, points at sedan A.","الأربعاء، 11:06 صباحًا، مستوى الموقف P2، العمود الأصفر C، الموقف 18. ادراسي الصورة وهذه الفقرة معًا. سيدان سوداء أ: لوحة NRP 441، انبعاج في الباب الخلفي الأيسر، سائقة بضفيرة وقميص أصفر، المحرك يعمل، متجهة شرقًا. سيدان سوداء ب: لوحة NRP 414، بلا انبعاج، رجل بقميص أزرق، متوقفة، المحرك مطفأ. اللاسلكي يقول: تجاهلوا 414، اللوحة 441. كيس تسوق أخضر ومقعد طفل في عربة بجانب العمود C. موظف بسترة برتقالية عند الكشك. دراجة نارية سوداء لوحة M 28 في الموقف 20. شاحنة بيضاء لوحة PLB 902 تسد جزءًا من مخرج الغرب؛ سائقها ليس الموظف. بقعة زيت في الموقف 18 تحت السيدان أ. تذكرة على الأرض 10:41 صباحًا. المبلّغ بقلنسوة رمادية يشير إلى السيدان أ."],"q":[["11:06 AM — What time was the scene.","11:06 ص — ما وقت المشهد.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["10:41 AM — What time was on the ticket.","10:41 ص — ما الوقت على التذكرة.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["P2 — What parking level was it.","P2 — ما مستوى الموقف.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0],["A — What letter was on the yellow pilla       q = '<rect x="' + x + '" y="' + (y + 6) + '" width="' + w + '" height="34" rx="10" fill="' + c + '" stroke="#333"/><rect x="' + (x + w * 0.25) + '" y="' + (y - 12) + '" width="' + (w * 0.5) + '" height="22" rx="7" fill="' + c + '" stroke="#333"/>';
      if (v.t === "taxi") q += '<rect x="' + (x + w / 2 - 18) + '" y="' + (y - 24) + '" width="36" height="12" fill="#222"/>' + T(x + w / 2, y - 14, "TAXI", 9, "#fc0");
    }
    q += '<rect x="' + (x + w / 2 - 34) + '" y="' + (y + 20) + '" width="68" height="16" fill="#ffd" stroke="#333"/>' + T(x + w / 2, y + 33, v.pl, 12, "#111", 1) + '<circle cx="' + (x + 22) + '" cy="' + (y + 42) + '" r="10" fill="#222"/><circle cx="' + (x + w - 22) + '" cy="' + (y + 42) + '" r="10" fill="#222"/>' + T(v.d === "E" ? x + w + 10 : x - 10, y + 20, v.d === "E" ? "→" : "←", 22, "#fff", 1);
    o += q;
  });
  return o + "</svg>" + credit;
}

</script>
<script>(function(){var D=window.MD_DATA,K='hesnaMemory',st={};
try{st=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
var HX={red:'#d32f2f',blue:'#1e5bd8',green:'#2e7d32',yellow:'#fbc02d',orange:'#fb8c00',purple:'#7b1fa2',pink:'#f48fb1',white:'#f5f5f5',black:'#222',gray:'#888',brown:'#6d4c41',blonde:'#e8c66a'};
function bi(e,a){return '<span data-en>'+esc(e)+'</span><span data-ar>'+esc(a)+'</span>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(x,y,t,sz,f,w){return '<text x="'+x+'" y="'+y+'" font-size="'+(sz||12)+'" text-anchor="middle" fill="'+(f||'#111')+'"'+(w?' font-weight="bold"':'')+'>'+esc(t)+'</text>'}
function credit(){return '<figcaption class="si-credit">'+bi('Made from SI and Biological SI Partner','صُنع من SI وBiological SI Partner')+'</figcaption>'}
function scene(s){return hesnaScene(s)}
function sceneWeek(s){return s.week||(s.scene==='b7426'?1:2)}
function studyWeek1(){try{var a=JSON.parse(localStorage.getItem('hesnaAdapt')||'null');if(!a||!a.days)return null;var sum=0,n=0;for(var d=1;d<=7;d++){var r=a.days[String(d)];if(!r||r.pct==null)continue;var c=r.corePct!=null?r.corePct:r.pct;if(r.extraPct!=null&&c>=95)c=r.extraPct;sum+=c;n++}if(n<4)return null;return Math.round(sum/n)}catch(err){return null}}
function adaptPack(){try{return JSON.parse(localStorage.getItem('hesnaAdapt')||'null')}catch(e){return null}}
function adaptMem(id){var a=adaptPack();if(!a||!a.mem||a.mem[id]==null)return null;return a.mem[id]}
function studyCleared(){var a=adaptPack();return !!(a&&a.weeks&&a.weeks['1']&&a.weeks['1'].cleared)}
function week2Bar(){var signal=Math.max(adaptMem('b7426-3')||0,studyWeek1()||0);if(signal>=95)return 90;if(signal>=85)return 85;return 80}
function passBarFor(s){if(!s||!s.pic||sceneWeek(s)===1)return 80;var bar=week2Bar(),prev=adaptMem('b7426-'+(s.band||1));if(prev!=null&&prev<85)bar=Math.max(bar,85);return Math.min(90,bar)}
function bandOptional(s){return !!(s&&s.pic&&sceneWeek(s)===2&&s.band===1&&(adaptMem('b7426-1')||0)>=95&&(adaptMem('b7426-3')||0)>=90)}
function weakBands(){var rows=[[1,'broad scene','الصورة الكبيرة'],[2,'attributes','الصفات'],[3,'fine detail','التفاصيل الدقيقة']],en=[],ar=[];rows.forEach(function(n){var sc=adaptMem('b7426-'+n[0]);if(sc!=null&&sc<85){en.push(n[1]+' '+sc+'%');ar.push(n[2]+' '+sc+'%')}});return en.length?[en.join(', '),ar.join('، ')]:null}
function photoPack(){var names=[],groups={};D.S.forEach(function(s,i){if(!s.pic)return;if(!groups[s.scene]){groups[s.scene]=[];names.push(s.scene)}groups[s.scene].push(i)});return {names:names,groups:groups}}
function sceneUnlocked(){return true}
function picUnlocked(){return true}
function focusPic(){var ps=photoPack(),hit=-1;ps.names.forEach(function(name){ps.groups[name].forEach(function(i){var s=D.S[i];if(bandOptional(s)&&(st[s.id]==null))return;if(picUnlocked(i)&&(st[s.id]||0)<95)hit=i})});return hit}
var app=document.getElementById('md-app'),timer=null;
function passed(lv){var bar=lv>=3?week2Bar():80;return D.S.some(function(s){return !s.pic&&s.lv==lv&&(st[s.id]||0)>=bar})}
function hotLevel(lv){return D.S.some(function(s){return !s.pic&&s.lv==lv&&(st[s.id]||0)>=95})}
function unlocked(){return true}
function mins(s){var m=Math.round((s.secs||120)/60);return bi(m+'-minute view', m===2?'مشاهدة لمدة دقيقتين':'مشاهدة لمدة '+m+' دقائق')}
function weekName(n){return {1:'الأول',2:'الثاني',3:'الثالث',4:'الرابع'}[n]||String(n)}
function home(){clearInterval(timer);var buckets={};
D.S.forEach(function(s,i){var w=s.week||1;if(!buckets[w])buckets[w]=[];buckets[w].push(i)});
var o='';
[1,2,3,4].forEach(function(week){
  var ids=buckets[week]||[];
  o+='<section class="sp-week" id="mem-week-'+week+'"><h2>'+bi('Week '+week,'الأسبوع '+weekName(week))+'</h2><div class="sp-grid">';
  ids.forEach(function(i){
    var s=D.S[i];
    var title=s.title?bi(s.title[0],s.title[1]):bi('Exercise '+s.id,'التمرين '+s.id);
    var best=st[s.id]!=null?' · '+st[s.id]+'%':'';
    o+='<div class="sp-day"><h3>'+title+'</h3><p>'+s.q.length+' '+bi('questions','سؤالًا')+best+'</p><button type="button" class="sp-btn" data-go="'+i+'">'+bi('Start','ابدئي')+'</button></div>';
  });
  o+='</div></section>';
});
app.innerHTML=o;scrollTo(0,0)}

function memArea(en){var s=String(en||'').toLowerCase();
if(/shirt|pants|hat|hair|jacket|shoe|dress|vest|clothing|wore|wearing|backpack|umbrella|braid/.test(s))return ['Memory: clothing details','الذاكرة: تفاصيل الملابس'];
if(/carried|carrying|phone|cup|bag|box/.test(s))return ['Memory: what people carried','الذاكرة: ما يحمله الأشخاص'];
if(/plate|license|badge|number/.test(s))return ['Memory: numbers and plates','الذاكرة: الأرقام واللوحات'];
if(/time|clock/.test(s))return ['Memory: the time','الذاكرة: الوقت'];
if(/street|sign|cafe|gym/.test(s))return ['Memory: signs and names','الذاكرة: اللافتات والأسماء'];
if(/car|van|truck|sedan|vehicle|bike|bicycle|bus/.test(s))return ['Memory: vehicles','الذاكرة: المركبات'];
if(/color/.test(s))return ['Memory: colors','الذاكرة: الألوان'];
if(/how many|count/.test(s))return ['Memory: counts','الذاكرة: الأعداد'];
return ['Memory: scene details','الذاكرة: تفاصيل المشهد']}
function view(i){var s=D.S[i],left=s.secs||120;app.innerHTML='<p class="md-timer" aria-live="polite"></p><div>'+scene(s)+'</div><button type="button" class="sp-btn" data-q="'+i+'">'+bi("I'm ready, hide it",'أنا جاهزة، أخفيه')+'</button>';
var el=app.querySelector('.md-timer');function tick(){el.innerHTML=bi('Time left: ','الوقت المتبقي: ')+Math.floor(left/60)+':'+('0'+left%60).slice(-2);if(left--<=0){quiz(i)}}tick();timer=setInterval(tick,1000);scrollTo(0,0)}
function quiz(i){clearInterval(timer);var s=D.S[i],o='<p class="hs-key">'+bi('Recall of Visual Details. Statements: A true, B false. Then: A yes, it was in the picture, B no. If only part was shown, it was present.','استرجاع التفاصيل البصرية. العبارات: A صحيحة، B خطأ. ثم: A نعم كان في الصورة، B لا. إذا ظهر جزء منه فهو موجود.')+'</p><ol class="md-qs">';
s.q.forEach(function(q,j){o+='<li class="sp-day"><p>'+bi(q[0],q[1])+'</p>';q[2].forEach(function(e,k){o+='<label class="md-opt"><input type="radio" name="q'+j+'" value="'+k+'"> '+bi(e,q[3][k])+'</label>'});o+='</li>'});
app.innerHTML=o+'</ol><button type="button" class="sp-btn" data-r="'+i+'">'+bi('Submit answers','إرسال الإجابات')+'</button>';scrollTo(0,0)}
function result(i){var s=D.S[i],ok=0,miss=[],areas={};s.q.forEach(function(q,j){var c=app.querySelector('input[name=q'+j+']:checked'),a=c?+c.value:-1,g=a==q[4];if(g){ok++;return}miss.push({q:q,a:a});var area=memArea(q[0]);areas[area[0]]=area});
var p=Math.round(100*ok/s.q.length);st[s.id]=Math.max(st[s.id]||0,p);save();
var nxt=i+1<D.S.length?i+1:-1;
var study=Object.keys(areas).length?'<ul>'+Object.keys(areas).map(function(k){return '<li>'+bi(areas[k][0],areas[k][1])+'</li>'}).join('')+'</ul>':'<p>'+bi('Nothing to review on this quiz.','لا شيء للمراجعة في هذا الاختبار.')+'</p>';
var rv=miss.length?'<ol class="md-qs">'+miss.map(function(m){var q=m.q,a=m.a;return '<li class="sp-day md-bad"><p>'+bi(q[0],q[1])+'</p><p>'+bi('Your answer: ','إجابتك: ')+(a<0?bi('(none)','(لا شيء)'):bi(q[2][a],q[3][a]))+'</p><p><strong>'+bi('Correct: ','الصحيح: ')+bi(q[2][q[4]],q[3][q[4]])+'</strong></p></li>'}).join('')+'</ol>':'<p>'+bi('No misses.','لا أخطاء.')+'</p>';
app.innerHTML='<section class="hs-results"><h2>'+bi('Score: '+ok+'/'+s.q.length+' ('+p+'%)','النتيجة: '+ok+'/'+s.q.length+' ('+p+'%)')+'</h2><h3>'+bi('Study up on','ذاكري')+'</h3>'+study+'<h3>'+bi('Missed','ما فات')+'</h3>'+rv+'</section><button type="button" class="sp-btn" data-go="'+i+'">'+bi('Retry','أعيدي')+'</button>'+(nxt>=0?'<button type="button" class="sp-btn" data-go="'+nxt+'">'+bi('Next drill','التمرين التالي')+'</button>':'')+'<button type="button" class="sp-btn" data-home="1">'+bi('All drills','كل التمارين')+'</button>';scrollTo(0,0)}
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;if(d.go!=null)view(+d.go);else if(d.q!=null)quiz(+d.q);else if(d.r!=null)result(+d.r);else if(d.home)home()});home()})();
</script>
