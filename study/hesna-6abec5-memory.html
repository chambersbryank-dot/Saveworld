an in an orange shirt and black shorts stands by the Route 13 bus stop holding a phone. A white-haired woman in a purple dress holds a yellow umbrella in front of ISLAND PHARMACY (1460). There is a red fire hydrant. On the street: a white ALOHA PLUMBING van (808-555-0142, plate PLM 316), a blue sedan (plate HCX 804), a green pickup (plate KTB 529) heading east, driven by a woman with a dark braid and a yellow top, and a yellow taxi (CAB 77). The market sign says OPEN and advertises POKE for $12.99.","الثلاثاء 4 مارس، الساعة 3:47 مساءً، عند تقاطع شارع كابيولاني وشارع كاهيكا. رجل يرتدي قبعة حمراء وسترة رمادية بقلنسوة وبنطال جينز أزرق يجري شرقًا خارجًا من KALANI MARKET (1452 شارع كابيولاني) حاملًا حقيبة سفر سوداء. واجهة المتجر الأمامية محطّمة. البائع، بمئزر أخضر، يوجّه هاتفه نحوه من الباب. محفظة بنية ملقاة على الرصيف. رجل مسن بقميص أزرق معه عكاز وكلب بني يجلس قرب الساعة. فتاة بفستان وردي تمسك بالونًا بنفسجيًا بجانب لوح تزلج. رجل أصلع بقميص برتقالي وسروال قصير أسود يقف عند موقف الحافلة رقم 13 ممسكًا هاتفًا. امرأة بيضاء الشعر بفستان بنفسجي تحمل مظلة صفراء أمام ISLAND PHARMACY (1460). يوجد صنبور إطفاء أحمر. في الشارع: شاحنة بيضاء لـ ALOHA PLUMBING (808-555-0142، لوحة PLM 316)، وسيارة سيدان زرقاء (لوحة HCX 804)، وشاحنة بيك أب خضراء (لوحة KTB 529) متجهة شرقًا تقودها امرأة بضفيرة داكنة وقميص أصفر، وسيارة أجرة صفراء (CAB 77). لافتة المتجر تقول OPEN وتعلن عن POKE بسعر 12.99 دولارًا."],"q":[["3:47 — What time was shown.","3:47 — ما الوقت الذي كان معروضًا.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0,"The scene shows 3:47. See it in the picture: 3:47 — What time was shown. The statement is true.","المشهد يُظهر 3:47. هذا ظاهر في الصورة: 3:47 — ما الوقت الذي كان معروضًا. العبارة صحيحة."],["KALANI MARKET — What was the market's name.","KALANI MARKET — ما اسم المتجر.",["A. The statement is true.","B. The statement is false."],["A. العبارة صحيحة.","B. العبارة خطأ."],0,"The scene shows KALANI MARKET. See it in the picture: KALAN function sceneUnlocked(){return true}
function picUnlocked(){return true}
function focusPic(){var ps=photoPack(),hit=-1;ps.names.forEach(function(name){ps.groups[name].forEach(function(i){var s=D.S[i];if(bandOptional(s)&&(st[s.id]==null))return;if(picUnlocked(i)&&(st[s.id]||0)<95)hit=i})});return hit}
var app=document.getElementById('md-app'),timer=null;
function passed(lv){var bar=lv>=3?week2Bar():80;return D.S.some(function(s){return !s.pic&&s.lv==lv&&(st[s.id]||0)>=bar})}
function hotLevel(lv){return D.S.some(function(s){return !s.pic&&s.lv==lv&&(st[s.id]||0)>=95})}
function unlocked(){return true}
function mins(s){var m=Math.round((s.secs||120)/60);return bi(m+'-minute view', m===2?'مشاهدة لمدة دقيقتين':'مشاهدة لمدة '+m+' دقائق')}
function weekName(n){return {1:'الأول',2:'الثاني',3:'الثالث',4:'الرابع'}[n]||String(n)}
function home(){clearInterval(timer);var buckets={};
D.S.forEach(function(s,i){var w=s.week||1;if(!buckets[w])buckets[w]=[];buckets[w].push(i)});
var o='';
[1,2,3,4].forEach(function(week){
  var ids=buckets[week]||[];
  o+='<section class="sp-week" id="mem-week-'+week+'"><h2>'+bi('Week '+week,'الأسبوع '+weekName(week))+'</h2><div class="sp-grid">';
  ids.forEach(function(i){
    var s=D.S[i];
    var title=s.title?bi(s.title[0],s.title[1]):bi('Exercise '+s.id,'التمرين '+s.id);
    var best=st[s.id]!=null?' · '+st[s.id]+'%':'';
    o+='<div class="sp-day"><h3>'+title+'</h3><p>'+s.q.length+' '+bi('questions','سؤالًا')+best+'</p><button type="button" class="sp-btn" data-go="'+i+'">'+bi('Start','ابدئي')+'</button></div>';
  });
  o+='</div></section>';
});
app.innerHTML=o;scrollTo(0,0)}

function memArea(en){var s=String(en||'').toLowerCase();
if(/shirt|pants|hat|hair|jacket|shoe|dress|vest|clothing|wore|wearing|backpack|umbrella|braid/.test(s))return ['Memory: clothing details','الذاكرة: تفاصيل الملابس'];
if(/carried|carrying|phone|cup|bag|box/.test(s))return ['Memory: what people carried','الذاكرة: ما يحمله الأشخاص'];
if(/plate|license|badge|number/.test(s))return ['Memory: numbers and plates','الذاكرة: الأرقام واللوحات'];
if(/time|clock/.test(s))return ['Memory: the time','الذاكرة: الوقت'];
if(/street|sign|cafe|gym/.test(s))return ['Memory: signs and names','الذاكرة: اللافتات والأسماء'];
if(/car|van|truck|sedan|vehicle|bike|bicycle|bus/.test(s))return ['Memory: vehicles','الذاكرة: المركبات'];
if(/color/.test(s))return ['Memory: colors','الذاكرة: الألوان'];
if(/how many|count/.test(s))return ['Memory: counts','الذاكرة: الأعداد'];
return ['Memory: scene details','الذاكرة: تفاصيل المشهد']}
function view(i){var s=D.S[i],left=s.secs||120;app.innerHTML='<p class="md-timer" aria-live="polite"></p><div>'+scene(s)+'</div><button type="button" class="sp-btn" data-q="'+i+'">'+bi("I'm ready, hide it",'أنا جاهزة، أخفيه')+'</button>';
var el=app.querySelector('.md-timer');function tick(){el.innerHTML=bi('Time left: ','الوقت المتبقي: ')+Math.floor(left/60)+':'+('0'+left%60).slice(-2);if(left--<=0){quiz(i)}}tick();timer=setInterval(tick,1000);scrollTo(0,0)}
function quiz(i){clearInterval(timer);var s=D.S[i],o='<p class="hs-key">'+bi('Recall of Visual Details. Statements: A true, B false. Then: A yes, it was in the picture, B no. If only part was shown, it was present.','استرجاع التفاصيل البصرية. العبارات: A صحيحة، B خطأ. ثم: A نعم كان في الصورة، B لا. إذا ظهر جزء منه فهو موجود.')+'</p><ol class="md-qs">';
s.q.forEach(function(q,j){o+='<li class="sp-day"><p>'+bi(q[0],q[1])+'</p>';q[2].forEach(function(e,k){o+='<label class="md-opt"><input type="radio" name="q'+j+'" value="'+k+'"> '+bi(e,q[3][k])+'</label>'});o+='</li>'});
app.innerHTML=o+'</ol><button type="button" class="sp-btn" data-r="'+i+'">'+bi('Submit answers','إرسال الإجابات')+'</button>';scrollTo(0,0)}
function result(i){var s=D.S[i],ok=0,miss=[],areas={};s.q.forEach(function(q,j){var c=app.querySelector('input[name=q'+j+']:checked'),a=c?+c.value:-1,g=a==q[4];if(g){ok++;return}miss.push({q:q,a:a});var area=memArea(q[0]);areas[area[0]]=area});
var p=Math.round(100*ok/s.q.length);st[s.id]=Math.max(st[s.id]||0,p);save();
var nxt=i+1<D.S.length?i+1:-1;
var study=Object.keys(areas).length?'<ul>'+Object.keys(areas).map(function(k){return '<li>'+bi(areas[k][0],areas[k][1])+'</li>'}).join('')+'</ul>':'<p>'+bi('Nothing to review on this quiz.','لا شيء للمراجعة في هذا الاختبار.')+'</p>';
var rv=miss.length?'<ol class="md-qs">'+miss.map(function(m){var q=m.q,a=m.a;return '<li class="sp-day md-bad"><p>'+bi(q[0],q[1])+'</p><p>'+bi('Your answer: ','إجابتك: ')+(a<0?bi('(none)','(لا شيء)'):bi(q[2][a],q[3][a]))+'</p><p><strong>'+bi('Correct: ','الصحيح: ')+bi(q[2][q[4]],q[3][q[4]])+'</strong></p>'+(q[5]?'<p><strong>'+bi('Why: ','لماذا: ')+'</strong>'+bi(q[5],q[6]||q[5])+'</p>':'')+'</li>'}).join('')+'</ol>':'<p>'+bi('No misses.','لا أخطاء.')+'</p>';
app.innerHTML='<section class="hs-results"><h2>'+bi('Score: '+ok+'/'+s.q.length+' ('+p+'%)','النتيجة: '+ok+'/'+s.q.length+' ('+p+'%)')+'</h2><h3>'+bi('Study up on','ذاكري')+'</h3>'+study+'<h3>'+bi('Missed','ما فات')+'</h3>'+rv+'</section><button type="button" class="sp-btn" data-go="'+i+'">'+bi('Retry','أعيدي')+'</button>'+(nxt>=0?'<button type="button" class="sp-btn" data-go="'+nxt+'">'+bi('Next drill','التمرين التالي')+'</button>':'')+'<button type="button" class="sp-btn" data-home="1">'+bi('All drills','كل التمارين')+'</button>';scrollTo(0,0)}
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;if(d.go!=null)view(+d.go);else if(d.q!=null)quiz(+d.q);else if(d.r!=null)result(+d.r);else if(d.home)home()});home()})();
</script>
</main>
