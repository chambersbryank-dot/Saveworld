# Oct 16 SI Helper pilot (Teachers page). Deployed with: bash scripts/si-wrangler.sh deploy --config workers/si-helper/wrangler.toml
# Secrets (set with `wrangler secret put`, never in the repo): TURNSTILE_SECRET, IP_SALT.
name = "si-helper"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[ai]
binding = "AI"

[[vectorize]]
binding = "VEC"
index_name = "si-helper-site"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]

[[ratelimits]]
name = "RL_MIN"
namespace_id = "41016"
simple = { limit = 10, period = 60 }

# Oct 16: aggregate events (POST /e): 60 batches/min per visitor; Analytics Engine dataset (counts only, no identifiers)
[[ratelimits]]
name = "RL_EV"
namespace_id = "41018"
simple = { limit = 60, period = 60 }

[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "sp_events"

# Oct 16: correction reports: 3/min per visitor (plus REPORTS_PER_IP_DAY in the Guard)
[[ratelimits]]
name = "RL_REP"
namespace_id = "41019"
simple = { limit = 3, period = 60 }

# Oct 16: email via Cloudflare Email Routing (already active on savingplanets.com; no DNS/MX change). Only this verified destination.
[[send_email]]
name = "MAIL"
destination_address = "media@savingplanets.com"

# Oct 16: unanswered-question log (question text scrubbed of personal details + language + topic tab + UTC minute; no IP/UA/IDs).
# Exported weekly by scripts/unanswered-pull.py (Cloudflare API, token on the box). Entries expire after UQ_TTL_DAYS.
[[kv_namespaces]]
binding = "UQ"
id = "b88ab6c1a4d64d38a0d09ac3b0a4e17c"   # si-helper-unanswered

[vars]
UQ_DAY_CAP = "200"          # max NEW unanswered questions saved per UTC day (all visitors); 5 new per visitor per day (Guard)
UQ_TTL_DAYS = "45"          # unanswered entries auto-delete after 45 days
MAIL_FROM = "site-forms@savingplanets.com"
MAIL_TO = "media@savingplanets.com"
REPORTS_PER_IP_DAY = "10"
DAILY_USD_CAP = "1.00"      # hard stop for Workers AI spend per UTC day (pilot)
PER_IP_DAY = "50"           # questions per IP per UTC day
USD_PER_KNEURON = "0.011"   # Workers AI price per 1,000 neurons (developers.cloudflare.com/workers-ai/platform/pricing)
RESERVE_USD = "0.004"       # pre-charged per question before any model runs, settled to the measured neurons after
MIN_SCORE = "0.50"          # retrieval similarity floor; below it SI says it does not know
ORIGINS = "https://www.savingplanets.com,https://savingplanets.com"

[observability]
enabled = false             # no request logs: question text is never logged or stored
