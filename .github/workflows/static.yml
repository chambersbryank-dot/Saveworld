name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys: back-to-back pushes otherwise collide ("in progress deployment" 400).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Oct 26: IndexNow after every Pages deploy (key file aa19429b…txt already on site root).
  # Does not change Cloudflare DNS/proxy/settings. post-deploy.sh never fails the workflow.
  ping:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: IndexNow + SEO lint (post-deploy)
        run: bash scripts/post-deploy.sh || true
