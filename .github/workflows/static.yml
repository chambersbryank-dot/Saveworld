name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys: back-to-back pushes otherwise collide ("in progress deployment" 400).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastmod is `git log -1 --format=%cs` per page. A depth-1 checkout has no history for unchanged files.
          fetch-depth: 0

      - name: Refresh sitemap lastmod
        run: python3 scripts/i18n-sitemap.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      # The artifact API can lag the upload step. Deploy then reports zero artifacts.
      - name: Wait for the Pages artifact
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Oct 26: IndexNow after every push to main (key file aa19429b…txt at the site root).
  # One POST to api.indexnow.org is shared with Bing, Yandex, Naver, and Seznam. Google is not a participant.
  # Does not change Cloudflare DNS/proxy/settings. post-deploy.sh never fails the workflow.
  ping:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: IndexNow + SEO lint (post-deploy)
        run: bash scripts/post-deploy.sh || true
