name: CodeQL
on:
  push: { branches: [main], paths: ['**.js', '**.py', '**.mjs', '.github/workflows/codeql.yml'] }
  pull_request: { branches: [main] }
  schedule: [ { cron: "41 14 * * 3" } ]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { language: [javascript-typescript, python] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", build-mode: none }
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:${{ matrix.language }}" }
