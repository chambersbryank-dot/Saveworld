name: Monthly release
# On the 1st of each month (or by hand), tags vYYYY.MM for the previous month and publishes a release whose notes
# come from Changelog.html (solutions released that month). Uses only GITHUB_TOKEN.
on:
  schedule: [ { cron: "5 18 1 * *" } ]
  workflow_dispatch:
    inputs:
      month: { description: "Month to release, YYYY-MM (default: previous month)", required: false }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from Changelog
        id: n
        run: |
          M="${{ github.event.inputs.month }}"; [ -n "$M" ] || M=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          echo "tag=v${M/-/.}" >> "$GITHUB_OUTPUT"
          python3 scripts/release-notes.py "$M" > notes.md
      - name: Publish release (skips if the tag exists)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "${{ steps.n.outputs.tag }}" >/dev/null 2>&1 && { echo "exists"; exit 0; }
          gh release create "${{ steps.n.outputs.tag }}" --target "$GITHUB_SHA" --title "Saving Planets ${{ steps.n.outputs.tag }}" --notes-file notes.md
